front:
  text: 王序昔范文正公作諸生時輒以天下為己任嘗曰異日不為良相便為良醫蓋以醫與相迹雖殊而濟人利物之心則一也四明高鼓峰先生由儒而精於醫其察脈辨症處方用藥理解超豁迥出凡流一時負盛名幾如秦越人之聽聲寫形隨俗為變嗚乎神矣晚年輯生平所治驗案若干卷並繪五行五臟天人一理等圖名其書曰己任其即文正之心歟李氏瀕湖著本草綱目徵引古今書籍最稱繁富而極精核茲編已嘗採入余幼年曾於是書熟讀而玩索之頗得其要兵燹以來藏書灰燼是編亦蕩然無存遍覓坊板竟不可得嘆曰先生畢生心血胥在是書豈終泯滅無傳耶余不復睹此書忽忽三十年往往臨危殆之症群醫望而卻走者輒宗先生法藥之得生者十居八九然則余之服膺先生而先生之有以詔我者豈偶然哉一日兩門人偶於舊書肆中購得此本歸亟告余翻閲之下喜逾獲寶惜字迹漫漶語句間有殘缺爰不辭譾陋繹其上下文義妄為補苴其眉批旁注則時與門人講論以暢其奧竅非敢僭也同鄉李君象春謂曰此書誠醫林不可少之書盍付梓人以公同好余因思昔賢著述顯晦有時先生以擫息脈血之精著六門二法之目不朽自在天壤獨怪余與是書忽離忽合積有歲年隱然假我復起先生繼文正以天下為己任之心而使後世業醫者皆同此心卒之劍不掩於豐城珠仍還於合浦豈非有數存乎其間耶書凡八卷原附東莊醫案西塘感症皆法奇而正旨簡而賅發前人所未發足堪嘉惠來茲校刊既成志其緣起如此序云何哉光緒十七年秋七月既望旌德鏡堂王汝謙
