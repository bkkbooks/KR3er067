body:
  text: 卷四四明醫案庚子六月同晦木過語溪訪呂用晦適用晦病熱症造榻前與之語察其神氣內傷症也豫因詢其致病之由曰偶夜半從臥室中出庭外與人語移時就寢次日便不爽快漸次發熱飲食俱廢不更衣者數日矣服藥以來百無一效將何以處之豫曰粗工皆以為風露所逼故重用辛散不進飲食便曰停食妄用消導孰知邪之所湊其氣必虛若投以補中益氣湯則汗至而便通熱自退矣用晦欣然輒命取藥立煎飲之旁觀者皆以熱甚又兼飽悶遽投補藥必致禍豫慰之曰無容驚擾即便矣頃之索器下燥矢數十塊覺胸膈通泰旁觀者始賀是晚熟寐至五鼓熱退進粥用晦曰不謂君學問如此之深也不然幾敗矣連服補中益氣數劑神情如舊逾日而別景嶽云醫家不貴於能愈病而貴於能愈難病病家不貴於能延醫而貴於能延真醫如此症若非東莊篤信不疑一為旁觀所阻則必誤於粗工矣無如病家之能延真醫者不易多得遂使醫家之能愈難病者亦不易多覯則且奈之何哉為之一慨七月初一日用晦以室人病相邀同黃晦木至語溪用晦言室人病可緩治業師徐五宜先生之長君傷寒危甚須即往子為我救之我已致之業師矣頃之有人來言病者晚來狂叫暈去五六次早起一暈竟絶醫不必往也用晦為之痛惜豫問病來幾日云九日矣豫又問胸尚熱否曰胸但不冷耳豫語用晦曰可救也急趨用晦同晦木往視之至則殭尸在床口鼻無氣面色青黯口噤目閉手撒獨唇色紫黑豫笑謂晦木曰此人不死陰虛症誤服白虎所致耳切其脈兩尺尚在時旁觀者皆笑豫妄遂取人參一兩熟地二兩炮姜五錢濃煎湯挖而灌之盡劑口開面色轉紅不及一時大叫冷甚連以熱湯飲之即發壯熱通身淋漓汗下而蘇矣此晚腹脹不便豫曰無憂也大汗之後虛不能出耳再飲藥一鍾即得解次曰其尊人五宜先生來曰諸病悉除但多妄言怒罵如有鬼神驅之者先生將何以教之豫為之調治數日不得間因就宿其家至夜半診其脈曰虛至此乎復以大劑附子理中建中投之數日而愈病熱至九日則其舌必黑而脈之洪數無倫可知斯時即以大劑參地養其陰何至陽無所附而狂叫暈絶哉猶幸胸尚不冷則知陽分未盡尚得起死回生耳彼始焉雜用風燥以亡其陰繼焉縱加霜雪以亡其陽遂使雖有明哲亦只袖手以視而莫可施其回挽者蓋不知其幾也有活人之心者尚其於此等案中細加參究將自不致有操刀之患矣謙按陰虛之陰字當作寒字看乃陰中之陽虛實元氣不足也非丹溪謂陽常有餘陰常不足陰道常虛之陰虛用知柏龜板鱉甲之症也今之人解陰中之陽虛症往往混入陰中之陰虛者禍如反掌耳胃液告匱久病神魂離散即見此狀與陽明實狂燥矢譫妄者天淵之判不可不知用晦室人患産後驚悸初起時見筐中綿絮念將所生兒入綿絮中不幾悶死即作驚恐憂患之狀後凡有所觸意中以為不耐即憂患不止或一端執想數日才已飲食不進面少精采服諸補心養血藥無一效至是用晦招豫治之豫診其脈曰孩時得毋因齒病致大驚否用晦向室人問之曰十歲時果曾病齒治齒者用刀鉗之幾受驚而死子何以能識之也解曰脈法當如是耳不精於象數鈐法之學者不能也少時以驚受損傷其君火心包氣散痰得留之今産後大虛痰因虛動病端見矣夫心為君主主明則下安國乃大昌故凡七情皆由心起今心氣虛甚痰邪侵擾思慮亦因之多變況喜樂氣之陽也憂患驚恐氣之陰也陽虛則陰得乘之又兒為其所愛氣虛痰入則愛不得其正因愛而過為防護之惟恐不至遂因而生憂耳今先用歸脾養榮八味等類五十大劑待其氣血完備然後攻之痰可得而去而病不再發矣用晦如豫言治之果愈驚則氣散受驚而曰因齒者腎主骨齒乃骨余其尺脈必沉而散以是歡四明脈法之精者猶淺於窺四明者也難其於因齒受驚因驚致損痰因虛動心由痰擾處溯流窮源晰辨無不精盡先補後攻治驗更極神奇醫道中乃讓此公出一頭地耳新安程結先子病瘧每日至辰時大寒午時大熱熱即厥兩目直視不能出聲頦脫涎水從口角湧出不止日流數升至丑時始汗解飲食不進昏冒幾絶豫往視之皆誅伐太過所致也投以補脾之藥不即效延他醫調治用柴胡防風南星半夏等藥病勢轉劇其家復延豫治之值醫者在豫請曰此何證也而用前藥曰子不識乎此肝瘧也肝瘧令人色蒼蒼然太息其狀若死豫笑曰據子述經言當得通脈四逆矣何用前藥豫誠不識此何病但知虛甚耳請先救人後治病何如曰子用何藥豫曰大劑參附庶可挽回醫力爭參附不便豫漫應曰謹奉教醫始洋洋色喜而別是夜用人參一兩黃耆二兩炮姜三錢比曉熟地桂附並進次日辰時病不復發矣此緣勞役過度寒熱往來醫認為瘧且時當秋令一味發散寒涼重虛其虛展轉相因肝脾大敗非峻補氣血何由得生夫病由人生人將死矣而乃妄牽經義強合病人及至處方又乖成法自誤誤人至死不覺悲夫先救人後治病以病由人生也然病固由人而生而人實由病而死則欲救人不又當先治病乎不知補正乃所以去邪救人即所以治病原無彼此之分四明見得此症只要峻補氣血速救肝脾其病自除故云云以見彼所治病之藥之謬而不可服耳讀者當會其意勿泥其詞可也留人治病之法非平時篤學臨症行權不能起也如見寒熱煩躁仍以寒熱煩躁治之速之死耳何以生為正所謂撥亂反正安危從此一舉耳余往往見此等症皆前醫見而卻走者不得已用大劑參耆附保元生脈理中一晝夜盡一二斤藥挽回者不少矣然膽大心小不在當時而在平日也故云附子三五枚人參少半斤參力若不濟前功必盡棄平時無學力至此滋疑懼是也呂坦人子生甫數月忽急驚風抽搐直視發熱不乳醫以抱龍丸及羌活防風薄荷殭蠶等作煎調服坦人商於豫豫曰誤矣此脾士虛而肝木盛也急用五味異功散加煨姜進之少頃熟睡微汗熱退而乳用異功以實脾土之虛加煨姜以制肝木之盛其處方之嚴密直與長洲並駕杭友沈僑如甥病傷寒診其脈浮數有力舌黑胸脯痛脹此得之勞倦後復傷飲食醫以寒涼消導攻之火受遏抑無所歸也急以大劑參朮歸耆炮姜救之戒其家人曰夜半當發戰戰則汗而解矣如戰時頻頻以粥與之時豫與黃晦木黃復仲呂用晦同臥天長寺四鼓時病家急叩門曰服後果寒甚索被頃之大熱昏沉而死矣先生尚有法救之否豫曰不足計也汗來矣但戰時曾進粥否曰實未也豫笑曰吾語汝戰時須與粥正所以助胃氣使汗來速而不至困乏耳今亦不妨子第歸此時當得汗矣諸子皆為豫疑促豫往視至則汗解而齁齁睡矣歸語數子為發一笑心細如髮膽大於身由其胸有灼見也彼胸無灼見者心小隻見其畏葸膽大適成其孟浪因循以致禍妄投而殺人二者均失耳以是知膽能大於用藥之時者必其心能小於臨症之際而心能小於臨症之際者尤必其識能超於群醫之上者也吳餐霞室人患妊娠胃口䐜脹不思飲食口渴下利面少精采醫以消導寒涼與之病轉甚而胎不安豫曰此得於飲食後服涼水所致耳投以大劑理中湯數劑而愈水能滅火飲食後服涼水則傷胃中之陽可知自宜救之理中以養胃氣顧見病治病之醫家豈能窺尋及此哉見其胃口䐜脹不思飲食也則有消導而已矣見其口渴下利也則有寒涼而已矣豈知胃氣轉傷則病勢轉甚而彼猶不知其故也方且謂藥本對症而無如其病犯條款耳嗚呼古今來弄假成真而求生得死者十中寧有八九也冤哉桐鄉曹獻扆室人十一月病瘧發則頭重腰痛寒從背起頃之壯熱烙手汗出不止豫曰此太陽經瘧也用大青龍湯獻扆曰病來五六日委頓甚矣而病者稟素怯弱又他醫言有汗要無汗帶補為主今汗如此而子復用此藥恐不能當豫笑曰第服此其病自除當晚汗猶未止進一大劑即熟睡次日不發逾日以補中益氣調理而痊既為太陽經瘧乃不用麻黃湯而用大青龍者以症見壯熱烙手汗出不止也即此見前輩用方之諦一婦人産後惡露不盡至六七日鮮血奔注發熱口渴脅痛狂叫飲食不進或用四物湯調理或用山楂青皮延胡索黃芩等行血藥卒無一效豫至見諸醫議論紛紜無一確實細切其脈洪大而數豫曰此惡露未盡留泊血海凡新化之血皆迷失故道不去蓄利瘀則以妄為常曷以御之遂以醋製大黃一兩生地黃一兩桃仁泥五錢乾漆三錢濃煎飲之或曰産後大虛藥毋過峻否豫曰生者自生去者自去何虛之有第急飲之果熟寐竟夜次早下黑血塊數升諸病如失矣復用補中益氣調理而安前案以麻黃桂枝等止汗此案以大黃桃仁等止血變化莫測誰不驚奇而不知其所辨亦止在症所窺亦止在脈也石門吳辨玉發熱多汗便祕數日不止醫曰此停食傷寒也不宜與食待熱退始可以稀粥湯飲之病勢轉甚延豫視之豫問曰肚中飢否曰飢索其日所用藥則芩連枳殼花粉厚朴之屬豫笑曰子但吃飯病即除矣無庸此等藥也病者喜甚曰吾本無食醫言有食故耐此數日餓耳然便祕云何豫曰致新即推陳矣胃中久無穀氣故前物積而不下且子之發熱多汗一味虛症遂用參朮調補而痊發熱而且便祕似非虛症不宜遽投參朮矣然多汗不止則陽中之陽其虧無疑故以參朮調補而痊也傷寒心法云不能便而能食者倉廩盈溢自能通利不便無憂可見致新即推陳實出至理而所謂吃飯病即除者本非趣話也沈啓廷孫甫三歲脾虛發腫兩足更甚乳食不思午後發熱頭面羸瘦俗醫云此病如用官料藥便成發黃鼓脹而死但當服草頭藥並以針挑其指出黃水自愈浙西人言出自醫家藥籠中者謂之官料藥俗傳單方一二味謂之草頭藥婦女酷信此說不讀書者從而和之往往以此誤事決不為戒啓廷力排此說延豫調治豫曰此脾虛也非參朮不能收功病已發黃鼓脹將死矣草頭藥何以治之且官料藥皆草根樹皮也何出自醫家便為官料啓廷信而服之漸有回色未幾又發瀉又頭上生毒爛至見骨又出瘄皆極重病纏綿不休豫一味補正他病見則隨症稍加減之如是者自夏迄冬盡用參幾斤余才得脫體次年始長肌肉設惑於衆論能有救否發腫而兩足尤甚者脾虛下陷也乳食不思者屬陽明胃土受病蓋脾運則陽明之氣上達而胃開今中州失運則陽明之氣亦不能上達也補正者補中益氣蓋虛者實之下者舉之也夫重症蜂起冬夏遷延而能徐收全效固非有定見者不能而知人善任如彼其專且久而不為庸俗所迷則沈啓廷也者亦豈易得耶至於官料草頭之說直捷爽快尤足破迷正訛石門鎮朱殿臣病痢日逾百餘次身發熱飲食不進殿臣以平日所用藥示豫率皆檳榔大黃之屬豫曰此破氣利血藥也治滯下當調氣不當破氣當和血不當利血以生地當歸白芍黃芩木香等數大劑飲之三日而愈當調氣不當破氣當和血不當利血二語是治痢家千古不易之則臨是症者當援以為鵠也一婦人胃脘痛勺水不入寒熱往來或從火治用芩連梔柏或從寒治用薑桂茱萸展轉月餘形體羸瘦六脈弦數幾於斃矣豫曰此肝痛也非胃脘也其病起於鬱結生火陰血受傷肝腎枯乾燥迫成痛醫復投以苦寒辛熱之劑胃脘重傷其能瘳乎急以滋腎生肝飲與之一晝夜盡三大劑五鼓熟寐次日痛定覺餓矣再用加味歸脾湯加麥冬五味十餘劑而愈肝痛一症四明實補胃脘諸痛治法之所未及豫每祖其意以治肝經血少者加味逍遙散加生地血少而燥者疏肝益腎湯加當歸或左歸飲加柴芍或滋腎生肝或滋腎清肝隨症選方無不立應若從痰火寒食等因求之失之遠矣且痰火寒食等因如有諸內必形諸外而就其標可求其本即如此案中列症云寒熱往來又云六脈弦數則已明明繪出肝虛燥痛一症供狀矣臨症者自不察耳然脈症具在識者固自胸中了了也一婦患內傷症值孕八個月身體壯熱口渴舌胎焦黑醫用寒涼治之豫曰無論內傷即麻黃桂枝症也須先安胎後攻邪今兩手脈數大無倫虛熱盛極乃復用寒涼陽受陰逼其能久乎投以滋腎生肝飲一劑熱退繼用補中益氣湯而愈症曰內傷則一補中益氣足以治之矣而先之以滋腎生肝者蓋症見壯熱口渴舌胎焦黑脈見數大無倫則陽邪燔灼脈已無陰不先救以甘溫滋潤之品而遽投參耆升補之劑則陽火愈旺而陰愈受傷矣因為拈出以告世之不識先後著者壬寅九月中至海昌封翁楊乘六延豫診脈並子弟四五人遍診之其次郎在公者六脈動甚因語曰兄脈緊而弦往來無韻不出一月危病至矣為之定方而別斯時無甚病其家不之深究十月中忽患咳嗽痰中見血醫作風寒症治數以羌防發散與之十餘日遂大吼喘痰湧如潮作齁齁聲不得臥坐一人床上以額俯靠其背稍抬頭即喘急欲死走人至杭邀豫豫診之曰以前日脈推之病根固深然不宜困敗如此之速也此殆攻伐之藥逼成之耳無救矣奈何病家哀懇言不幸而先生之言中今時刻難過生死且不暇計得喘息稍蘇又作區處豫曰定喘不難無如脈色皆去縱喘定之後仍虛脫而死耳遂朝用參耆歸芍暮用加減八味三日而能臥飲食倍進其家喜甚以為得生豫曰出入廢則神機化滅升降息則氣立孤危今出入升降俱廢息矣縱挽回何所施茲不過暫接命門一絲未斷之氣逾十日必死矣無能為也已而果然向使病未見之先即已見之後醫能以大劑填補峻補之藥投之即不能如備尚可稍延歲月不至若是之促耳此可為庸醫妄肆攻伐之戒徐次鏐案定死期於一年之後此案則決危病於一月之前以其六脈弦緊無韻而皆動也乃其期有遠近者以其脈之動有甚與未甚耳兩案合參愈見四明指下之神徐彥為子甫四歲盛夏發熱驚搐不已腰曲目直小便短赤面無神色醫作傷寒治不應邀豫視之豫曰火燥生風風淫末疾非傷寒也用滋水清肝飲盡一劑而汗解便利熱退豫曰瘧至矣翌日果然立用五味異功散加麥冬五味十餘劑而愈每驗小兒驚症産後痙症以及類中風症悉屬火燥生風而傷寒一症尤多火燥生風者蓋因火燥而後風生風從內出非自外來所以為風淫末疾也醫家若不知其風從火出而雜用羌防辛芷劫風燥血之劑則火得風而轉烈陰被燥而必亡矣只看案中列症先曰發熱次及驚搐便見非熱不生風非風不發搐然其發熱之由總為肝腎陰虛所致其腰曲者腎水虧也其目直者肝血燥也且腎合膀胱肝主疏泄未有肝腎陰虛而小便猶能清利者症雖蜂起其實蟬聯標有不同其本則一類如是也學者須知其審症一毫不爽處始知其處方一線不走處若第用疏肝益腎及滋腎生肝等劑非不對症然尚有一膜之隔也細按自知毗陵董縉風寓湖上一僕患熱症遍體壯熱煩躁作渴醫作傷寒治豫曰發散寒涼逼成外熱內轉虛寒甚矣急用補中益氣湯加炮姜一服而汗解熱除再服而飲食進三服而安內真寒而外假熱乃長洲所發內經微旨也然如此等症最易辨卻最難辨如列症云遍體壯熱煩躁作渴則已俱是火症何遽知其內屬虛寒乎蓋以症屬外感則未有既經發散而反遍身壯熱者內果實熱則未有既服寒涼而反煩躁作渴者惟其症雖似乎外盛而實本於內傷所以發散則亡陰外雖似乎實熱而內本屬虛寒所以寒涼則滅火然則其為陰盛於內逼陽於外也凡有理解者俱可臆度得之況深究內經之精蘊者哉吳章成弟八歲發熱悶亂大便不通醫作外感治豫曰此得之傷食因發散太過遂成虛熱兼風藥燥血故不便耳先以六味飲加肉蓯蓉三錢飲之下黑矢十數枚繼以補中益氣湯數劑而諸病悉除傷食則氣阻而脾不能運斯時若以六君補中等劑少加枳桔助脾以消食則氣通脾運而發熱便祕等病預卻矣治者乃誤認為外感而妄加發散則陰虛血燥腸胃乾枯所傷之食因愈祕而不出設再遇粗工吾知非倍進硝黃即重用枳朴耳豈能以滋腎潤腸之劑使陰血濡潤而燥矢自下哉今而後凡只求一便矢以畢其技能者請以熟地蓯蓉代硝黃枳朴可也幸勿膺東莊所稱矢醫之榮號也一鄉人力田辛苦復飢甚飲食驟飽倦臥半響醒後忽喑啞不言如是者二十餘日矣就豫診之豫曰勞倦傷脾飢飽傷胃陽明之氣遏而不升津液不行賁門擁澀故語言不能出耳以補中益氣湯十大劑與之偶午睡覺通身汗下言語如常以補中益氣治喑啞不言而於喉舌置之不理罔不共詫為異矣詎知亦甚無奇哉只是窺破受病之源耳然則何病不有其源而治病者顧乃昧昧焉而竟不為之尋耶一鄉人患發背上距風府下連腎俞通塊腫起肌肉青冷堅硬如鐵飲食俱廢不省人事醫猶用解毒藥豫診之六部細數氣血大虧毒將內陷矣急用養榮湯加附子炮姜三大劑而胃氣開十劑而堅硬者散去十之八九只留左邊如茶鍾大焮紅作痛豫戒之曰切莫箍藥及刀針氣血溫和毒當自出箍則反遲非時而刺收口難矣彼以不任痛竟受刺出血豫曰當倍前藥急服以收口為度仍戒以節嗜欲慎飲食兼服還少丹八味丸等藥而愈症有內外理無彼此彼專治外症而不懂內症者必其並不明於外症者也故此症若一經外科粗技則惟有敗毒藥以消腫破氣藥以開胃耳寧能顧其本之虧與不虧毒之陷與不陷哉四明內外泛應無不曲當由其脈症分辨處無不清晰更由其內外合一處無不貫徹也曹遠思內人月水不至四月矣腹痛不止飲食少進醫作胎火治豫曰此鬱血也然氣稟怯弱當補而行之用八珍湯三大劑果下血塊升許腹痛猶未除也以大劑養榮等藥調理而痛除食進第九案中鮮血奔注反以去蓄之藥利之此症瘀血鬱蓄反以補血之劑行之時而攻人之所不敢攻時而補人之所不敢補洵非有膽者不能尤非有識者未及也徽人江仲璉冒寒發熱兩頜擁腫如升子大臂膊磊塊無數不食不便狂躁發渴診其脈浮數無序醫作傷寒發毒治豫曰誤矣此燥逐風生也用大劑疏肝益腎湯熟地加至二兩許五劑而腫退便解十劑而熱除食進再用補中益氣湯加麥冬五味調理而痊冒寒發熱者火為寒邪所郁也郁久則血為火迫而變生燥症矣然同一燥症而於徐彥為之子則用清肝者以彼有小便短赤一症也夫赤為手少陰本色而見於小便則心火亢甚而達於膀胱矣故用六味以滋腎而加柴梔歸芍以清肝滋腎者滋夫火之所由制也清肝者清夫火之所自生也尤妙在山梔棗仁二味蓋心火既下逼膀胱而不有屈曲下行之山梔何以因其勢而利導之以泄心經之燥火哉且本經之陽火既亢則陰氣必虧不有棗仁又何以使歸地之陰斂而納諸包絡之中以滋心經之陰氣哉夫立方各有其旨用方必求其當知彼案用滋腎清肝之妙則此案用疏肝益腎之妙亦可見矣徐大千孫女十餘歲發熱數日頸項牽絆疼痛二便不利忽四鼓厥逆兩目上竄氣喘口噤牙關不開豫診之病自太陽傳陽明今傳少陽甲乙兄妹遂傳厥陰耳語其家人曰幸年小可救也急以麻黃附子細辛湯一夜盡三劑而始蘇五鼓能言矣次用小柴胡湯合瀉心湯等藥調理而愈凡從陽經傳陰經者不作陰症仍從陽經中治四明治感據症辨經按經用藥如此仲景真不死矣杭人沈孟嘉妻患吞酸膈痛屢年矣肌肉枯削幾於絶粒豫診之六脈細數此肝木乘脾土也先投六君子湯加炮姜十餘劑覺吞酸減半繼用補中益氣湯加半夏炮姜十餘劑而吞酸盡去膈痛亦除矣次用歸脾湯倍加木香炮姜吞八味丸而愈木曰曲直曲直作酸故凡酸症悉屬肝木以酸為木氣也然此症在他人則混入逍遙左金疏肝滋腎等症去矣四明乃從六脈細數中看出肝木乘脾而用六君補中等劑以培脾土並加炮姜之辛以制肝木之酸復用歸脾八味補火生土以善其後試問今人臨症誰則能如此之分明不爽耶呂仲嘉內人在室十四歲時病寒熱往來逮後適仲嘉又十餘年寒熱如故或作瘧治或作虛治尪羸枯削幾於骨立延豫診之豫曰此非瘧非虛乃血風症耳以五加皮散加熟地二兩每劑共藥五六兩許水二升濃煎一升每日盡一劑如是者二十劑而寒熱頓除此案症治原從準繩中脫胎來者然如此審症非獨具有隻眼不能吳維師子甫十歲發熱口渴胸腹悶痛豫曰少陽陽明症也用加味小柴胡湯是夜發暈逾一二時維師驚甚豫曰無傷也但此病不傳瘧必傳痢逾三日熱退果少腹痛先解黑矢無數隨後便膿血而痢矣連用當歸解毒湯五六劑而痢除繼以六君子湯調理而安胸痛發熱少陽症也口渴腹悶則為陽明症矣瘧發寒熱少陽症也便痢膿血則為陽明症矣然症尚未來四明何自而知之蓋以症屬兩經合病則可知邪並於少陽自當傳瘧毒歸於陽明自當傳痢其所以不傳瘧而傳痢者則以小柴胡湯乃少陽之的劑也服後既見發暈則少陽之邪業經汗散特以正不勝邪故不能托之盡出耳然即有未盡而既逾三日則已由經入府而於少陽無與矣尚何傳瘧之有哉故知將來流病前輩亦只是就現在本病依經據理而斷之非率胸臆妄希偶中也學者於此等處果肯做個題目仔細入思議來則因此識彼久則後來亦可居上矣誰謂古今人竟不相及也範中行自省歸石門感冒風寒又過於房勞發熱昏悶醫以為傷寒也羌活柴胡投之不應又以為陰症也肉桂木香投之又不應熱且愈甚飲食俱廢舌黑如炭八日不便醫正議下豫往診之脈細數而沉因語之曰陰虧甚矣胃氣將絶矣非溫和甘潤之劑弗能救也急以左歸及滋水清肝等藥重加參耆服之他醫以為不大便奈何議補豫曰子以為承氣症耶誤矣第服藥自得便至第四日果下黑矢升許熱退舌亦紅潤但尚未進食病家猶以用補為嫌豫慰之曰本內傷症一補中益氣療之足矣無奈粗工雜投胃氣轉傷不能即復今以藥補之以稀粥調之不過數日自然知味公等勿憂病家不信另延一醫重用承氣湯服至二劑不得便病勢反劇無顏再懇豫往禾中延薛楚玉楚玉至病家敘述病情及用藥次第楚玉曰既用熟地而便效可知矣何至舉將收之功而棄之耶今無能為矣逾數日果歿病家目楚玉為豫黨究不之信嗟夫舉天下學問之人而盡目之為黨為彼之醫不亦難乎此等症一則敗於醫藥之亂投一則敗於主見之不定遂舉將收之功而盡棄之良可惋惜然病者既因勞力致感而又過犯房勞則亦是自就死地也懸此以為輕生好色者戒老友徐五宜之從侄次鏐病咳嗽豫細診其脈六部皆動心竊疑之因問君嗜酒乎曰然又問君得毋服天麥門冬生地知母貝母等類乎曰服逾斤許矣豫曰君病與此等藥相反可禁勿服寫歸脾湯六味丸兩方與之豫歸與用晦語曰次鏐病即素問所謂二陽之病發心脾也其人必勞心過度又嗜酒多欲急救三陰乃為良法醫以陰寒逼之火無所泄其怒遂成燎原之勢今六脈純是陰火有出無入不逾年死矣是時座上有數客皆驚曰次鏐無恙不過患傷風何遽至是豫曰脈法當如是耳八月中豫適與用晦寓孤山次鏐邀豫至天竺曰聞子善太素乞為我診辛丑可得第否豫曰太素兩字出在三墳後人竊之以欺天下之耳目且造為歌訣妄言禍福軒岐無是也但素問自有一種榮枯壽天貧富貴賤得失成敗之說要不出乎聖人吉凶悔吝善惡逆從之理其道甚微然我能約略言之診畢豫語之曰辛丑固好然不若甲辰更得當也次問壽豫曰子年甫三十外不必問壽豫察其意惟以科名為急不及病情似難直言其尊人大千公忠厚長者過豫極厚急返石門往告曰令郎脈氣不佳如北上其不返乎公何不阻其行曰豫固阻之弗能也因為制大料參膏語大千曰公當戒令郎不絶服之庶可冀其還家如惑以火不清不宜補殆矣到京果閩人有以前說進者次鏐信之用發散寒涼不十劑吐血而絶木必有根水必有源而病亦必有本本者所以致病之根源也長洲醫案二十四種卷帙甚繁然一言以蔽之只是治病必求其本耳案中勞心過度嗜酒多欲八字乃病者所以致病之本也醫家早以歸脾六味直從本治寧遽至是何不知出此而以陰寒逼之已濱於死而又用發散寒涼等劑遂使三陰立盡耶可慨已
