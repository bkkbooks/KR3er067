body:
  text: 卷七西塘感症中感症變病感症如上法治之愈矣顧有諱疾忌醫之病家及操刃殺人之庸技日久遷延變如蝟起猝難措手用集方治如下吐血有一種嚴冬感寒脈浮而緊外寒束內熱陽氣不得發泄致咳嗽吐血衄血者春有不吐衄者此麻黃症也而其人素虛不禁此湯峻險又非他藥可愈宜麻黃人參芍藥湯麻黃人參芍藥湯麥冬君五味使白芍佐當歸臣甘草佐麻黃醋製臣桂枝佐黃耆君人參佐上水煎麻黃令沸去沫人余藥同煎熱服此方乃東垣精思慧想而成妙不可言余曾借治此症應如桴鼓然最妙之處在分兩極少專宣上焦耳恐初學者不知此義故論及之且將本方定其分數以備加減焉紅汗傷寒熱甚不得汗衄血者奪汗者無血奪血者無汗若得汗則無衄症矣乃熱入血分欲從衄解也四物湯去川芎加升麻丹皮黃芩之類清之升麻一味加得尤妙從犀角地黃湯如無犀角以升麻代之之義生來蓋陽明之脈絡鼻是經火盛迫血妄行從鼻出者曰衄方書言從肺來非也若非升麻則何以達陽明而清其火哉亦有衄後病反重者更傷其陰也大為危候其衄勢必大甚都氣飲或六味飲加生地黃生白芍若血來太多致耗中氣當大補其陽當歸補血湯加人參甘草慮虛火上浮加麥冬五味此等加減真精細若審胃氣未傷的系熱邪有升無降者滋腎丸應手即止有得生者當歸補血湯黃耆蜜炙八分當歸二分分讀去聲即二錢五分也滋腎丸黃柏君知母君肉桂使上知柏二味俱用酒洗焙乾共為末煉蜜丸蓄血有一種小腹脹滿小便自利或有漱水不欲咽者然必以小便為驗其人如狂為蓄血一名熱入血室男女俱有此血室在男子則下血譫語在女子則經水適來適斷其血必結如結胸狀其病必日輕夜重小柴胡湯加歸尾調之男子譫語其血自下者結結當作吉頗有下後即死者但血來必驟而多結而如狂發黃者桃仁承氣湯邪犯心胃者犀角地黃湯謙按結當作吉四字恐欠妥協又云頗有下後即死者症之凶危已極何吉之有哉況內經云男子便血如注者謂之結陰一結一升再結二升三結三升之旨其結不當作吉解又顯然可據矣桃仁承氣湯桃仁泡去皮尖桂枝白芍酒炒大黃紅花酒製芒硝上加生薑三片或加柴胡青皮枳實炙甘草犀角地黃湯治主脈浮客脈芤浮芤相合血積胸中熱之甚血在上焦此方主之犀角使大黃君生地臣黃芩佐黃連佐又方犀角使生地君白芍臣丹皮佐上方如無犀角以升麻代之熱多者加黃芩脈大來遲腹不滿自言滿者無熱也不用黃芩升麻與犀角性味主治不同以升麻代之者以其能引入陽明也但蓄血症不得以升麻代之耳此方並治瘡疹火盛口渴傷寒邪傳裡里字當作胃腑看則渴故渴為陽明本病昔人用黃連滑石花粉葛根及白虎無汗則雖渴忌與白虎加人參清之甚者大柴胡承氣下之是也若夫腎虛火不歸經渴飲冷水者為十全大補八味之症此症亦有水虧不能配火而火乘於上者當從六味左歸以滋其陰而火自降矣又有陰虛煩躁而渴者不能飲水也宜冷服四逆湯此等症最易混入白虎症去一或誤投死生立判臨症時當細心體認又有傷寒食少而渴者當以和胃之藥主之白朮茯苓是也如用涼藥胃愈損矣四君或補中然必合生脈其效乃捷又有得之勞倦內傷者乃脾胃元氣大虛而渴也舌雖干煩以陽藥為主四君重加炙耆更佐以歸杞熟地五味有守服至二三十劑大汗而解者此非醫家真知病家篤信焉能取效此皆不得以陽明正治治有一等中氣虛寒寒水泛上逼其浮游之火於咽喉口舌之間者渴欲引飲但飲水不過一二口即厭少頃復渴飲亦不過若此蓋上焦一段欲得水救至中焦則以水見水正其所惡也如面紅煩躁者理中湯送八味丸或用附子理中加麥冬五味亦效又有一等口欲飲水但飲下少頃即吐吐出少頃復求飲藥食毫不能下此是陰盛格陽腎經傷寒之症仲景以白通湯加人尿膽汁熱藥冷探之法一服即愈女人多此症此二症俱系陰症但一屬太陰一屬少陰不得混看譫語胃中熱甚上乘於心心為熱冒則神昏而言語謬妄也宜白虎解毒及承氣等劑看微甚用之然必大便秘小便澀脈洪數有力者方可東莊治一人感症六七日不解熱甚胸滿不大便發狂譫語用熟地八錢生地麥冬白芍各二錢黃芩錢半黃連枳實厚朴各八分茯苓知母各一錢石膏五錢甘草五分生薑三片竹葉三十片煎成入蘆根汁小半鍾又方用熟地八錢生地麥冬各二錢花粉枳實黃芩黃連知母各一錢石膏八錢栝蔞霜玄明粉各錢半姜三片竹葉三十片此用白虎承氣之準的也若其人手足逆冷脈微細或洪大而數按之無力者乃神不守舍語言失次耳須用參耆歸術等甚者加附子或附子理中湯或附子湯加人參敗症往往有此若誤投解毒等劑立斃有已出汗身和而有妄者此是汗後津液不和乃非陽非陰者慎不可下宜小柴胡和建中湯各半帖和榮衛通津液分明不爽有病後血氣未復精神未全多於夢寐中不覺失聲如魘此不繫譫語鄭聲宜六君子湯溫膽湯去竹茹加人參半錢究竟不如六君加歸芍為穩附子湯附子臣人參君茯苓佐白朮臣白芍上以水八升煮取三升溫服一升日三服建中湯肉桂佐白芍君甘草臣生薑使大棗引上方宜加膠飴乃合建脾土義否則無以異於桂枝矣六君子湯陳皮佐半夏臣人參君茯苓佐白朮臣甘草使溫膽湯竹茹君枳實佐陳皮佐半夏臣茯苓臣甘草使上方加生薑自利凡自利者不因攻下而自泄瀉俗言漏底傷寒是也有協熱有協寒俱宜詳辨原病式曰瀉白為寒青黃紅黑皆為熱大抵瀉利完穀不化色不變有如鶩溏或吐利腥臭小便澄徹清冷口無燥渴其脈或沉細或微遲無力或身雖熱手足逆冷惡寒蜷臥蜷臥身彎不能直睡也此為寒也凡熱症則口中燥渴若渴而不燥則亦有協寒者勿泥看小便黃赤或澀而不利或所下如垢膩之狀其脈多數或浮或滑或弦或大或洪皆兼數而有力方是熱症或有邪熱不殺穀其物不消化者當以脈症別之寒毒入胃者臍下必寒宜理中湯寒甚者宜附子理中白通加附子湯協熱利者臍下必熱宜黃芩湯白頭翁湯有內熱大結注泄不止者須以寒藥下之結散而利自止正所謂通因通用也凡胃虛內熱煩渴瀉利脈微弱者七味人參白朮散若發熱者人參三白湯加炒黃連如腹滿小便不利者五苓散合理中湯若嘔者加藿香半夏陳皮生薑如濕多而瀉不止者加蒼朮白朮如腹脹者加厚朴腹痛不止加炒白芍肉桂木香溫之經云暴注下迫皆屬於熱此條諸法西塘蓋推廣之以盡其變耳若非審有是症則不得概用溫燥之劑凡傷寒作利脈浮表未解者仲景以小青龍湯去麻黃加芫花二錢炒令赤色蓋散表邪兼治水也故知凡症皆不可執一說以概其餘也試由此推之濕毒氣盛者下利腹痛大便如膿血或如爛肉汁宜地榆散黃連阿膠湯此條當入痢疾條中看有內不大滿猶生寒熱未可下而便下之內虛熱入挾熱自利臍下必熱大便赤黃色及下腸間津液垢膩名曰利腸宜白頭翁湯黃芩湯又有不大便五六日以藥利之利遂不止用極熱劑乃止上條因失表以致利此則因誤下而得利者而下後之利又有寒熱不同法當分治如此可見辨症宜精晰也外熱內煩下利上渴或痞或痛或嘔常法多用黃芩湯不若生薑瀉心湯之當症兼痞痛嘔等則黃芩湯自非對症矣凡下利不可發汗蓋利下由內虛若發汗則內外皆虛變症蜂起矣先哲格言不易多得理中湯人參君白朮臣乾薑佐甘草使白通湯蔥白使乾薑臣附子君黃芩湯黃芩君芍藥臣甘草佐大棗使白頭翁湯白頭翁君秦皮臣黃柏佐黃連使人參三白湯人參君白芍佐茯苓臣白朮臣生薑使大棗使五苓散豬苓佐澤瀉佐茯苓臣肉桂使白朮君小青龍湯麻黃佐細辛使乾薑佐芍藥臣桂枝君甘草臣五味使半夏君地榆散治傷寒熱毒不解日晚即壯熱腹痛便利膿血地榆君犀角屑使黃連臣葛根臣黃芩佐梔子佐上㕮咀每服五錢水一盞入韭白五寸薤白尤妙同煎溫服黃連阿膠湯黃連君阿膠臣黃柏佐山梔使每服四錢生薑瀉心湯生薑君人參臣甘草佐黃芩使半夏臣黃連佐乾薑使大棗引按口渴詀語自利本陽明太陰之症緣六經只列陽病而不及陰症又無救敗之方今此陰陽壞症俱具則正所謂變也結胸有飲食尚在胃口未當下而早下之成結胸者倘脈虛質弱不可更下故知未經下者症雖滿悶尚為在表非結胸也結胸欲絕心膈高起手不得近用大陷胸湯不瘥者此是下後虛逆氣已不理而毒復上攻氣毒相搏結於胸者用枳實理中丸自安胸中雖和傷寒未退必有正便候日數足以法去之戴院使曰有寒實結胸雖痛而無煩躁等症此因下後虛逆寒氣獨結宜理中湯加枳實半錢茯苓一錢大陷胸湯大黃君芒硝臣甘遂佐枳實理中丸枳實臣茯苓佐白朮臣人參君甘草佐乾薑使上為末煉蜜為丸如雞子黃大每服一丸熱湯化下連進二三服胸中豁然渴者加天花粉一兩自汗者加牡蠣煅過二兩下利亦加傍流有下早成結胸症見微熱神昏口乾微渴舌兼燥或殷紫色大便溏泄時至此謂傍流乃熱結於中逼注大腸非關脾也養陰滋血藥中須加黃芩知母又必合白虎用石膏傍流方止止後數日方得正便而愈矣中者胃也故宜用石膏已經誤下必傷胃陰故宜用滋陰兼有小便秘者熱解自通切勿用木通車前等利水藥利水陰陽易竭為不可救也自利症云發汗則內外皆虛此症則云利水則陰陽易竭皆是不刊之論有傷寒熱甚失於汗下唇焦舌燥能飲水大便秘硬小便赤澀時有稀糞水利出者此內有燥矢結驟乃旁漏之物非冷利也再審有矢氣極臭者是也其脈雖沉切之必滑有力或時躁熱不欲衣被或揚手擲足或詀語有力此陽氣亢極輕者人參白虎湯或小柴胡合解毒湯主之內實者須下之有潮熱者大柴胡加芒硝厥逆初病身熱頭痛稍久大便秘小便澀或畏熱喜冷水或揚手擲足煩躁不得寧詀語昏憒而厥此陽厥也大小承氣大柴胡看微甚下之煩渴舌燥白虎湯如得病便四肢厥冷脈沉而細手足攣而惡寒引衣蓋覆不欲水或下利清穀而厥逆者陰也四逆湯白通湯陽厥陰厥一清腑一溫臟有水火之分天淵之別二法相左害如反掌極宜細心辨別投劑庶無貽誤此論頗精故揭出以俟讀者潛心玩味爾厥逆脈不至者通脈四逆湯手足指頭微寒者謂之清理中湯無熱症而厥當歸四逆湯加茱萸生薑喘促脈伏而厥五味子湯如遇此等症以五味子湯與麻桂各半湯合作一劑投之尤覺穩當吐利手足厥冷煩躁欲死吳茱萸湯寒熱而厥面色不澤冒昧兩手忽無脈或一手無脈必是有正汗也多用綿衣包手足服五味子湯或兼與桂枝麻黃各半湯須臾大汗而解通脈四逆湯甘草君附子臣乾薑佐面赤者加蔥九莖腹中痛者去蔥加芍藥二兩嘔者加生薑二兩咽痛者去芍藥加桔梗一兩利止脈不出者去桔梗加人參二兩當歸四逆湯當歸君細辛使桂枝臣芍藥臣甘草佐通草佐大棗引古方之通草即今之木通也五味子湯五味子佐人參君麥冬臣杏仁佐陳皮臣生薑使大棗使吳茱萸湯吳茱萸臣生薑佐人參君大棗使桂枝麻黃各半湯桂枝君芍藥臣甘草臣麻黃君生薑使大棗使杏仁佐先煮麻黃一二沸去上沫納諸藥同煮去滓溫服發喘肺主氣肺氣逆而上行沖沖而氣急喝喝而息數張口抬肩搖身滾肚是為喘也有表症而喘者宜汗之心腹必濡而不至病人劇飲水致停飲心下結滿而喘者五苓散經以喘而汗出脈促者邪氣內攻葛根黃連黃芩湯利之汗出而喘無大熱者外邪壅盛麻黃杏仁甘草石膏發之此蓋病與脈氣未虛而喘亦微耳曾治一人季冬勞碌感冒醫峻用寒劑遂致大喘汗出如油脈浮軟重用生脈散乃定凡煩熱胸膈不利上氣喘促口乾或咳者加減瀉白散凡熱盛有痰脈弦數而喘小柴胡加知母貝母栝蔞仁胸滿者加枳殼桔梗心下滿者加枳實黃連舌燥飲水而喘者加知母石膏凡陽明內實不大便腹滿氣短發潮熱而喘者大柴胡加厚朴杏仁下後大喘則為裡氣大虛邪氣傳裡也葛根黃連黃芩湯症下後微喘則為裡氣上逆邪不能傳裡猶在表也桂枝湯解表樸杏下逆氣凡陰症厥逆脈沉細而微氣促而喘無汗者宜四逆湯加五味杏仁凡虛人脈伏手足逆冷者五味子湯有病傷寒咳嗽喉中聲如鼾與獨參湯服二三斤病始全其脈豁大無倫乃空虛陰亡之象有病後氣虛不能接續非喘也乃氣短也方書用大劑生脈散少佐陳皮二母主之然此乃急症須大劑八味加人參兩許方效感症亦有元海無根虧因肝腎子午不交以致氣短似喘者氣脫症也其脈必微細無神若微而兼緊尤為可畏速用熱地二兩歸身一兩甘草五錢以濟之緩之堪云神劑有氣從臍下衝上兩尺脈洪盛或數者屬陰虛症或兼見盜汗潮熱咳嗽大料左歸飲加人參或六味合生脈虛甚八味右歸皆可用加減瀉白散桑白皮君知母臣貝母佐栝蔞臣細黃芩佐橘紅佐桔梗使甘草使地骨皮君葛根黃連黃芩湯葛根君甘草臣黃芩佐黃連使左歸飲熟地君山藥臣萸肉佐枸杞佐甘草使茯苓使右歸飲熟地君山藥臣萸肉佐甘草使枸杞佐杜仲佐肉桂使附子制臣上二方熟地自四五錢可用至一二兩隨輕重用之如畏酸者去萸肉相火盛者去枸杞如不宜滲泄者去茯苓呃逆海藏云傷寒呃逆脈散死仲景之言不虛偽大抵原因失下生吃逆喉中陰不濟陰消將盡火熱奔急上行而肺陰不納也是為陽極便軟唯宜用瀉心脈微將盡者不宜下宜服瀉心以養陰退陽涼膈散去硝黃亦可便硬尤宜大承氣或兼舌攣語言不正而反昏冒與咽痛者少陰也速下之二藥神工作者誰東垣潔古為良劑有一種壯實之人守不服藥之說五六日後大去燥矢而吃逆者其噦必緩其脈亦不甚數此熱伏腸胃郁不得發及下竅得通則上竅亦透衝動肺陰而噦也譬如爐底壅塞火焰不光迨一透達而炎炎上行矣治法不宜純用寒涼寒涼則抑遏其火且肺胃之氣漸向衰憊奚能禁此猛劑亦不宜大補大補則熱邪方盛勢必邪正糾纏發為脹滿痞塞之病宜以人參茯苓生白朮若初起脈不虛者參朮亦可緩用生甘草當歸芍藥酒炒黃芩黃連俱酒炒梔子丹皮知母橘紅與之實者加石膏往來寒熱加柴胡三四劑後加熟地五六七錢白虎看強弱用陰汁一充汗自湧出肌表而愈矣此症有小心過甚初用上方一二劑或身見微汗或大便略行即改養陰滋潤之藥其人雖愈期年之間必憒憒如癡此乃邪熱伏於心胃不得透出故也醫者宜慎之大吐大下復極發汗胃中虛冷陽氣拂鬱於表醫與之水虛寒相搏凶致嘔噦者吳茱萸湯理中湯脈虛軟四肢倦怠食少或久病過服克伐之藥致吃逆者屬中虛六君子加減兩尺洪盛或弦細而數面時赤吃逆者屬陰火都氣丸主之內已伏陰陰氣太甚腎水擅權肝氣不生丙火既病丁火又消所以遊行相火寒邪迫而萃集於胸中亦欲盡也故令人發熱大渴引飲欲去蓋覆病人獨覺他人按之身體肌肉骨髓血脈俱寒此火即無根之火也用理中湯加丁香以溫其胃其火自下又有其氣自臍下直衝於咽嗌間吃逆者此陰症也其病不在胃也用加味附子湯急溫其下真陽一回火降吃逆自止瀉心湯大黃君黃連臣黃芩佐此金匱方也仲陽方止用黃連一味都氣丸熟地君山藥臣五味使萸肉佐丹皮佐茯苓臣澤瀉佐嘔吐有聲曰嘔無聲曰吐有聲無物為乾嘔成無已云嘔有責為熱者責為寒者有停飲者有胃脘癰膿者仲景云不必治膿儘自愈至於吐家則悉言虛冷也凡傷寒邪漸入里胃氣實而不受逆於胸中則嘔症屬半表半裡治法一二日內宜宣劑以去其壅方書所謂天分肺氣分胃窒塞不通而或噦或嘔是也然是疾之作必上焦火盛炙其津液結成痰涎凝於胃口故又宜導痰降火生薑半夏橘紅茯苓厚朴連翹梔子黃芩天花粉知母不渴者去知母以潤劑宜禁也竹茹枇杷葉主之如心煩加姜炒黃連如心下痞更加枳實如口苦脅滿脈弦加柴胡三四日邪氣漸深痰愈凝結宜苦寒以折之芩連二陳湯加厚朴天花粉黃柏滑石蘆根汁竹瀝薑汁主之如不止辛以散之芩連二陳湯加乾薑錢許生薑四錢又不止重以縋之用金銀煎上藥或上藥加入金銀箔五七葉甚者更加寒水石赤石脂凡嘔不止挾虛者旋覆代赭石湯妙不虛者旋覆花一味煎湯調下代赭石一二錢如初起即嘔逆清水飲食者著寒傷胃也人參養胃湯實者去人參如潮熱內實不大便嘔不止心下急鬱郁微煩者大柴胡湯下之仲景云嘔家不可下然金匱方有大黃甘草湯治食已即吐蓋飲嘔者其症在上因而越之可也而逆之使下則必抑塞憒亂而益甚故禁之若既吐矣吐而不已有升無降則當逆而折之無速於大黃也然亦須慎先嘔卻渴者豬苓湯先渴卻嘔者宜治膈間之水大半夏湯如初起腹滿而吐食不下自利益甚時腹自痛者太陰也理中湯加二陳生薑藿香主之飲食入口即吐心下嗢嗢欲吐復不能吐手足寒脈沉微者少陰也四逆湯加二陳生薑主之乾嘔吐涎沫頭痛者厥陰也吳茱萸湯加二陳主之此皆直中三陰非自陽經傳來者故悉用熱藥凡三陰嘔吐藥宜冷服即內經從治之法曾有寒吐用四逆理中附子至到即吐後去乾薑白朮只參附加丁香木香煎成加沉香立止蓋虛寒痰氣凝結丁附既溫佐以沉香木香則通乾薑白朮則泥耳陽症新瘥見嘔別無所因此餘熱在胃脘也竹葉石膏湯虛者左歸加花粉去茯苓如病久中氣虛者六君子湯或半夏橘皮湯虛而挾寒者六君子加藿香砂仁補中加炮姜半夏亦效如胃氣既虛邪熱未退者人參湯或葛根湯如病久口乾舌燥嘔者胃陰虛也必有面色嬌紅脈虛細數等證都氣飲主之左歸飲去茯苓加生地歸身尤妙有一家長幼患狀悉類者瘟疫嘔也宜求之本門症在八卷似痢症下仲景謂嘔而脈弱小便複利身有微熱見厥者難治以其虛寒之甚也旋覆代赭石湯旋覆花君甘草佐人參臣半夏臣代赭石醋煆生薑使大棗使人參養胃湯人參君茯苓佐草果佐甘草臣藿香使橘紅使半夏臣厚朴佐蒼朮佐上加生薑烏梅水煎溫服豬苓湯豬苓君茯苓臣澤瀉使滑石臣阿膠佐上先煎四味去渣下膠煎服大半夏湯半夏君陳皮佐赤茯臣生薑使半夏橘皮湯半夏君橘皮臣黃芩佐厚朴佐藿香葉使葛根臣人參君白朮臣茯苓臣甘草使上每服一兩煎成入生薑自然汁少許人參湯人參君茯苓臣知母佐黃芩佐葳蕤臣白朮臣陳皮佐蘆根使竹茹臣石膏君葛根湯葛根君麥冬臣人參君甘草使半夏臣黃芩佐白朮臣茯苓臣上加生薑大棗同煎服鬱冒傷寒五六日漸變神昏不語或睡中獨語一二句目赤唇焦口乾不飲水稀粥與之則咽不與則不思六脈細數而不洪大心下無痞腹中不滿大小便如常或傳至十日以來形貌如醉此熱傳手少陰心經也不可下宜梔子黃連黃芩湯若脈浮者病在丙導赤散脈沉者病在丁瀉心湯若脈浮沉俱有力者是丙丁俱有熱可以導赤瀉心各半服之或有用犀角地黃湯者此解陽明經血中熱近於是也有患熱病肢體不甚熱而間揚擲手足如躁擾狀昏憒不知人事時發一二語不可了而非詀也脈微細如欲絕其人平日素充壯者此失下熱極以致身冷脈微而昏冒將死蓄熱內甚脈須疾數以其熱極蓄甚而脈道反不利若急下之則殘陰暴絕而死蓋陽氣復竭而然也不下亦死宜涼膈散或黃連解毒湯養陰退陽積熱漸以宣散則心胸再暖而脈漸以生矣王損庵法大柴胡下之大黃止用二錢蒸熟煎繼以解毒湯數服而平凡傷寒似神清而時發一二語昏憒者多屬虛須主以人參或當歸補血湯後看兼症用藥有寒氣乘虛中上者經曰諸虛乘寒則為厥鬱冒不仁附子湯倍人參川芎天麻天麻性平活血脈通九竅乾薑之類主之或以人參三白湯加川芎天麻如下虛脈微者須加附子傷寒體虛有痰四五日後神昏不語者用人參五錢黃耆白朮當歸陳皮各一錢煎成入竹瀝薑汁飲之有服至十餘日方吐一字月餘舌乃能轉熱淨而言竟有陰寒相逼唯八味為宜有神思似清而時昏憒或語次間忽作鼾聲者大危候也急進歸脾養榮等藥參耆須用至兩許方可甚者加附子煩躁火入於肺成煩火入於腎成躁蓋心火旺則水虧金爍唯火獨熾故肺腎合而為煩躁然有屬熱者亦有屬寒者如獨煩不躁者多屬熱惟悸而煩者為虛如獨躁不煩者多屬寒蓋煩者心中煩為內熱也躁者身體手足躁擾或裸體不欲近衣或欲在井中為外熱也內熱者有本之熱故多屬熱外熱者多是無根之火故屬寒也有表症不得汗內外皆熱躁亂不寧取汗則定有裡實熱鬱大便不通心神不寧脈數實有力下之定火客心胞上焦不清煩躁者黃連梔子等涼藥妙起臥不安睡不穩謂之煩竹葉石膏湯心中蘊熱而煩清心蓮子飲虛煩有飲溫膽湯無飲遠志飲子此等症全仗心似燃犀燭怪目如庖丁解牛方有起死回生之效不然最易滋惑失誤耳脈虛大或微細心煩不眠為虛煩生脈散加柏子仁茯神當歸有火加涼藥一二味元參炒梔子竹茹花粉若血液耗散心神不安者猛進獨參湯如因力艱不能服者濃煎當歸補血湯代之熱病脈按之不鼓躁亂欲坐臥泥水中口中和乃虛陽上攻也即陰盛格陽陰極發躁冷服附子理中湯佳竹葉石膏湯淡竹葉君人參君甘草使半夏臣麥冬臣石膏佐上加生薑粳米水煎空心服如不禁石膏者可用濟生方除石膏加茯苓小麥即人參竹葉湯是也清心蓮子飲石蓮肉君赤茯苓臣人參臣黃耆臣地骨皮佐麥冬佐車前佐黃芩使甘草使一方加遠志石菖蒲發熱加柴胡薄荷遠志飲子遠志臣棗仁臣茯神佐人參君黃耆臣當歸臣麥冬佐石斛君甘草使生薑引若煩甚加竹葉知母戰振慄振者責其虛寒虛則不至於爭故振聳耳戰者為正與邪爭爭則股慄而戰矣戰雖重於振而慄重於戰也戰者正氣勝慄者邪氣勝也皆邪正之相爭也大抵氣血俱虛不有榮養筋骨故為之振搖而不能主持也須大補氣血人參養榮湯或加味人參養榮湯若身搖不得眠者十味溫膽湯倍加人參或加味溫膽湯人參養榮湯白芍佐熟地臣黃耆臣人參君茯苓佐白朮臣陳皮佐棗仁臣遠志佐肉桂使五味使甘草佐生薑引大棗引此方當加當歸身此十全大補湯對子也十全大補但分氣血此方五臟俱補無乎不至虛寒甚者當加附子以治之陰虛更妙十味溫膽湯枳實佐陳皮佐茯苓臣半夏臣甘草使遠志佐棗仁臣熟地君五味子使人參君上加生薑大棗筋惕肉瞤筋惕肉瞤皆因發汗攻表太過邪熱未解血氣虛奪筋肉失養所致或不因此由素稟血少邪熱搏於血脈之中火性動惕故也如傷寒不經發汗七八日筋脈動惕潮熱來尤甚其肉不瞤或瞤大便秘結不行小便赤澀以手按臍旁硬痛此有燥矢也加味大柴胡湯如傷寒十餘日曾三四次發汗過多遂變肉瞤身振搖筋脈動惕此汗多氣血俱虛故也加味人參養榮湯如汗後虛寒不得眠筋惕內瞤內有熱用加味溫膽湯加味人參養榮湯人參君白朮臣麥冬佐熟地臣當歸臣茯苓佐甘草佐川芎使五味使肉桂佐黃耆臣生薑使大棗使如陰虛相火動者加酒炒知母黃柏若陽虛下寒脈微者加熟附子肉桂倍之不得眠加遠志棗仁加味溫膽湯人參君生地君白芍臣當歸臣川芎佐棗仁臣柴胡臣黃連使茯苓佐橘紅佐半夏佐甘草使上加竹茹生薑循衣摸床循衣摸床撮空多是大虛之候乃精神耗散不能主持也不問傷寒雜病以大劑補之多有生者傷寒論云循衣摸床惕而不安微喘直視脈弦者生澀者死此乃以脈之弦澀辨胃氣之存亡緣脈弦則迢迢而長知其胃氣尚在也故可以大承氣下之而愈然亦危極矣必脈實症實者方可行之下後即宜大補敗症如經發表多者用逍遙散加熟地若發熱至八九日外舌黑脈洪數無倫已成敗症者竟用人參一兩熟地一二兩救之甚者加煨姜三片如經攻裡多者輕則四君子加歸芍或補中益氣大劑與之甚者竟用人參一兩附子三錢煨姜三片以發其汗然後用四君歸芍調理如病人素虛又發表攻裡之未當六七日後面黑大喘舌卷直視詀語舌滑而胎脈軟無力按之空虛者以獨參湯一兩與之鼻梁尖上涓涓如水是其應也次用大劑疏肝益腎湯汗大出而解如舌黑唇焦大渴引飲或兼大便溏泄小便不利者此必攻伐寒涼過多也左歸飲不用茯苓加歸芍救之陰虧甚者其脈沉細而數此時胃氣將絕更當重加參耆如遇粗工發表攻裡過當真陰耗竭燥結不出將成敗症者一味養氣補血宿物自下至理名言讀者宜細玩輕者逍遙加熟地或甘露飲氣虛者大劑補中益氣湯甚則竟用人參兩許熟地一二兩四君子湯人參君白朮臣茯苓佐甘草使一方無甘草有黃耆各等分胃傷有一種遇粗工攻伐過當胃陰大傷者濃煎六味飲與之虛熱者合生脈散中氣虛者六君理中建中補中益氣選用不能食有一種不便而不食者粗工必主便則邪去而膈清才能思食我獨曰不然必須養胃以助正助正以去邪如養未到邪不即去不食不妨也不便有不能便而能食者推陳致新倉廩盈溢自能通利不便無憂癍疹心煩不安身痛如束或足冷耳聾或咳或嘔乃是發癍之候升麻葛根湯脈弱者可加人參食少大便不實者倍用白朮血熱者犀角地黃湯俱可入酒芩連桔梗連翹元參薄荷葉天花粉之類熱甚者口乾舌燥黃胎合白虎湯以癍盡為度脈伏心煩謂之欲癍煩止神靜肌膚中無隱隱之狀始為癍盡癍已出而口乾脈洪者竹葉石膏湯化之或配涼藥一二味生地丹皮之屬洪而無力兼體虛煩渴本方加人參麥冬知母令汗出自愈嘔者大半夏湯加減脈洪數有力心下硬痛口乾而胎色漸黃黑色乃燥矢為患也大承氣湯或大柴胡湯看微甚而下之更衣舌潤為愈如未可下有潮熱煩渴者且與小柴胡去半夏合解毒加栝蔞根主之或加大青亦佳大青味苦大寒之物也解心胸熱毒治傷寒發赤癍煩痛有內傷元氣不足之症誤作外感虛火遊行於外亦發癍第脈虛大倦怠懶於言動自汗為異耳因氣血虛亦身痛心煩作熱若作有餘治立危速進補中益氣熟睡熱止為愈內傷發癍者胃氣極虛一身之火遊行於外宜補以降之大建中湯內有伏陰或誤服涼藥逼其虛陽浮散於外而為陰癍脈雖洪大按之無力或手足逆冷過乎肘膝者先用炮姜理中湯以復其陽次隨症治大半夏湯治諸嘔要藥赤茯苓臣半夏制君陳皮佐生薑使大建中湯黃耆君人參臣當歸臣白芍佐桂心使黑附子制使甘草佐半夏佐生薑引大棗引發黃傷寒熱濕傷脾則身發黃黃如橘皮而明者熱多脈必數一身不痛解熱為主黃如熏黃而暗者濕多脈必沉緩一身盡痛滲濕為主初起脈有力能食不大便茵陳大黃湯微利之或仲景茵陳蒿湯次用茵陳五苓散以滲濕解熱稍久宜固脾胃本方倍白朮氣虛脈緩弱體倦加人參或參朮健脾湯傷寒發汗不徹有留熱身面皆黃多熱期年不愈食不減者用茵陳梔子各三分二錢五分為一分升麻秦艽各四錢共末水煎服三錢以知為度秦艽退黃極妙以性能退陽明經濕熱邪氣也無濕熱者恐傷燥宜慎之水濕傷脾脾寒色見於外為陰黃脈沉身冷是四苓散即五苓去桂加炮姜茵陳重者加附子從陰症治傷冷中寒脈弱氣虛變為陰黃理中湯加茵陳服之海藏云傷寒病遇太陽太陰司天若下之太過往往變成陰黃一則寒水太過水來侮土一則土氣不足水來侵之方治如下發黃小便不利煩躁而渴茵陳湯加茯苓豬苓滑石當歸官桂主之韓氏名茵陳茯苓湯發黃煩躁喘嘔不渴茵陳湯加陳皮白朮生薑半夏茯苓主之韓氏名茵陳陳皮湯發黃四支遍身冷者茵陳附子甘草主之韓氏名茵陳附子湯發黃支體逆冷腰上自汗茵陳湯加附子甘草乾姜主之韓氏名茵陳四逆湯發黃冷汗不止者茵陳湯加附子乾薑主之韓氏名茵陳姜附湯發黃服前姜附諸藥未已脈尚遲者茵陳湯加吳茱萸附子乾薑木通當歸主之韓氏名茵陳茱萸湯趙宗顏因下之太過生黃脈沉細遲無力次第用藥至茵陳附子湯大效次第用藥者謂先投茵陳茯苓湯次茵陳陳皮湯又次茵陳附子也後趙秀才下早病黃寸微尺弱身冷次第用至茵陳四逆湯有瘀血發黃脈必微而沉或沉結不若瘀熱之脈浮滑緊數也又外症必有如狂腹滿小便自利等候宜於蓄血條求之茵陳大黃湯治傷寒發黃面目俱黃小便赤茵陳君梔子臣柴胡佐黃柏佐膽草使大黃炒使升麻使黃芩使上㕮咀水煎早晚食後溫服茵陳五苓散上以茵陳濃煎湯調五苓散二錢服日三四次黃從小便下以小便清為度茵陳蒿湯茵陳君大黃臣梔子佐參朮健脾湯人參君白芍臣茯苓佐陳皮使當歸臣白朮君甘草佐大棗使食前服復發凡感症復發世俗必作有餘治必曰因食而起殊不知有餘不盡之邪留滯陽明胃經也蓋緣戰汗後元氣虧損之甚即以補陰得汗力只及得七八分便住表既得解便能清爽其不盡者復歸陽明加以一二日之飲食與邪相蒸復騰騰而作熱矣治之當何如曰舍補正氣無由也當此之時大汗一出元氣驟損飲食入胃生化遲緩於是所留之邪與新入之物合而為火如依時師再作攻邪元氣益虛熱邪益熾索然而死矣唯以六君子湯加當歸投之縱有病愈增而熱似甚者乃是邪與食為元氣所攻發將出之候也守不過三日復戰而汗解矣或於六君子湯中加酒芩連樸更穩中氣虛而熱甚者補中益氣湯加酒芩連或曰汗至七八分而餘邪何以復歸陽明曰胃主肌肉而元氣薄故也如元氣厚者無此病也如留泊肌肉筋骨則為餘毒治法亦先補正有陰虛勞復微扶風寒與食者生地黃飲子主之若其人素壯實平日多火症愈後勞復者亦不得用攻伐七味蔥白湯主之損庵用麥門冬斤許入淡竹葉香豉頻頻飲之佳海藏麥門冬飲子亦可生地黃飲子生地君熟地君枸杞臣地骨皮臣黃耆臣白芍臣天冬佐黃芩佐甘草佐枳殼使防風使七味蔥白湯治傷寒或因起動勞復或因吃食稍多皆成此候若復甚者一如傷寒初有此症宜服此方蔥白連須君乾葛君淡豉半合臣麥冬佐熟地臣生薑使流水以杓揚之七味用清水煎去滓分二服漸漸服之取汗麥門冬湯治勞復氣欲絕者用之有效能起死回生易老加人參尤妙麥冬君甘草佐粳米臣先煮米令熟去米入藥五錢棗二枚竹葉十五片溫服此方當有半夏咳嗽傷寒以咳嗽為輕蓋風寒暑濕先自皮毛而入皮毛者肺之合也雖外邪欲入臟腑必先從其合而嗽也肺主氣形寒飲冷則傷之使氣逆而不散衝擊咽膈令喉中淫淫如癢習習如梗而咳也或云咳則有聲無痰嗽則有聲有痰初起脈浮緊頭痛拘急惡寒發熱無汗者冬月十神湯加減余月芎蘇飲加羌活二方輕重得宜凡非時之氣皆可用如火盛者加涼藥一二味枯芩知母花粉地骨之類如胃熱熏蒸其肺而嗽者合白虎挾虛者加人參或人參石膏湯若脈浮自汗頭眩眼脹鼻塞清涕者傷風候也亦以十神芎蘇二方分治脈弦口苦發熱而咳者少陽也小柴胡去人參大棗生薑加五味子乾薑主之若發熱胸中煩滿而咳者加炒栝蔞若胸脅痞滿發熱而咳者加枳實如下利嘔渴心煩不得眠而咳嗽者豬苓湯四肢厥逆腹中痛泄利下重而咳者四逆散加五味子乾薑停飲與表寒相合者小青龍湯仲景謂表不解心下有水氣乾嘔發熱而咳是也停飲與裡寒相合者真武湯去芍藥加五味子乾薑細辛仲景謂四肢沉重疼痛小便如常大便自利而咳是也有手足逆冷上過乎肘下過乎膝脈沉細而咳者陰症也四逆湯加五味子有病傷寒咳嗽喉中聲如𪖙與獨參湯一服而𪖙聲除至二三帖咳嗽亦漸退服二三斤病始全今人因右寸脈大不知分別有力無力妄投瀉劑死者多矣大是豁大無倫真空虛陰亡之象若有餘其大必牢內經五色奇咳論曰五臟六腑皆能令人咳非獨肺也又云聚於胃關於肺之旨乃風寒上襲之初咳症故辛散溫潤清滋使上焦之邪表散咳斯愈矣若後之水氣停飲與夫陰寒厥逆致咳非溫通開合宗仲景法加減不可若套以時派表劑則速之咎矣此論反覆辨晰次第用藥深得仲景之旨而於哮喘喉聲如𪖙之症與獨參大劑誠千古之卓識今之昧此義者蓋多多矣本草人參有定喘之功能惜讀者漫不經心而忽之也況喘症之虛者由元海無根致腎氣不納脈之滑大無倫斯時重用獨參以回元海猶慮鞭長莫及何敢咳藥為也又豈可與凡庸以脈大輒投瀉劑而死者同日語耶故揭出以告讀是篇者十神湯白芷臣紫蘇葉君麻黃佐陳皮臣川芎佐香附臣升麻使葛根君赤芍佐甘草佐生薑使蔥白使十味芎蘇飲前胡佐葛根君枳殼佐桔梗佐半夏臣陳皮佐桑皮佐杏仁臣川芎臣紫蘇君生薑使大棗使準繩方無桑杏前胡有柴胡苓草人參石膏湯治傷寒咳嗽不已心煩及風熱頭疼精神不利昏憒人參君石膏臣半夏臣梔子仁佐黃芩佐川芎佐茯苓臣白朮君生薑使作一服四逆散甘草炙君枳實佐芍藥臣柴胡佐餘熱咳嗽有感症汗不透餘熱在胃咳嗽不止養血涼血不效者每用六味飲必應蓋熱氣逼傷胃陰也有挾虛感症用參耆等氣分藥而愈愈後漸見乾咳乃餘邪為胃氣鼓動欲出也若認作真虛症再投歸脾生脈等劑則重斂其火漸傷陰分而成弱者有之矣宜養血涼血順其勢而導之不可泥為補劑得力之後寒涼傷中畏而勿用也有陽明症宜汗不得汗漸見咳嗽吐痰者此時取汗益不可得只投清潤之劑如二冬二母天花粉地骨皮之類寒熱未止者小柴胡為主加入上藥久久痰清咳止經絡熱邪即從此解雖終不得汗亦有漸愈之理遺毒發頤凡傷寒汗出不徹邪熱結耳後一寸二三分或耳下俱腫硬者名曰發頤此為遺熱成毒之所致也宜速消散則可若緩則成膿又為害也竟有失於汗下中宮伏熱鬱極發為胃癰者須細審之若漫不加意懵然執傷寒之成法以治鮮有不潰敗者感症有三四日後即發癰者有一起便發者治皆不外陽明一經初起亦有兼少陽者有一種感症被俗師混加汗下以致誅伐太過氣血大傷究竟所感之邪鬱而不泄發為癰腫此時急為補正大劑參耆歸術加熟地兩許以救之庶可起發收功若用連翹皂刺芩連等去生便遠有肝腎大虛發於至陰之處道路遙遠必煎劑送大填大補丸子方效否則遷延時日拖成弱症終不救也有一種火實之人所感又重非大劑辛涼及重用石膏不可甚者須加大黃而醫者過於小心始則略為解散至三四日後便用養陰之法以致邪毒鬱伏發為癰腫當急以清解透發之藥消之若作騎牆之見兼用固本等則熱邪為潤藥黏滯不得透達必成大害矣慎之慎之固本等所以養胃今服養陰藥既多則胃中津液原不竭也且遺毒既自經絡而達肌表自當因勢利導之遺毒發頤用槐花四五兩微炒黃乘熱入酒二鍾煎十餘沸去滓熱服未成者二三服已成者一二服胃弱者忌又法用生忍冬藤即金銀花藤四五兩生甘草節一兩先用水二碗煎至一碗再入酒一碗煎十餘滾去渣飲之渣敷患處連翹敗毒散治發頤初腫服此消之連翹君羌活臣獨活佐荊芥佐防風佐升麻使柴胡臣甘草佐桔梗佐川芎佐歸尾佐蘇木使紅花使天花粉臣牛蒡子君上水酒各半煎徐徐溫服如未消加蛤粉炒穿山甲一錢腫至面者加香白芷一錢漏蘆五分大便燥實者加酒浸大黃一錢五分壯者倍之凡內有熱或寒熱交作者倍用柴胡加酒洗黃芩酒炒黃連各一錢內托消毒散治發頤有膿不可消已破未破服之人參君黃耆君當歸臣川芎佐防風佐白芷臣升麻使柴胡佐甘草佐桔梗佐連翹佐金銀花佐上水酒各半煎徐徐溫服
