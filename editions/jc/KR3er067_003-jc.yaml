body:
  text: 卷三四明心法下中風中風之病形何如曰真中風者其病不過在經絡經絡之氣為風所逐則氣逆行氣逆行則臟腑之氣血不能外達故多卒然仆倒不省人事感輕者半身不遂口眼歪斜及經而止也類中風者其風自內出景岳故以匪風名之東莊云小兒慢驚慢脾皆此義但治法不同耳七情縱恣六淫外侵真陰不守久之水衰火盛風從火出離其故宮飛揚飄逐卒然仆倒故其人兩腎腰胯間及臍下必冰冷如鐵蓋別病必他臟先病緩緩窮到腎經五臟相傷窮必及腎也然由腎經先病以及他臟者亦多惟中風竟是腎經與命門無形之水火自病故一病竟絕也當其發病之際必有一股虛氣從兩腎中間上夾脊穿崑崙過泥丸直到命門命門為三陰三陽聚處此股氣一衝三陰三陽之氣亦突然而散遂外不省人事而在內臟腑之氣亦隨之而去臟腑之氣既去而手撒眼合亦有開而直視者遺尿聲𪖙口開等症又相隨而來矣此命門即素問至陰之根結於命門乃兩腎之上下左右各相去一寸其中間便是丹家之元神也命門之義景岳類經三焦辨並呂批邯鄲形景圖最詳此股虛氣是即所謂無形之火也緣無形之水虛不能守遂化作冷風騰空而去真中風者小續命湯其人形體實無類中風症卒然仆倒者北方有之江南少見北方風厲而臟腑經絡剛厚南方風溫而臟腑經絡柔薄故北多真而南多類其治迥不同也然其間亦有互見者非謂南必無真北必無類也特治法宜稍變耳四明於北方曰有之於江南曰少見語意甚圓總當因人以施治不必域地以論症也其有形體似剛厚而若見一兩種類中脈症者亦是形盛氣衰也慎勿誤治類中風者乃大虛也其症卒然仆倒眼合口角喎斜手撒遺尿大抵見一種猶可數種俱見不治尤當急以手按其少腹冰冷如石者當急灸氣海穴在臍下一寸五分並用蒸臍法薛氏治寒淫於內治宜辛熱而神脫脈絕藥不能下者急炒鹽艾附子熱熨臍腹以散寒回陽又以口氣補接其氣又以附子作餅熱貼臍間時許神氣少蘇四明所謂蒸臍法大略如此附錄以備參用脈必二三至闊大虛軟如棉花急煎人參一二兩附子一兩或有生者初發時可救遲則無及矣俟其勢定方用人參五錢黃耆二兩附子五錢不數飲之但覺臍下溫和手足運動口眼能動是矣待飲食如常二便如故大劑補中益氣湯加附子三錢吞八味丸至兩許其有頭目眩暈難開開即見居室百物俱倒轉胸中漾漾噁心欲吐即類中風之漸也急須節飲食戒七情遠房事以預防之治法同上但不必灸藥物足矣服藥預防當察其脈如兩尺虛衰者六味八味等丸培補肝腎寸關虛弱者六君十全等劑調補脾肺才有補益若服搜風順氣及清氣化痰等藥適所以招風取中也小續命湯麻黃桂枝杏仁防風防己川芎白芍黃芩人參附子甘草傷寒傷寒之病形何如曰傷寒初感入於皮毛玄府壅塞氣不得舒無所發泄故臟腑之氣亦拂鬱而生熱也其所為傳裡者肌肉不能傳也肌肉之中有所為絡筋經筋皆內達臟腑臟腑之氣血由此而滲潤於肌肉是即井榮俞經原合之筋脈也故邪氣由皮毛而肌肉由肌肉而經絡而傳入臟腑經絡臟腑相傳序次具見診法中是為表傳裡也又素問中循經傳者緣足三陽經從頭走足以其相併而行故傳亦易而循次也其有越經傳者是井榮俞經原合互相交錯之處值一經虛者邪乘之而遷也素問所言者常也越經者變也至於由經絡而臟腑如陽明病目痛惡寒身熱鼻乾不得眠此陽明胃經病也傷寒書所謂陽明表症也已後潮熱自汗譫語發渴痞滿燥實大便堅硬者邪毒傳入胃中胃必大熱津液悉燥胃陰枯而少潤澤之態此書中所謂正陽明腑病也舉此而三陽可類推矣所謂直入陰經者乃心肝脾肺腎臟之經受肅殺嚴寒之氣由肌肉間之經絡直逼臟中或心或肝或脾或肺或腎冰冷如鐵氣不能通便成陰症也此時急以熱藥依經通之漸漸溫熱使臟中熱氣得通於肌肉間之經絡也舉此而三陰可類推矣東莊云陰症者寒邪直入三陰之經以三陽主氣衰無熱拒寒故也三陰各有分症今人卻以房勞後得病不分陰陽脈症輒命曰陰症致令病家諱言惡聞此二字亦可笑矣房勞得病乃挾虛感有陰有陽非必為陰也傷寒本症及傳變各症極多看準繩自知之此不能備述也傷寒一法惟太陽症用麻黃湯發表一涉口渴則非太陽症矣緣太陽經絡行身之背故有項強頭痛方是表症余則與表無涉麻黃髮表等藥所當禁忌也潔古之九味羌活湯與雙解散俱可廢而不錄今真傷寒絕無雖發於嚴寒亦當作內傷治況不發於肅殺之令乎予立五法以治內傷而熱症無餘義矣原汗乃胃中津液也故傷寒書中最要緊關頭在存津液三字至熱鬱於內則津液亡矣何以能助其汗乎一驗其舌胎白如刺此肺病也生脈散加生地白芍當歸黃耆甘草柴胡黃芩以生金滋水一舌胎黑滑此腎氣凌心用八味飲黑燥用六味飲以救腎陰一舌黃胎補中益氣湯加黃芩或黃連以補土生金如有食去黃耆加厚朴白朮不可去且發其汗縱有食不顧也一舌覺轉動不活防其卷也逍遙散加黃芩丹皮生地以滋水生肝一舌鮮紅此心經病也六味飲合生脈散以滋水清火凡內傷外感寒熱之分皆從舌胎顏色為準如黑而滑者乃腎氣凌心用八味飲如枯黑不潤澤者用六味飲其人必兩顴遊紅一劑戰而汗愈如白而加黃黃而加黑此腎凌脾須治中宮如補中益氣之類腎乃北方元武之色故屬黑且火位之下水氣承之水來救母若此時泄火火無從泄助子以救母則仇未有不復者也亢則害承乃制其理昭然如是灰色指甲刮下無渣汁者謙按指字上當添但以二字使讀者尤為顯豁方是火症乃芩連之對症也若腎氣凌心而用芩連則舌上現出人字紋必死黑而不滑則腎水枯乾當急救其陰也凡烈焰近炙則燔手漸高則愈冷緣冷氣乃火逼所致熱病之舌黑即此理也太陽行身之表是身之背也三陰行身之裡是身之前也少陽則半表半裡按少陽行身之側主三陽之樞紐十二字經文當補之譬如該補中宮而邪熱未除補中益氣湯合小柴胡以治其少陽是半表半裡也傷寒治法不論四時六經但見發熱三四日俱當以逍遙散與之四時六經似無一方統治之理然外傷寒而內發熱以火為寒邪所郁也既為火鬱則逍遙自可以統治矣景岳六柴胡飲亦是此義如兼食者合小柴胡湯合小柴胡則六君全矣可兼助脾而消食矣然此是兼食而未經發表者如經發表多者竟用逍遙散加熟地以救其陰如發熱至八九日外舌必黑而燥可知然亦有但燥而不黑者脈必洪數無倫竟用人參一兩熟地一二兩甚者加煨姜三片此症若誤投白虎則陽無所附而立斃矣治法備忘載一感症誤服白虎以致身如燔炙衝開三五尺許視者不能近身緣真陽無所依附此欲脫之機也若再不進參附等劑勢必至夜半汗止而斃矣遽用人參一兩炮姜三錢附子錢半熟地二兩歸芍各三錢炙甘草一錢薑棗為引一劑而人事蘇以漸調理而安附錄以為肆用寒涼者戒方中炙甘草不妨再加一二錢尤妙兼食者面必擁熱通紅氣粗脈必牢實神思昏沉胸前按之必微痛滿舌必有黃胎且必兼厚而燥視其微甚用逍遙散加熟地自四五錢可用至一二兩此就已經發表者言蓋發表既多則津液乾枯宿物燥結而不能出故必重用熟地使陰血下潤則大便自通宿食自下也如經攻裡多者輕則四君子湯加歸芍或補中益氣湯大劑與之甚者竟用人參一兩附子三錢煨姜三片以發其汗下多則亡陽故用參附以回其陽陽回而汗自作矣下多亡陽之下字似與經旨下多亡陰汗多亡陽相背然此陽字當作陰中之陽看理自圓矣然後用四君子湯加歸芍調理凡十一二月傷寒或從畏寒而起者此即感也屬表症前胡湯主之二劑後不應當以小柴胡湯加枳桔與之如二劑後再不應仍用逍遙散繼之無不愈也凡發熱覺脅痛耳聾口乾舌黑此屬邪不清也逍遙散加丹皮生地酒連二三劑如不應即屬火燥疏肝益腎湯或歸脾湯加柴胡白芍已燥不宜再燥須去木香並用米飲泡蒸白朮為妙有熱甚而痛及手足頭面似覺腫起竟有瘰塊如頤者此火燥生風風淫末疾也滋腎清肝飲加熟地一倍為主禁用寒涼藥四明治徐彥為子及江仲璉兩案俱是此症須參之凡大便硬者除合仲景痞滿燥實堅症方可議承氣湯然世甚少太陽症今治傷寒用前法尚有痞滿燥實堅症乎且勿論其是太陽非真太陽如遇粗工發表攻裡過當以致真陰耗竭燥結不出者一味養氣補陰宿物自下陰枯便燥則補陰自可濡潤矣而必兼養氣者以推送無力也須安慰病人勿急於攻下守至數日自可奏效也奏效雖遲而實穩當的是仲景功臣或有一種不能便而能食者推陳致新倉廩盈溢自能通利不便無憂四明之治吳弁玉是也有不便而不食者粗工必主便則邪去而膈清才能思食矢醫所見本只如是矢古通屎粗工不知氣虛液涸不能傳送猶肆攻下以見屎為快故名矢醫耳予獨曰不然必須先養胃以助正助正以去邪如養未到邪不即去不食不妨也凡傷寒復發世皆作有餘治必曰因食而起殊不知有餘不盡之毒留滯陽明胃經也蓋緣戰汗後氣血虧損之甚即以補陰得汗力只及七八分便住表既得解便能清爽其不盡者復歸陽明加以一二日之飲食與邪相蒸復騰騰而作熱矣曰治之當何如曰舍補正無由也當此之時大汗一出元氣驟虛飲食入胃生化遲緩於是所留之邪與新入之物合而為熱如依時師再用攻邪則元氣復虛熱邪益熾索然而死矣惟以大劑當歸六君子湯投之縱有病愈增而熱愈甚者乃是邪與食為元氣所攻發將出之候也守不出三日復戰而汗解矣若用苓連退邪枳樸消食必死何疑或曰汗至七八分而餘邪何以復歸陽明曰胃主肌肉而元氣薄故也如元氣厚者無此病也如留泊肌肉筋骨則為餘毒治法亦先補正凡直中三陰者理中真武四逆等類辨症用之如夏月坐涼亭水閣高堂大廈中亦能中寒附子理中湯不可泥於盛夏而禁用熱藥也亦有寒中厥陰少陰者當分經治之戴陽者兩顴淺紅必遊移無定處不盡面通紅或煩躁發狂欲飲水坐臥泥水中此陰盛格陽也大劑八味飲或參附湯人參熟地可用至一二兩附子可用至三五錢如認作白虎症治立死此症與後白虎症最易混淆一或誤投生死立判辨晰宜精細也中暑者面部通紅紫脹眼白必黃更以口渴辨之凡中暑口必渴面赤氣粗發躁狂亂審知陽明的確方可投白虎前胡湯前胡柴胡紫蘇桔梗陳皮半夏白芷甘草薑棗為引有食加枳實承氣湯大黃芒硝厚朴枳實上方去芒硝名小承氣湯去厚朴枳實加甘草名調胃承氣湯真武湯附子白芍茯苓白朮生薑四逆湯附子乾薑甘草上方倍乾薑名白通湯參附湯人參附子上方去人參加黃耆名耆附湯白虎湯石膏知母粳米甘草上方加人參名人參白虎湯瘧疾瘧疾之病形何如曰瘧之為病非經非絡非臟非腑乃夏月汗出太多肌表空疏外感暑邪直入臟腑募原之間待收藏二令一行玄府閉密則所藏之邪無以泄其怒而寒熱作矣然其寒也乃內熱將作火沖其氣故凜凜而寒非真冷也故不得以熱藥治之也然素問分六經瘧豈募原足以盡之與曰非是之謂也凡臟與臟腑與腑或臟與腑彼此相接之處中間蓋有虛界之募原而虛界中復有剛柔筋脈其為某臟之筋便為某臟之病譬如胃與小腸相近而邪入於胃與小腸之虛界而彼筋脈屬胃則為陽明經瘧也又如肝與脾相近而邪入於肝脾之虛界而筋脈或屬脾便為太陰經瘧矣究之臟腑雖病皆因募原之氣遷移也至於每日間二日者瘧之衛氣日行一周歷五臟十二經之界分每一界分必有其舍營衛之有舍猶行人之有傳舍也舍有隨經絡浮沉內薄之外邪故與日行之衛氣相集則病作離則病休也間日間二日者由其募原之遠近也瘧疾一症前人雖備言之然於夏傷於暑秋必病瘧經旨殊未透闢也四明論本邯鄲而益闡其義始知向來醫家只於臟腑經絡中求之直是隔靴搔癢耳曰古人言無痰不成瘧信乎曰痰之所為非熱不生今病人飲食入胃而每日發熱則脾不能守其靜化一味外邪熱化煎熬並飲食而化為痰邪矣此言因瘧只以生痰也其有先傷飲食而痰熱內作復挾外感之暑邪變而為瘧者有之矣此則由痰而作瘧也然必內傷飲食而後生痰外挾暑邪而後作瘧則痰與瘧皆屬標病而所謂無痰不成瘧者非謂必因痰而致瘧也只是凡瘧莫不兼痰耳無痰不成瘧此句須合上兩條看其理乃圓凡瘧皆由脾虛如內傷飲食與外感暑邪皆不出脾虛二字範圍脾不虛則飲食不得而傷暑邪無自而入矣此些二語乃透瘧病之根醫家不可忽諸瘧初發時治法不論六經內外只用清中驅瘧飲或清脾飲三四發不應以二妙丸與之立除若淹延歲月不愈者一味六君子湯自愈立齋云凡人久瘧諸藥不效以補中益氣湯加半夏用人參一兩煨姜五錢此不截之截也一服即愈有發在酉時者五發內俱當用香紅飲古人用升提法轉出陽分不過言道理當如是耳時人執此法愈提則陰愈虛矣且凡屬夜病若俱要見陽而愈則亦不勝其升提矣間一日者與每日發者治法不甚相遠惟三日瘧最難治予於歲月未久者用參湯下二妙丸服至半月一月自愈如年深月久尪羸不堪者大劑養榮湯吞八味丸仍於湯中加熟附子一錢十帖必除東莊云久瘧用補中益氣不效者八味丸有神應予每得其力然不若兼服養榮其效為尤速也瘧痞初起三妙丸加鱉甲久服自愈須治之於早否則未有不成脹者清中驅瘧飲柴胡黃芩半夏山楂枳實厚朴青皮陳皮草果蒼朮生薑二妙丸橘紅半夏薑製上為末神麯和丸每發前三個時許吞一二服自然不發矣凡有痰有食誤服補藥以致不瘥者用此立愈或再用小柴胡湯加枳實桔梗二三劑香紅飲人參益母當歸香附紅花生薑按邯鄲云凡治瘧必先問其寒熱多寡而參之脈症有寒多熱少者有熱多寒少者大抵寒熱往來皆屬少陽經治法當以小柴胡為主若寒多者小柴胡加桂枝有但熱不寒者名曰癉瘧有但寒不熱者名曰牝瘧然亦有不可執者當察脈之虛實何如若但寒者其脈或洪實或滑當作實熱治若但熱者其脈或空虛或微弱當作虛寒治凡瘧將發之時與正發之際慎勿施治治亦無效必待陰陽升極而退過此邪留所客之地然後治之且當病未發二三時前迎而奪之可也經曰陽虛則惡寒陰虛則惡熱陰氣上入於陽中則惡寒陽氣下陷於陰中則惡熱凡傷寒後大病後產後勞瘵等症俱有往來寒熱似瘧非瘧或一日二三度發並作虛治但有陽虛陰虛之別耳余見發瘧有面赤口渴者俱作腎中真陰虛治無不立應凡見患者寒來如冰熱來如烙惟面赤如脂渴欲飲水者以六味加柴胡芍藥肉桂五味大劑一服便愈又有一等鬱症似瘧者其寒熱與正瘧無異但其人口苦嘔吐清水或苦水面青脅痛耳鳴脈澀須以逍遙散加茱連貝母倍柴胡作一服繼以六味加柴胡芍藥調理痢疾痢疾之病形何如曰痢疾一症古人咸以赤白分寒熱殊不知傷氣分為白傷血分為赤丹溪以先水瀉後膿血為脾傳腎先膿血後水瀉為腎傳脾此已發前人所未發至損庵以為種種痢疾總由濕熱入胃此一句便可悟病形矣濕熱入胃一語道盡致痢之根蓋胃為多血多氣之海故氣分血分宜專指胃而言所謂傷者濕熱入而傷之也夫濕陰氣也入胃則傷胃之陽熱暑毒也入胃則傷胃之陰古人以赤白分寒熱蓋誤以濕為寒耳茲以赤白分氣血則的確分明千古論定矣痢疾腹痛必是繞臍以下當小腸之分野飲食入胃挾暑毒而歸於中脘初食未成糟粕後食以繼之則初食挾毒而歸於下脘矣夫中無毒邪則氣血升降得以循其正所入之食變糟粕而從下脘歸小腸矣若毒與食在下脘則升降不得循其正糟粕欲行而不行然畢竟要行句而不得行則將臟腑脂膏逼迫而下此臟腑亦專指胃而言迨交入小腸之後膿血由小腸而刮下白似膿赤似血即臟腑脂膏為糟粕所逼迫而下者也小腸緣無毒而是糟粕則得循其正故小腸雖曲而順下無礙惟膿血則不得循其正而不肯下故痛繞臍而下屬胃之下口此小腸交界處正將脂膏逼迫而下之地也及小腸也此是不得循其正而不肯下之膿血由此而刮下之地也小便不利者小腸為毒邪所迫不能分利故短縮也又有膀胱為毒火所逼而不利者噤口者乃毒氣原盛或破藥太過挾傷上中二脘宗氣邪毒乘虛而上逆也薑製黃連與人參同煎一匙一匙細細呷之有不從暑毒而得者或食瓜果甲午九月仲弟丹山年甫十七怒後縱啖生菱逾日腹痛不食大便膿血迎村醫治之不知其為生冷所傷也雜用痢門套藥十有餘劑病勢垂劇時予館安邑家君走人召予急歸時則循衣摸床撮空見鬼虛症具見視所用藥猶然檳樸芩連之輩也更醫回挽卒不能起衰毀憤抑痛恨弟病之誤殺於庸手始讀竅素類經並張李朱薛等書日夜尋繹如有夙𢍆噫醫之殺吾弟而使之不壽於世也其中豈有天焉欲就吾以醫而並使吾弟之得壽於是編耶識此以見痢之不因暑毒得而誤以暑毒治未有不偕吾弟而同抱泣於九原者凡吾同道中人其可不細心而辨晰耶或臥高室大廈皆由虛得但隨感隨發病止在下脘寒氣所乘脾亦不運故為痢如逾二三日寒化為熱其病形與暑毒同也正惟此處要誤人耳不可不知諸痢疾脈流連細小者生浮數洪大者死凡痢疾初起三日內可皆用白芍藥湯立除東莊亦云此方用之初起三日內無不立效無疑於肉桂之大熱而畏不敢用也若初起但覺腹痛水瀉無度厚朴湯主之一見紅白毒勢凝結矣但當解毒和血養氣切莫破血行氣是為大法調金湯主之如服調金湯後紅白減而漸見糞色便當減芩連分數芩用一錢猶可連須漸減加人參矣此宜相機消息之紅白盡除六君子湯加歸芍調理如初起發熱此熱病也竟以調金湯加柴胡與之初熱只用芩熱甚方用連此則必視其熱之淺深色之紅白而分別用也久痢能食六君子湯加歸芍久痢發熱不能食肌肉減者不治白芍藥湯治熱痢便血後重經曰溲而便膿血此氣行而血止也行血則便膿自愈調氣則後重自除白芍當歸大黃黃芩黃連肉桂檳榔木香甘草如不減加大黃按長洲云此症多有因中氣虛弱脾氣鬱結者治當審察厚朴湯厚朴檳榔枳實澤瀉青皮黃芩甘草調金湯黃芩黃連澤瀉當歸白芍丹皮神麯陳皮厚朴姜引按四明自造澤瀉湯並加減四方治痢甚驗今錄於下以備臨是症者之採用澤瀉湯澤瀉丹皮楂肉滑石當歸白芍黃芩青皮厚朴木香甘草紅積加川連八分至一錢五分見血加生地二三錢初起毒盛人如壯實者加酒製大黃二三錢如身熱加柴胡一錢初起方澤瀉丹皮楂肉滑石當歸白芍黃芩青皮厚朴柴胡黃連甘草起數日腹痛後重方澤瀉檳榔厚朴當歸白芍川芎柴胡黃芩黃連桃仁滑石甘草半月餘方澤瀉橘紅厚朴升麻當歸白芍生地黃芩燈心蓮肉黃連甘草久痢方澤瀉茯神人參丹皮生地熟地黃芩黃連當歸白芍鼓症鼓即腫滿也不論五臟六腑新久虛實一味補中益氣湯盡之但有鬱而成者和中丸妙妙在陳皮木瓜兩味即種種初起俱可舍是而別有方法吾不信也又有一種寒水侮土者其腫必先頭面四肢起然後及於腹中惟此症可以補中益氣湯吞金匱加減腎氣丸此症單服補中固不效單服金匱亦不效然當治之於早不然水勢沖中士崩岸敗無濟於事矣又有中虛而挾燥膨滿者竟用補中益氣湯送玄明粉三錢其應如響又有一種食鼓者乃是飲食所傷初起必先雀目俗傳雞盲入肚者即此症也醫家不信只治眼目不知乃是鼓之根也此時當急用清劑以治之經曰開鬼門潔淨府去郁除陳是也然古法太峻今定一保中丸久服自愈保中亦未始不峻久服必傷中氣用宜斟酌張盱江云脹滿悉屬脾虛運化不及濁氣填塞所致初起微佐以消化舒郁為先勢甚而二便澀滯者微利之弱人或稍久一切痢後瘡疽後產後必參朮耆芍大補脾氣為主而佐以消化厚朴木香黃連之類然王道無近功必數十服以漸取效常見用商陸牽牛等行水法一瀉即消然三日後復起而死者比比皆是良由病家求速效醫家不明理天人天年悲哉歷考古今明醫無逾於東垣丹溪薛新甫王損庵矣豈肯曠日持久而不知克伐之功速耶其如中氣何可與高明言難與俗人道耳東莊云治腫脹任其效否當以前法為樞機疏鑿浚川神祐等方非萬分稟厚形盛氣實不可妄用丹溪補脾保肺清火實不易之則也和中丸陳皮一兩木瓜一兩去穰人參三兩白朮三兩乾薑一兩甘草一兩上為末蒸餅丸食前白湯下三五十丸金匱加減腎氣丸治脾腎虛寒腰重腳腫濕飲留積小便不利或肚腹腫脹四肢浮腫氣喘痰甚或已成水症其效如神茯苓三兩澤瀉一兩山藥一兩萸肉一兩丹皮一兩附子五錢肉桂一兩牛膝一兩車前一兩熟地四兩掐碎酒拌杵膏上為末和地黃膏煉蜜為丸桐子大每服七八十丸空心米飲下保中丸枳實炒厚朴薑汁炒黃芩酒洗半夏薑汁炒蒼朮米泔浸炒陳皮萊菔子炒三稜蓬朮等分上神麯為丸膈症膈症之病形何如曰膈之為病一陽明盡之矣丹溪以噎膈反胃之病謂得之六淫七情遂有火熱炎上之化多升少降津液不布血液衰耗胃脘乾枯其槁在上近咽之下水飲可行食物難入入亦不多名之曰噎其槁在下與胃相近食雖可入難盡入胃入即吐出名之曰膈飲食之際氣忽阻塞曰噎心下隔拒或食到膈間不得下曰膈良久復出者翻胃丹溪合而為一固為未盡醫貫竟以噎膈為上脘乾槁不納食而以嘔吐歸之翻胃則亦不盡其理東莊云噎膈亦有食入而吐者但不同於翻胃之每食必出翻胃止吐原物有食必盡噎膈則或食或痰或白沫酸水或多或少或初病不吐而久之屢作或吐糟粕非痰非食非血若醬汁然者此上脘下脘枯槁皆噎膈也總緣下脘與厥陰少陽相逼七情用事肝膽先病病則鬱而生熱熱則其氣熏蒸於胃久之胃中陰血亦干而漸至糟粕不能受氣化之推移積疊於胃底於是胃中之氣上逆而為火中脘為火所盤踞竟不思谷矣其津液不能下行則小腸下之闌門亦致枯槁小腸手太陽也閉則生火愈干則愈熱愈熱則愈干亦不能司其泌別矣然後膀胱無所稟受而小便赤濁大腸無所稟受而便若羊矢大腸無血故也成不治之症矣從胃脘上下溯源窮流闡發靡遺膈症主此思過半矣總之胃為氣血之海人見其不思飲食便為胃氣之虛用參耆白朮補之見其食即嘔吐便為胃中之寒以薑桂茱萸暖之補之則增其膈暖之則速其亡總因不達三陽結三字之精義耳殊不知腸胃之為物最喜潤澤試以羊豕之肚觀之必是滑膩稠黏如液如脂如膏如澤在人胃亦如是所謂陰也膈症之人其腸胃必枯槁乾燥絕無滑膩稠黏等象是胃陰亡也陰亡地氣絕也地氣絕則天氣從何處生乎故多死急救胃陰亦或有得生者膈症與翻胃何以辨之膈症飢欲得食可知非不思食也實不能食耳前後思食思谷等數思字俱改能字為妥但噎塞迎逆於咽喉胸膈之間在胃口之上未曾入胃即帶痰涎而出若一入胃無不消化不復出矣惟男子年高者有之故曰少無噎膈翻胃者飲食倍常盡入於胃矣但朝食暮吐暮食朝吐或一兩時而吐或積至一日夜而吐腹中脹悶不可忍而復吐出原物酸臭不化此已入胃而反出故曰翻胃男女老少皆有之此辨甚明治膈症者或以為胃虛而用溫補或以為開鬱而用香燥等劑必至死而後已溫補香燥俱以助火藥與症反不死何待不知此乃關門枯槁腎水不能上達經曰腎乃胃之關關門不利升降息矣關門即氣交之中天之樞也故腎旺則胃陰充足胃陰充足則思食當用六味飲加歸芍養之予治荊溪潘爾修之膈用左歸飲去茯苓加生地當歸兩大劑而便潤食進又十劑而兩便如常飲食復舊蓋以左歸飲中有甘草則直走陽明以和其中且當歸生地合用則能清胃火以生其陰胃陰上濟則賁門寬展故飲食能進胃陰下達則幽門闌門皆滋潤故二便如常去茯苓者恐其分流入坎不若端顧陽明之速效耳或血燥大腸枯乾有黑屎積疊胃底則當以熟地五錢當歸白芍桃仁麻仁各三錢微微潤之如其形體如常氣血充足即以前方內加大黃一二錢以助血藥東莊云損庵嘗言大黃治膈之妙實出至理但不可施於久病與羸敗者耳如用竟合四物湯或麻仁潤腸丸佳大腸一潤利而胃自開矣慣用大黃者第見其用以敗胃耳而不慣用大黃者偏能用以開胃豈非奇絕一開之後大劑六味左歸等類不數飲之方有濟也脈必至數均調其形體則微大而弦有一種大便甚利且溏與膈症分別處只在此每食必吐是名翻胃王太僕云食入反出是無火也八味丸主之此驗症全在大便如一干結便非無火一味滋潤如前法東莊云此症則王太僕之論為的壯水之主益火之原二法隨症並用趙氏分噎膈為無水反胃為無火非也噎膈但不能食耳反胃必吐即出久出以遲速分也吞酸吞酸之病形何如曰凡為吞酸盡屬肝木曲直作酸也河間主熱東垣主寒畢竟東垣是言其因河間言其化也蓋寒則陽氣不舒氣不舒則鬱而為熱熱則酸矣然亦有不因寒而酸者盡是木氣鬱甚熏蒸濕土而成也或吞或吐也又有飲食太過胃脘填塞脾氣不運而酸者是拂鬱之極濕熱蒸變如酒缸太甚則酸也然總是木氣所致若非木氣即寒即熱即飽即拂鬱亦不酸以酸為木氣也曰胃與肝膽其分野若何而能令種種作酸也曰少陽與陽明經相併而行肝並於胃故胃熱則少陽相火與厥陰之火皆外相引而熏蒸至於七情之郁輕者木氣太盛干犯土位重者腎水枯涸腎水奔逆載水上浮荊棘橫施濕土渾濁不由於寒不由於熱而吞吐皆酸此又河間東垣因熱因寒之說所不及也又有一種飲食入胃即成酸味此必傷寒久瘧胃陰未復水穀入胃增其濕熱而酸者當以淡味滋養真陽而後可治也東莊云吞酸一症東垣作寒論河間丹溪作熱論世人因有標本之說分屬之但治酸常得芩連症薑桂者甚少豈東垣之法可廢與緣治初見必用溫散久之寒化為熱未有不從熱治也予特未遇初病者耳眩暈眩暈之病形何如曰眩暈之病悉屬肝膽兩經風火風火屬陽陽主動故目眩轉而頭暈也譬如火焰得風則旋轉不已緣手少陽之支者從耳後出至目銳眥而交於足少陽足少陽之支者從跗上入大指爪甲出三毛而交於足厥陰經曰五臟六腑之精氣皆上注於目而為之精裹擷筋骨血氣之精與脈併為目系上屬於腦後出項中故邪中於項因逢其身之虛其入深則隨目系以入於腦人於腦則腦轉腦轉則引目系急目系急則目眩而轉矣所謂邪者總風寒濕熱內外之諸邪也然則何為而屬於肝膽蓋五臟六腑之精氣上注於目是必循筋脈而才能上注肝主筋肝有風火則筋病而上注者壅而不行所謂目系者因風火而燥燥則收引而急急則目眩此一說也又膽經之脈從童子髎穴終足厥陰故膽經風火亦致掉眩也故經曰諸風掉眩悉屬於木也又有太陽之氣標在於巔又絡於腦又膀胱穴自睛明出至陰於足外故寒水之氣太過凌逼真火亦眩僕也又有心下有支飲其人冒眩是格心火不行而上衝頭目也又有風寒相搏食谷即眩是內受濕飲之郁而不足之微陽與所郁之熱並而上衝於頭目為眩也睛明穴屬陽明謙按睛明穴屬太陽此言屬陽明故注以俟考又陽明支者入目內眥故眩也又有腎陰不足三陽之焰震耀於當前陰虛之人常若眩暈目中忽見火如星炮胸膈必有痰發暈時眼不可開開則所見之物非倒即斜中土虛衰下逆之光上薄於顛頂土虛之發其眩僕也不能起必噁心嘔吐而五心煩熱此則似乎不關於肝膽兩經不知其始也各有所因其終也不能不由其所從歷之途而見端於極也則仍謂之悉屬於木可也此與吞酸兩症四明分晰詳盡而俱不立方治須參丹溪損庵立齋景岳諸法治之咳嗽咳嗽之病形何如曰咳嗽之病盡屬肺經然有本經之咳嗽有各臟腑遷移之咳嗽本經之嗽皮毛受之玄府閉矣此外感也玄府既閉則肺氣不舒其在中之二十四竅所以列行分布諸臟之氣者亦不能行於是肺滿而逆戛戛然咳嗽矣此肺實也肺虛者由脾土不能生化津液不得上布則肺失所養而陰虛陰虛則肺熱肺熱則上焰火煽其竅時為噏張亦多嗽矣此肺虛也獨有心火刑金與水中之火直奔西極而消鑠煎熬則肺便危矣緣肺為華蓋以覆諸臟其二十四空竅虛如蜂窠下垂無透竅吸之則滿呼之則虛最喜清涼不耐煩熱今心肝脾腎四臟之火熱上炎則隨所吸之氣而入於竅中肺不受熱則戛戛然而嗽甚至肺葉乾枯形如經霜荷葉委頓零落而不能振舉水精亦不能四布五經亦不能並行而成肺敗之症總緣肺之空竅中只受得臟腑中固有元氣以運乎一身受不得一分邪氣耳咳嗽一症雖有各臟遷移其實不離肺金主治其大旨亦不逾實則清之虛則補之二法但清之補之之中又有不同因引長洲諸法於後法之下惟用者參之初起者金沸草散以散之年壯力盛即久亦可用如每月一二發弱症之漸也六君子湯以補土生金六味丸以滋水生木此攻補二法也長洲云嗽而鼻塞聲重風邪傷肺也用參蘇飲面赤咳嗽火克肺也人參平肺散寒熱交作肝氣不和也四君子湯加知母柴胡桔梗咳喘短氣肺虛也人參補肺湯體倦少食脾虛也參朮補脾湯口乾咽燥虛火上炎也六味飲凡發熱喘嗽或咳唾膿血飲食不入急補脾肺滋腎水多有得生者又云午前嗽屬胃火盛竹葉石膏湯胃氣虛補中益氣湯加炒山梔午後嗽屬陰血虛四物湯加酒拌炒黑黃柏知母腎水虛用六味丸黃昏嗽用四物湯加麥冬五味並六味丸五更嗽用六君子湯不得眠及兩脅下痛用六味飲補中益氣湯如咸哮醋哮勝金丸主之醋哮甘膽丸亦妙如年高筋骨作痛氣喘有痰腰痛用熟地山藥當歸白芍杜仲枸杞黃耆棗仁麥冬五味甘草喘盛去黃耆有一種氣短似喘呼吸促急提不能升咽不能降氣道噎塞勢劇垂危者人但知為氣急其病在上而不知元海無根虧因肝腎此子午不交氣脫症也凡婦人血海常虧者最多此症宜急用熟地二兩當歸一兩甘草五錢以濟之緩之堪云神劑如兼嘔惡加生薑氣虛加人參肝腎陰虛加肉桂凡診此症脈必微細無神若微而兼緊尤為可畏倘庸技不知妄云痰逆氣滯用牛黃蘇合及青皮枳殼破氣等劑則速其危矣如年高痰喘氣不歸原者生脈散加熟地山藥當歸枸杞牛膝菟絲等治之凡因痰而嗽者痰為重主治在脾因咳而動痰者咳為重主治在肺一切食積痰積上升而致咳者只治其痰消其食其咳自止不必用涼藥肺藥潔古云治咳嗽以化痰為先化痰以導氣為主四明云導氣不如先治火實者瀉白加芩桔虛者六味合生脈胃虛者竟以四君加歸芍合生脈無不應手金沸草散金沸草前胡麻黃荊芥穗黃芩甘草薑棗引勝金丸三稜莪朮良薑陳皮人參黃連上神麯和丸梧子大每服七十丸空心白滾湯下怔忡怔忡心血少也其原起於腎水不足不能上升以致心火不能下降大劑歸脾湯去木香加麥冬五味枸杞吞都氣丸治怔忡大法無逾此旨矣如怔忡而實挾包絡一種有餘之火兼痰者則加生地黃連川貝之類以清之予治後窯簡長鱗之弟先用歸脾都氣三十餘劑後加生地連貝一清即愈血症絳雪丹書一卷論詳而法備的是血症準繩須細體之吐血世皆知火症便以寒涼溫潤之劑投之土死金衰木勢轉熾病反劇矣除是瘀血抑蓄折士而奔注與傷寒變熱追竅而出者余俱當以大劑參耆回其氣氣回則血循經絡矣待稍定即以重料六味左歸等飲於水中養木亦須加人參使氣自陰生也天地之理陽統乎陰血隨乎氣故治血必先理氣血脫必先益氣蓋有形之血不能速生無形之氣所當急固無形自能生有形也特不可施於傷寒與蓄血者耳瘀血而吐必先胸痛血色必紫或黑而成塊脈必澀滯四物湯加大黃須醋製桃仁丹皮香附以行之後用六君子湯加當歸以調之紫黑盡血鮮紅者見即當用此傷寒必驟湧出然傷寒大抵從鼻來者多來而即住者不藥可望愈一來不止者不治此即紅汗是也紅汗至而熱解衄是妙事如衄而不解病轉深矣衄而不止病愈危矣其餘俱屬七情飢飽勞力等因必見噁心驗症分明一味固元湯主之倪漱山曰七情內傷脾胃先病固元之後即繼補中益氣歸脾等飲寒涼斷不可用若治以童便秋石等工之粗而庸甚者也有一種陰虛於下格陽於上則真陽失守血隨而溢以致大吐大衄六脈細脫手足厥冷危在頃刻而血不能止者速宜用附子肉桂牛膝澤瀉熟地甘草以鎮其陰使孤陽有歸則血自安也如嘔惡加炒黑乾薑脈微氣脫加人參如格陽喉痹上熱者當以前湯冷服此症甚多不可不知固元湯人參黃耆蜜炙歸身甘草煨姜大棗白芍酒浸洗炒四物湯川芎當歸白芍熟地上方加肉桂名五物煎加大黃名清熱涼血飲加柴胡丹皮山梔名加味四物湯弱症陰虛為勞即今所謂怯弱症也雖有五臟之別然皆起於心脾脈必數而有浮大細小之分浮大而數陰虛甚也細小而數陰中之陽絕矣此等症必見咳嗽或吐紅或遺精或女子不月或諸般勞傷而起要當治之於始婦人產後最易成此症慎之慎之治法只一歸脾湯加麥冬五味白芍去木香吞六味丸此外別無治法有一種鬱而起者即以前方雖味外再加丹皮山梔曾經庸醫用寒涼者不可復服又有一種陽虛者脈不數但緩而大不收奄奄無力夜臥不安夢中常見神鬼不吉醒來胸中戰跳或下見遺精口中無味飲食不思略食即飽此皆命門虛損心火衰息以致脾土不運生氣不旺大劑養榮湯加附子吞八味丸又有兩尺脈微弱而陰陽俱虛者宜十補丸此皆滋其化源也治弱之法指不勝屈然皆不得其要必如此乃為不易之則耳試於陰陽兩症剖別分明遵此守服必無不效切勿誤用寒涼敗胃之劑促人壽限也有蹈前弊者庶幾改之消症三消之病形何如曰消之為病一原於心火熾炎火甚於上為膈膜之消甚於中為腸胃之消甚於下為膏液之消甚於外為肌肉之消上甚不已則消及肺中甚不已則消及脾下甚不已則消及肝腎外甚不已則消及筋骨四臟皆消甚則其心始自焚而死矣然其病之始皆由不節嗜欲不慎喜怒膏粱爆炙酒酪湩乳濕熱之氣浸淫燔灼郁成燥熱氣不宣平故其傳變之形為飲水多而小便多曰消渴胃中津液乾枯不能上榮舌本也為善飢多食而渴小便數而消瘦曰消中胃中熱極所食之物隨火而化也為渴而飲水不絕腿消瘦而小便有脂液曰腎消是燥熱並及於胃底大小腸故脂液凝濁清陽與濁陰不能分疏也三消之中上中可治下消最難治然飲一溲未二猶可治飲一溲二不可治矣又三消久而小便不臭反作甘氣在溺桶中湧沸其病為重更有浮在溺面如豬脂油濺在桶邊如桕燭淚此精不禁而真元竭矣然何以甘氣為重大抵水在天地與人身皆有甘有咸甘為生氣而咸為死氣小便本咸而反甘是生氣泄也是脾氣下陷入於腎也土剋水故死也有一種渴而惡甘但飲茶為快者屬腎消趙邯鄲云治消之法無分上中下先治腎為急惟以六味八味及加減八味降其心火滋其腎水則消自止然三消俱宜戒厚味酒面房勞不守禁忌雖藥無功重生者其知之霍亂有濕霍亂腹痛而上吐下瀉者是也藿香散主之有乾霍亂者俗名斑痧又名攪腸痧吐瀉不見面色青冷腹中絞痛乃陰陽錯亂最惡之候而最易治急刺委中部分出血明礬末調飲探吐或用陰陽鹽湯或用菜油探吐兼用碗刮背上用苧麻根蘸清菜油刮奪命穴督脈後頂天庭等處後服砂仁細末數口連噯數十聲即愈如遍身有斑者用油紙捻火焠之以響為度或用蕎麥湯飲之即愈然其要在急刺委中出血則不死即十指頭出血亦是良法按委中穴乃兩膝內彎正中處緊對膝蓋伸足取之藿香散藿香蒼朮厚朴陳皮半夏茯苓胃脘痛胃脘痛之病形何如曰胃脘痛即俗所謂心痛也心不可痛痛則立死以心在胃脘之前故誤指胃痛為心痛也胃痛有食痰死血氣寒火中氣虛之別方書載列甚明無甚深微獨有一種肝膽之火移入於胃而熱又肝藏血血少則肝葉硬不肯下垂將葉抵胃胃受肝抵得食則滿愈與肝相逼殷殷而痛者久之變成燥症而為膈症矣此一種當入膈症中同看又有一種胃中作酸不覺其為酸每進飲食不敢多用多則竟日悶懣直待食過方得稍舒此痛是胃中一味酸熱也若得噯一口氣亦覺少舒然最難得者噯也若噯得重此自下轉上必有一口食氣或水或挾物是酸者其下最難得泄氣並且便硬此皆少陽厥陰二臟之氣所為也久之亦防其變為痞膈中滿等症此種可併入吞酸症中看又有一種胃脘痛是陰虛症將成須認明白二陽之病發心脾此類可通食痛者胸膈按之痛甚勺水不入兼大便閉聞穀氣則欲吐以下驗症甚妙用二陳湯或平胃散加桔梗枳實主之此即長洲所謂飲食停滯消導之也痰痛者亦不思食口即欲食而不能食大便不閉二陳湯加枳殼黃芩海石主之食痛者消其食則痛自止痰痛者治其痰則痛自定法固如是然前法設有不應即當察其脾胃何如仍參診法中痰食兩條本法治之血痛者胸膈刺痛脈必濡澀食可進四物湯加大黃桃仁紅花主之亦有宜用理中湯加肉桂桃仁紅花者須因症施之蟲痛者亦不食然痛必時發時止痛則牽引手臂或肩背上俱如穿透不可當必唇紅面上有白點是也痛時不欲食痛才止即可食實者化蟲丸主之虛者六味丸加胡黃連川楝子青黛蘆薈隨症加減治之凡蟲皆風木所化但瀉厥陰則蟲自除六味地黃丸為妙胡連蘆薈青黛等甚非虛症所宜須慎用謙按蟲痛虛者良由土敗木乘六味湯治脾胃陰虛則可設脾胃陽虛恐非所宜蓋蟲乃風木所化物必先腐然後蟲生當崇生氣為主則用理中湯去甘草少加川椒送烏梅安胃丸往往神效也胃脘虛痛者得食即止以手按之必稍緩食多又痛食過又痛理中湯主之此即中氣虛痛也肝虛燥痛者亦不思食交陰分外按之不熱病人自言熱口渴大便必燥結逍遙散加生地丹皮山梔甚者疏肝益腎湯加當歸主之氣寒火三症四明不列症治然驗症則準繩為詳治法則薛案較妥須並參之二陳湯陳皮半夏茯苓甘草平胃散厚朴蒼朮陳皮甘草化蟲丸蕪荑雷丸胡連蘆薈使君三稜莪朮胎前凡受孕二三月必嘔吐噁心此月水不通陽明壅盛故不安食但此是始膏始凝始衃之時驟然壅盛故耳迨四五月則血漸蔭胎兒形體成便具五行生剋循環之理則血有所歸而不壅盛矣或曰血壅盛何獨於胃有病曰胃為多氣多血之海五臟之母也女子應有是生應有是化今不行而成孕驟然不化陽明氣血俱盛遂有是上僭之勢久之自平不足慮也然有微甚微者飲食調理甚者六君子湯加砂仁生薑以和之或曰半夏損胎可信乎曰獨食半夏一味雖非胎亦能損人若與參朮同用但著開胃健脾之功耳正所謂當論方不當論藥當就方以論藥不當執藥以論方也論藥只好就一味單方而論耳曰思食何為曰胃氣盛則思食血壅則氣逆氣逆則食入反出也或女子性氣褊急者於六君子湯中佐黃芩以清火消息用之調治胎前嘔吐不出此方主之如原有胃脘痛而此時夾發加丹皮山梔如發熱不必加退熱藥只以此方調之胎前下血名曰漏胎氣不攝血也多服補中益氣湯其惱怒傷肝肝木賊土血不能藏而成漏者加味逍遙散加生地此症有風熱血熱血虛脾火及脾胃虛弱虛陷之別當隨症施治其年壯人六脈平和飲食如故無所苦而經時下是氣血旺養胎之餘血也然亦不可使之多去須和血涼血健脾為主胎動不安血不養胎也四物湯去川芎即用亦不過五分加白朮杜仲有肝旺而動者必痛無定處歸芍生地加黃芩白朮甘草如氣虛者必怠惰嗜臥脈必豁大而緩補中益氣湯加酒炒白芍此症須合邯鄲遺稿辨別參治其法乃全墮胎即俗所謂小產也總屬氣虛血虛及縱欲嗜酒而來醫家動云熱則流動胎火逼迫不知氣血調和胎火何由而生豈胎不屬母身別有一動耶寒涼雜投利氣行血卒至墮胎豈非醫害之耶既墮之後猶不禁忌前以是月墮後復期而來矣不伸救補止作火治以致三胎四胎逢期必墮烏能有濟予每於未墮之前大料黃耆丸預補之將墮之際大料補中益氣湯加酒炒白芍勿論其脈勿論其時一概峻補中宮母氣萬無一失即先賢有一經配一月以補其經者亦皆昧於陰陽之理不足信也此症由兩腎虧損者尤多子腫子懸子嗽子瀉小便不通俱當用補中益氣湯有胎火盛而致此數種病者用四物湯去川芎加黃芩白朮茯苓甘草以和之獨子瀉挾火宜四君子湯加黃芩砂仁胎前傷寒瘧痢悉以固胎為主傷寒依平時傷寒治自不損胎但當倍用歸芍或當用參須平時預先料理獨前胡湯與半夏白芷不可用若小柴胡有人參半夏亦不妨矣瘧疾亦與平時不甚異但清中驅瘧飲去蒼楂枳實余俱如法大抵黃芩為胎前瘧中要藥總當視病人之盛衰而消息之或問白朮黃芩安胎之聖藥也二味胎前必不可缺乎趙氏曰未必皆然也胎莖之繫於脾猶鍾之繫於梁也若棟柱不固棟梁必橈所以安胎先固兩腎使腎中和暖始脾有生氣何必定以白朮黃芩為安胎之藥也腹中有熱胎不安固用涼藥腹中有寒胎不安必用溫藥此常法也殊不知兩腎之中具有水火系衝任之根胎元之所繫甚要非白朮黃芩之可安也如腎中無水胎不安者用六味地黃湯壯水腎中無火用八味地黃湯壯火故當以杜仲川斷阿膠艾葉當歸五味等藥出入於六味八味湯中為捷徑總之一以貫之也此論為諸書所未及今特表而出之產後臨盆之時專賴氣血旺足然後能生此時惟有多服參耆歸桂甘溫重補兒信一下頻頻服之自無橫生逆產胎衣不下之病矣有不耐藥氣者獨參湯妙服法於未下產時用芎歸參耆濃煎飲之自然緊痛易產矣兒下後即用前藥加肉桂一錢煎服自無血塊痛之病矣產後血暈用醋炭熏鼻法好老酒和童便服不可放倒產後敗血不盡血迷血暈腹中胎衣不下至死心頭暖者急用花蕊石散一服化水即出其效如神不可不知如氣血脫而暈者必唇口手足厥冷無脈此時間不容髮當以大劑參附回其陽如認作血暈而以前法治之則斃矣產後發熱乃氣血大虧也亦有食物太早氣弱不能運而生熱者必兼噁心飽悶治宜健運為主又有乳結不通作熱者宜通乳即有見識者亦必曰發散固不可且以輕劑疏通之此一句害人不淺總之脈必浮數與外感無辨外感而發熱者必兼頭痛拘急等症脈必浮數有力補中益氣加芎蘇熱服補以散之切忌妄汗一時不敢驟補也殊不知產後發熱吾不管其是邪非邪有脈無脈一味八珍十全峻補之有邪自然汗解無邪自然竟退矣如此膽氣庸工那得到此然膽由於識彼只緣見不透耳見得透定幹得來矣有識自有膽矣如瘀血發熱者腹必痛口必微渴四物湯加桃仁紅花丹皮足矣然俟腹痛口微渴一退即以八珍湯與之血塊痛不發熱者四物湯加桃仁牛膝青皮丹皮服二三劑自除除後以八珍湯與之凡婦人血虛阻滯不能流暢而痛極者當以水濟水若江河一決而積垢皆去宜用熟地當歸牛膝澤瀉肉桂烏藥隨症加減治之如嘔惡加炒黑乾薑陰滯加附子大便乾燥加楂肉甚加蓯蓉下焦痛極加吳茱萸氣滯者加香附陳皮血滯者加紅花如氣虛者宜少用香附陳皮之類甚者不用亦可此係景岳決津煎乃以補為瀉之神劑也產後泄瀉切不可利水產後泄瀉責在脾虛若再加利水則脾腎皆虛故不可也如有此等症只一味補中益氣湯加白芍酒洗炒為妙如發熱而渴乃陰竭也六味丸另煎六君子湯或人參湯下之瀉多則亡陰故症兼發熱作渴也然因瀉而熱而渴則原是由脾傳腎故須仍用六君參湯下六味丸此亦標本兼治之義產後不便有至二十餘日者不足為病然產婦急於便必多努責往往成玉門不閉子宮下墜之病治之貴早一味用八珍湯加桃仁杏仁各二錢多則三劑自下產後氣血未有不虛者即此症亦屬氣虛不能推送血虛不能濡潤之故八珍湯乃治氣血兩虛之的劑也然用於此症則其妙處卻在加桃仁杏仁兩味蓋人第知桃仁能破血而不知桃仁又能利血而滑腸人第知杏仁能潤肺而不知杏仁兼能潤腸而利便故單用八珍以養氣補陰燥矢亦未始不下然產婦既急於便而不加此二味以使之速下則恐仍多努責之勞也前輩立法必准理揆情如此子宮下墜乃勞力所傷也補中益氣湯加白芍倍用參耆白朮如下墜而痛大劑歸脾湯加白芍如因惱下墜而痛此驟動肝火所致歸脾湯加丹皮山梔然當治之於早如子宮乾枯不能升矣玉門不閉治同產後感風率多成痙者氣血虛故也剛痙由血虛無汗為剛痙四物湯倍歸地加軟柴胡鉤藤鉤柔痙由氣虛有汗為柔痙補中益氣湯加軟柴胡鉤藤鉤如主去風燥血之劑則筋攣而成痙矣雙林許炳如侄婦產後三日忽喑啞不語手足痙搐延予視之曰此怒動肝火而血燥也用加味逍遙散加熟地鉤藤一劑而痙搐全愈三劑而口酸身熱腰痛脅痛諸症悉除惟語言尚不能出予於前方中又加菖蒲錢許一劑睡至半夜言語如常產後咳嗽弱症之漸也六味飲加人參主之如兼發熱歸脾湯去木香加白芍麥冬五味吞六味丸然須於初起時即用此藥或有可救者如經發散用過涼藥不效帶下帶下是脾土虧損不能攝水也六君子湯加炮姜以實之甚者補中益氣湯加白芍半夏久服自除如脾土濕熱下流者六君子湯加柴胡黃芩丹皮白芍如惱怒傷肝者加味逍遙散加人參虧損者起於勞力面色痿黃不思飲食脈必大而無力且遲腰痠濕熱者起於飲食不節或多嗜酒帶色必兼黃濁而濃脈必大而有力兼見腰痠惱怒者以前諸症俱無但見面色常帶紅胸中覺悶熱脈必弦數而有力淋症淋症婦女俱屬肝經濕火或小腸移熱一味逍遙散加味如屬小腸移熱者合導赤散尤捷若見發熱便屬陰虛疏肝益腎湯胎產淋帶諸症須看薛長洲訂婦人良方近見邯鄲遺稿中亦有精論宜參之痘瘡發熱時先看有痘情然後用藥何謂痘情必先見耳冷尻冷腳冷眼如含水懶於言笑是也斯時投以加味葛根湯服至見點升麻葛根前胡桔梗山楂青皮木通荊芥撫芎燈心甘草三日後用紅花湯紅花蟬蛻前胡桔梗山楂木通荊芥撫芎升麻燈心甘草如服加味葛根湯後而不見點是毒盛也其症必重若熱甚氣悶譫語腰無力冬月即於葛根湯加麻黃一錢夏月加石膏一錢甚者加至二錢如冬月熱甚過四五日重症已見而舌灰白色者亦須以石膏合麻黃用之夏月蘇葉薄荷俱可進退用之如見點如糠粞齊布熱甚口臭此脾經痘也死不治矣如見點三日痘已齊而熱不退此是毒盛危候見矣須以涼藥涼血紅花湯去升麻撫芎山楂加生地丹皮與之然此是乾紅候百不一活五六日已過痘腳已齊漿勢欲行矣服桔梗湯桔梗前胡紅花荊芥蟬蛻殭蠶大力燈心通草又三日發熱起頂濃漿至矣當和其毒丹皮丹參花粉連翹荊芥木通殭蠶其有變白色而發癢者氣血虧也五味異功散加白芍以救其元氣虛甚者加人參白朮五六錢大劑用之自然有救或泥於庸醫發未盡而禁補或反咎發表欠透以致今日內陷者此殺人之論不可信也信手大補下一二劑必然窠下漿來生氣勃然矣即有撏掐破者亦自循皮爛臭而回生有一種變黑者乃毒盛變黑歸腎火盛水反制之從其化也非真有毒能歸腎經也要在放點時必然部位不妙或根窠腳地有不如式醫者須先決到某日變黑歸腎而死又有一種灰白色者亦毒盛也然不癢須以當歸黃連湯與之當歸黃連生地銀花花粉大力荊芥殭蠶丹皮燈草自行起發至頂已起矣至第六日當有回意用保元湯人參黃耆甘草至七八日竟用加味異功散加白朮人參黃耆白芍茯苓陳皮甘草煨姜大棗如漿有不起頂不充滿而發癢窠殼脫落如梅花片下發瀉者虛甚也五味異功散加黃耆木香甚者附子肉桂吳茱萸俱當用見點至回十二日矣斯時惟恐摧折之餘虛寒必甚醫者須謹慎將養之切莫以為結痂在邇不足慮也一味加味異功散直服至脫痂而色紅方以飲食補之初起時發熱一二日便抽搐驚叫不省人事眼直或閃爍無定或舞唇弄舌魚口角弓等症此是心經痘也不必慌忙但用加味葛根湯當此之時痘已隱隱在皮膚間矣細看自然吉順凡心經痘決稀自起至收只要順序調理決無變症肺經痘見點熱久或少見咳嗽點數不多不過百餘粒吉多凶少竟可不藥不過發熱時用幾劑表藥而已肝經痘吉凶相半然要論歲氣有歲氣合者其痘必吉居八九凶者或有一二吉者發熱見點起漿結痂按日而來其有傳變者皆屬肝經古云肝經多變是也肝經痘不大不小顆數調勻脾經痘最惡發熱時必如火烙放點時必如芝麻五六日定胃爛口臭五六日內芝麻點內忽然發癍九日必死矣腎經痘發熱時昏沉壯熱四五日尚不見點忽然於腰下發癍十二日必死矣初放點必要在兩頰間鼻上然後看太陽部位俱有便是吉痘歌曰繞唇帶頰方為吉額角眉心總是凶有面部未見而額下一片簇簇而來凶痘也不治有面部不見而胸脯簇簇一片及背上簇簇一扌畣先見俱不祥面部一見四肢必朗朗而來總之順不嫌多逆怕一點即彌月小兒緊密亦何妨但要調護得法而已樹小花多此俗論也如兒小甚不能服藥不可強與乳母服藥以過其氣可也此論道理如是若論小兒初生不過一點精血凝聚耳初無飲食之毒寒暑風露之感根於天者吉勿藥可也但得乳母謹慎切戒油膩爆炙辛辣酒醋等物勿犯汙穢不潔之氣足矣時取茵陳燒之懸酒噴胡荽於床間以發其氣兒自安穩也如以數日內之嬰兒亦如童子按方投藥痘雖吉而凶矣何也以其臟腑脆薄未得水穀之氣也如根於天者凶即藥亦何效哉痘初發時要他瀉瀉一通則痘起發幾分何也毒傳腑也是里傳表也點一有即禁瀉如不止而痘色漸白面色晃晃而白急以六君子湯加煨姜救之不可泥於毒未盡而猶多畏忌也如果毒盛而瀉則嬰兒必捏扤不安口渴唇紅面色壅盛氣粗如點不齊不可用寒涼只發表足矣如齊而猶瀉雖黃連亦所必用即於葛根湯加黃連七分可也肚痛一症最惡候也未見點而痛葛根湯加麻黃亦可有痛而身彎不能立者腎敗矣不治見點肚痛亦須發之痘色不變者可治起頂發漿時而痛是虛五味異功散加白芍寒戰咬牙初起者毒盛也然咬牙者多而寒戰者少起漿之後寒戰咬牙者悉屬虛黃耆白朮散甚者加煨薑桂附痧症痧症即疹子又名瘄子準繩云痧症初起用升麻葛根湯散足陽明邪熱合瀉白散清手太陰邪熱其間宜加桔梗牛蒡荊芥連翹等兼解兩經之毒也尤為至當次日標形顴鼻見點多者最吉以其清陽喜上升也第二日葛根可去惡其開肌腠而干津液也若熱甚勢重前湯加白虎芩粉之類斷不可少若服藥後而熱愈甚者正毒達之故也得大汗而毒自解矣若略見標而不見形者此為痧毒不透後必防疳宜從養陰治甘露飲主之必多服乃效亦從汗解乃屢驗者有一等小兒乳疳一日可解不必盡三朝九朝之說以清火為主兼解可也緣小兒稟質尚弱神氣有限如過粗工不審虛實發散過多必致正氣虛脫而不可救者多矣有痧毒痰喘甚者雖用石膏黃連如水淋石要知是痧毒痰火壅結上焦之故宜用栝蔞霜枳殼花粉金沸草等清痰清火如挾氣虛者加人參立應如痰上壅盛者可用牛黃珍珠散痧症腹痛者乃毒鬱於陽明故也宜服升麻石膏黃連之類如惡毒鬱於大腸者苦梗開之痧症多泄瀉慎勿止澀惟用升麻葛根黃連甘草則瀉自止痧家不忌泄瀉瀉則陽明之邪熱得解是亦表裡分消之義也痧後泄瀉及便膿血皆由熱邪內陷故也大忌止澀惟宜升散仍用升麻葛根湯加黃連扁豆若便膿血則加滑石未必愈痧症不宜依症施治惟當治本本者手太陰足陽明兩經之邪熱也解其邪熱則諸症自退矣痘疹兩症當參文中陳氏仲陽錢氏立齋薛氏羅田萬氏晨峰程氏東皋徐氏改齋友氏景岳張氏近日建中費氏亦有宣發皆宜詳究不可偏守一見以誤世升麻葛根湯升麻葛根白芍甘草吐瀉吐瀉除是明知停食受寒方可消導如枳朮二陳平胃之類其餘吐瀉乃肝木乘土而來急以七味白朮散安之萬不失一暑月尤宜補正吐加半夏七分薑汁製瀉加白芍一錢酒洗炒七味白朮散白朮人參茯苓藿香木香乾葛甘草煨姜引驚症驚病無論輕重一味用五味異功散加軟柴胡鉤藤鉤即為外物所驚亦是木氣虛而受切勿投抱龍鎮驚等丸有小兒感症初起脈細數日久不愈則目竄手搐症已敗矣正寓意草所謂傷寒非驚風也今人動作驚治往往致殆不知此症與大人傷寒敗症同緣稟賦陰虧故脈如此細數當從六味左歸治然亦危矣疳症疳病無論五疳虛實一味五味異功散加黃連木香萬不失一若頭大肚大筋青四肢獨細即黃連木香亦不可用一味參苓白朮散主之如疳而有蟲五味異功散加蝦蟆川連大便必似水而焦赤無渣是也甚至經月累年每用五味異功散一料加蝦蟆一枚酒炙川連五錢薑汁拌炒吐瀉驚疳諸症須主薛長洲訂保嬰全書此則未免要而未備耳五味異功散陳皮人參白朮茯苓甘草參苓白朮散人參茯苓白朮米仁山藥扁豆芡實砂仁桔梗川連甘草一方有葛根癇症癇症種類雖多然其源總屬手厥陰心包絡火病也大概宜以清心散主之但要久服則有效耳此症丹溪斷為痰火的是千古灼見清心散青黛殭蠶生地木通黃連辰砂琥珀另研白芍赤芍四明治驗方予每用此及後東莊方治癇輒驗故附存之當歸生地丹皮青黛黃連羚羊角陳皮半夏南星上為末作丸辰砂為衣空心白滾湯下曾治二人甚效東莊治驗方桃仁一兩去油研如霜硃砂五錢川連一兩礞石稍煅金色為度錢半蘆薈五錢沉香錢半寒水石生黃芩大黃以上二兩上用薑汁一茶杯將大黃切片浸透於炭火上焙乾再浸再焙以收盡薑汁為度各研成末水法為丸淡薑湯臨臥時每服二錢
