body:
  text: 卷二四明心法中方論即名高氏遺書東莊已述之醫貫批中但此詳於彼故從謝達宸本抄附歸脾湯治脾經失血少寐發熱盜汗或思慮傷脾不能攝血以致妄行或健忘怔忡驚悸不寐或心脾傷痛嗜臥少食或憂思傷脾血虛發熱或肢體作痛大便不調或女子經候不準晡熱內熱或瘰癧流注不能消散潰斂歸身炙遠志炒研棗仁茯神人參炙黃耆土炒白朮龍眼煨甘草炙木香嘔血歸脾全在此味薑棗引此方乃嚴用和所造其對症則二陽之病發心脾也蓋欲補脾則先補心欲補心則先補肝所謂隔二之治趙氏論之詳矣然往往用之於吐血咳嗽寒熱木香多不合以其香燥反能動肝火而燥津液豫每去之而加白芍以追已散之真陰頗稱穩當且肺受火刑白朮太燥恐反助嗽得芍藥之陰以為佐亦是妙於配合如肺腎受傷再加麥冬五味肝腎受傷則芍藥更為有益如從拂鬱而起則加柴胡丹皮山梔如非二陽之病至怔忡則去木香加枸杞麥冬五味之屬如夢遺則加五味熟地白芍牡蠣之屬如怔忡而實挾包絡一種有餘之火兼痰者則加黃連生地貝母之類以清之夢遺而挾相火者加黃柏知母麥冬以清之惟脾虛久瀉而不止者方留木香以醒脾脾虛而挾寒者雖肉果桂附等類皆可加也陽虛盜汗脈四至以內奄奄不起惺惺不寐此方亦是對症要藥亦可變為養榮加減甘露飲治大人小兒胸中客熱牙宣口臭齒齦腫爛時出膿血目瞼垂重常欲合閉或即飢煩不欲飲食及目赤腫痛不任涼藥口舌生瘡咽喉腫痛瘡疹已發皆可服之又治脾胃受濕瘀熱在裡或醉飽房勞濕熱相搏致生疸病身目皆黃肢體微腫胸滿氣短大便不調小便黃澀或時身熱並皆治之生地熟地天冬麥冬黃芩石斛枳殼茵陳枇杷葉甘草小甘露飲治脾勞實熱身體面目悉黃舌乾咽喉腫痛山梔黃芩生地升麻桔梗茵陳石斛甘草此方創自潔古老人丹溪以為此心肺胃三經藥也主治胸中客熱口臭齒爛心煩咽瘡等症許學士又去門冬加犀角主治與上略同別如赤眼並一切瘡瘍已散未散皆可治之然小甘露去熟地二冬者以手陽明與腎無相關之勢故加桔梗使與里合治胃則以腎為關故加熟地二冬也按此方以固本丸為症而加入他藥原因胃中濕熱下流歸坎則水源濁泛故見症如此而當日立方之意實從救腎起見清胃者自清胃而救原者仍救原丹溪止言心肺胃猶未是全論豫每於肝經有鬱火者亦以此方加丹皮山梔去石斛甘草枇杷葉亦無不應驗則知水木同原之義若原有胃火而又挾肝木之勢者竟以原方不減而但加丹皮山梔等味亦無不效也丹溪言肺最妙然必須列症中雲大便乾燥才合手足陽明兩經之藥耳至一變而為小甘露去枇杷葉熟地二冬枳殼而加升麻桔梗梔子則手陽明實症通治之義全見矣火盛渴甚者加知母走馬疳而急者加石膏黃連火蝕既久元氣虛者加人參真胃中燥火之神劑也清脾飲治疸瘧脈弦數但熱不寒或熱多寒少膈滿不食口苦舌乾煩渴小便黃赤大便不利青皮厚朴草果柴胡黃芩半夏茯苓白朮甘草姜引此嚴用和所造治瘧方也治瘧多方俱不得要惟此方為中正豫每用此加減無不愈者蓋瘧發寒熱原屬少陽半表半裡故必以小柴胡為君青皮以解脈之弦數厚朴以寬胃中之積滯草果以化痰消壅苓朮以實脾土此二味乃補正之義緣瘧固由外感然必內傷而後外始感焉此東垣之微旨也嚴氏立方最為的當但竟由飲食起者豫每以蒼朮易白朮加陳皮以合平胃之意熱多寒少者稍加黃連滑石寒多熱少者稍加前胡以發其鬱熱無不應手而驗能審此而消息之何至遷延久病困苦天下人哉若誤服湯藥病久者不可執此為不易之法是在學者神明之耳如服寒藥而致胃傷者須以人參養胃湯養之服熱藥多者仍以小柴胡湯多加黃連丹皮生地以解之久而虛者補中益氣以救之發於夜者四物湯益母草飲一名香紅飲以濟之用法雖殊然小柴胡之旨不可脫也六味地黃丸治腎經不足發熱作渴小便淋閉氣壅痰嗽頭目眩暈眼花耳聾咽燥舌痛齒牙不固腰腿痿軟自汗盜汗便血諸血失音水泛為痰血虛發熱等症其功不能盡述熟地山藥萸肉丹皮茯苓澤瀉張仲景立八味丸治漢元帝三陰瘧至宋時錢仲陽始去桂附變而為六味以治小兒蓋以小兒純陽無補陽之法倘或先天不足行遲腳軟陰虛發熱則用六味以補之此仲陽變法也乃薛氏則因此悟到大方亦當以此補陰而丹溪之補陰丸始廢然其方雖列於醫案中而未嘗發明其為救陰之的劑也至趙氏始大闡薛氏用此方之意而以為聖方神劑又不止治陰虛發熱之一法觸處旁通無不立應而學者始善於用六味矣然浙東惟四明醫家承受趙氏之學者多為善於用浙西惟張卿子亦稍用之沿及三吳不能解也即讀趙氏書者亦懵然不覺然趙氏加減之法甚嚴又非薛氏之意矣今録兩家加減之法於後並附愚意惟學者擇之薛氏治婦女鬱怒傷肝脾以致小便淋漓不利月經不調兩脅脹悶小腹作痛寒熱往來胸乳作痛左關弦洪右關弦數此鬱怒傷肝脾血虛氣滯為患則變為滋腎生肝飲熟地山藥萸肉丹皮茯苓澤瀉五味當歸柴胡白朮甘草原用六味雙對減半分兩而加柴胡白朮甘草當歸五味合逍遙而去白芍加五味者合都氣意也以生肝故去白芍而留白朮甘草以補脾補脾者生金以制木也以製為生天地自然之序也又一變而為滋陰腎氣丸治目神水寬大漸散或如霧露中行漸睹空中有黑花視物二體久則光不收及內障神水淡白色熟地山藥丹皮茯苓澤瀉生地歸尾柴胡上為丸辰砂為衣每服十丸白滾湯下獨去山萸肉而加柴胡生地歸尾五味仍合逍遙都氣肝腎同治然用歸尾生地者行瘀滯也柴胡者疏木氣也去白芍者恐妨於行之疏之也名滋陰者厥陰也皆用五味者雖合都氣然實防木之反克瀉丁之義也去萸肉者不欲強木也又一變而為人參補肺湯治腎水不足虛火上炎咳唾膿血發熱作渴小便不調熟地山藥萸肉丹皮茯苓人參麥冬五味當歸黃耆蜜炙白朮陳皮甘草蜜炙姜引其義愈變化無窮真游龍戲水之妙也去澤瀉而加參耆歸術麥冬五味陳皮甘草夫白朮之與六味其化相反焉得合之曰從合生脈來則有自然相通之義借茯苓以合五味異功之妙用歸耆以合養血之奇其不用澤瀉者蓋為發熱作渴小便不調則無再竭之理理無再竭便當急生生脈之所由來也既當生脈則異功可以轉入矣且水生高原氣化能出肺氣將敗故作渴不調此所以急去澤瀉而生金滋水復崇土以生金也薛氏苦心可不知哉又一變而為加味地黃丸又名抑陰地黃丸以治肝腎陰虛諸症或耳內癢痛出水或眼昏痰喘或熱渴便澀等症熟地山藥萸肉丹皮茯苓澤瀉柴胡生地五味加生地柴胡五味復等其分真愈出愈奇矣柴胡從逍遙來生地從固本來五味仍合都氣其曰耳內癢痛出水或眼昏痰喘或熱渴便澀而總以肝腎陰虛則知其陰虛半由火鬱而致也故用柴胡以疏之鬱火非生地不能涼故用生地用五味者仍瀉丁以補金補金以生水也曰抑陰為鬱火太盛非疏不可疏之所以抑之生地涼血便有瀉義瀉之所以抑之也又一變而為九味地黃丸以治腎疳熟地山藥萸肉丹皮川芎當歸赤茯苓川楝子使君子上丸空心溫酒下以赤茯苓換白茯苓而加川芎當歸川楝子使君子盡是直瀉厥陰之藥仍是肝腎同治之法緣諸疳必有蟲皆風木之所化是肝有可伏之理但伐其子必傷其母故用六味以補其母去澤瀉者腎不宜再泄也又一變而為益陰腎氣丸以治諸臟虧損發熱晡熱潮熱盜汗或寒熱往來五心煩熱或口乾作渴月經不調或筋骨酸倦飲食少思或頭目不清痰氣上壅咳嗽晡甚胸膈痞悶或小便赤數兩足熱痛或腳足痿軟肢體作痛等症此壯水之主以制陽光之劑也熟地自制杵膏山藥萸肉丹皮茯苓澤瀉五味當歸生地酒拌杵膏上為末入二膏加煉蜜丸桐子大硃砂為衣每服五十丸空心淡鹽湯下加五味子仍合都氣當歸生地二味則從四物湯來何也其列症有發熱晡熱潮熱肝血虧矣焉可再以柴胡疏之哉最妙在胸膈痞悶一句緣此症之悶是肝膽燥火閉伏胃中非當歸生地合用何以清胃中之火而生胃中之陰哉蓋一用柴胡便為逍遙入肝膽不能走胃陰矣一用柴胡一去柴胡流濕就燥之義判若天淵微乎微乎至趙氏則以為六味加減須嚴其善用六味雖是薛氏啓其悟端而以上變化概未透其根柢故盡廢而不敢用見其合當歸柴胡而去白芍則反用白芍名疏肝益腎此則其聰明也乃謂白朮與六味水土相反而禁用初謂其立論高簡立法嚴密後細參薛氏畢竟薛氏博大而趙氏拘淺薛氏諸變法似乎寬活而其實嚴密學者善悟其妙而以意通之大概以肝腎為主而旁救脾肺脾肺安頓則君相二火不必提起自然帖伏矣附東莊逍遙散論以加味逍遙散六味丸治郁自薛長洲始也然長洲之法實得之丹溪越鞠之芎藭即逍遙之歸芍也越鞠之蒼朮即逍遙之白朮也越鞠之神麯即逍遙之陳皮也越鞠之香附即逍遙之柴胡也越鞠之梔子即逍遙之加味也但越鞠峻而逍遙則和矣越鞠燥而逍遙則潤矣此則青出於藍後來居上亦從古作述之大凡如東垣之補中益氣比枳朮萬全無弊矣然豈可謂枳朮之謬而禁不用哉歸脾湯論歸脾湯乃宋嚴用和所創以治二陽之病發心脾者也原方止人參白朮黃耆茯神甘草木香圓眼肉棗仁薑棗薛新甫加遠志當歸於本方以治血虛又加丹皮梔子為加味以治血熱而陽生陰長之理乃備隨手變化通於各症無不神應曰歸脾者從肝補心從心補脾率所生所藏而從所統所謂隔二之治蓋是血藥非氣藥也後人見薛氏得力亦漫浪效用之而不解其說妄為加減盡失其義即有稍知者亦止謂治血從脾籠統燥健之說雜入溫中劫陰之藥而嚴薜一家之旨益晦四明高鼓峰熟於趙氏之論而獨悟其微謂木香一味本以噓血歸經然以其香燥反動肝火而干津液故其用每去木香而加芍藥以追已散之真陰且肺受火刑白朮燥烈恐助咳嗽得芍藥以為佐則太陰為養榮之用又配合黃耆建中龍性乃馴惟脾虛泄瀉者方留木香以醒脾脾虛挾寒者方加桂附以通真陰之陽而外此皆出入於心肝脾三經甘平清潤之藥濟生之法始無遺義古人復起不易其說矣補中益氣湯論東垣此方原為感症中有內傷一種故立此方以補傷寒書之所未及非補虛方也今感症家多不敢用而以為調理補虛服食之藥則謬矣調理補虛乃通其義而轉用者耳六味丸論此純陰重味潤下之方也純陰腎之氣重味腎之質潤下腎之性非此不能使水歸其壑其中只熟地一味為本羸之主然遇氣藥則運用於上遇血藥則流走於經不能制其一線入腎也故以五者佐之山藥陰金也坎中之艮堅凝生金故入手太陰能潤皮膚水發高原導水必自山山藥堅少腹之土真水之原也水土一氣鎮達臍下山茱萸陰木也肝腎同位乎下借其酸澀以斂泛溢水火升降必由金木為道路故與山藥為左右降下之主以制其旁軼二者不相離觀李朱拆用二味於他方可悟也丹皮本手足少陰之藥能降心火達於膀胱水火對居瀉南即益北而又有茯苓之淡泄以降陽澤瀉之咸泄以降陰疏瀹決排使無不就下入海之水此制方之微旨也仲景原方以此六者駕馭桂附以收固腎中之陽至宋錢仲陽治小兒行遲齒遲腳軟囟開陰虛發熱諸病皆屬腎虛而小兒稚陽純氣無補陽之法乃用此方去桂附用之應手神效開聾聵而濟夭枉明薛新甫因之悟大方陰虛火動用丹溪補陰法不驗者以此代之立應自此以來為補陰之神方矣趙氏得力於薛氏醫案而益闡其義觸處旁通外邪雜病無不貫攝而六味之用始盡矣八味丸用茯苓澤瀉論辛甘發散為陽酸苦湧泄為陰清陽出上竅濁陰走五臟制方之原也此方主治在化元取潤下之性補下治下制以急茯苓澤瀉之滲瀉正所以急之使直達於下也腎陰失守煬燎於上欲納之復歸於宅非借降泄之勢不能收攝寧靜故用茯苓之淡泄以降陰中之陽用澤瀉之咸瀉以降陰中之陰猶之補中益氣湯用柴胡以升陽中之陰用升麻以升陽中之陽也升降者天地之氣交知仲景之茯苓澤瀉即東垣之升麻柴胡則可與言立方之旨矣八味丸用附子肉桂論此方主用之味為桂附即坎卦之一陽畫也非此則不成坎矣附雖三焦命門之藥而辛熱純陽通行諸經走而不守桂為少陰之藥宣通血脈從下竄發二者皆難控制必得六者純陰厚味潤下之品以為之浚導而後能納之九淵而無震蕩之虞今人不明此義直以桂附為腎陽之定藥離法任意而雜用之酷烈中上爍涸三陰為禍非鮮也或曰仲景治少陰傷寒用附者十之五非專為保益腎陽耶然仲景為寒邪直中陰經非辛熱不能驅之使出附子為三焦命門辛熱之味故用以攻本經之寒邪意在通行不在補守故太陰之理中厥陰之烏梅以至太陽之乾薑芍藥桂枝甘草陽明之四逆無所不通未嘗專泥腎經也唯八味丸為少陰主方故亦名腎氣列於金匱不入傷寒論中正唯八味之附乃補腎也桂逢陽藥即為汗散逢血藥即為溫行逢泄藥即為滲利與腎更疏亦必八味丸之桂乃補腎也故曰當論方不當論藥當就方以論藥不當執藥以論方藥論即名學醫隨筆從董顯臣本抄附昆布本是綸布綸音關誤綸為昆故呼昆布東垣肥氣痞氣用之大抵千金有破積聚之語讀廣濟方有治膀胱結氣急宜下氣用昆布下調和製作菜食極能下氣然則昆布乃太陽正藥與繆氏云咸能軟堅其性潤下寒能治熱散結故主十二種水腫癭瘤聚結瘻瘡是又三陽並用者然五方獨於肥氣丸及加減痞氣丸用昆布其餘皆不用是又因其滑能破積血也廣朮即莪朮凡行氣破血消積散結皆用之屬足厥陰肝經氣分藥大破氣中之血氣血不足者服之為禍不淺好古言孫尚藥用治氣短不能接續經言短氣不足息者下之蓋此之謂也然中氣虛實天淵最宜詳審此短字乃是胃中為積所壅舒氣不長似不能接續非中氣虛短不能接續也若不足之短而用此寧不殺人又言其入氣藥能發諸香是又能入陽明也川烏辛溫大毒性輕疏溫脾去風寒用附子風用烏頭能隨諸藥為佐使功同附子而稍緩海藏云補命門不足肝氣虛巴豆一名剛子一名走陽子出巴蜀而形如豆故名辛溫有毒腸胃藥也東璧言氣熱味辛生猛熟緩能吐能下能止能行可升可降峻用則有戡亂劫病之功微用亦有撫綏調中之妙惟畏大黃黃連而前人治積方往往同用是即撫綏調中之謂與又為咽喉要藥取其辛能散結猛烈之氣能劫痰而開通道路也先大夫言大黃去積水蕩之也巴豆去積火燎之也非氣實者不可妄用用之須去心皮熬令黃黑搗膏入藥殼與油皆可用以治病新者佳皂莢即皂角維土西烏犀懸刀皆其名也辛鹹溫有小毒手太陰陽明經氣分藥海藏云入厥陰經氣分以其能利上竅通二便有疏泄之義也故又言搜肝風瀉肝氣然海藏本南陽正陽散內用皂角引入厥陰故有此說東璧言皂角屬金其味辛其性燥金勝木燥勝風故兼入足厥陰也按正陽散活人止言治陰毒傷寒云云列症不及囊縮即海藏引用厥陰例方云活人論厥陰藥並見陰症論並不以正陽治囊縮也再考活人囊縮問答條中又不及正陽散然則海藏舉正陽散為厥陰例何所見也海藏論厥陰煩滿囊縮只曰宜溫之下之亦不及正陽散至王損庵論囊縮論首載扁鵲孫真人次活人次海藏而序方則止正陽回陽二方確以正陽為治囊縮之的方矣亦不知何所見也豈因海藏以正陽屬厥陰而囊縮是厥陰中之一症便以之通治與又十八問陰症內列四方亦不及正陽獨二十問手足厥冷臍腹築冷一條為一見又言脈一息七至以來灸關元二三百壯兼服正陽散為二見活人本以囊縮為厥陰死症仲景原無治法故但言遂以意尋比方仿治而究不列方也於是來陽伯徐春沂輩亦不復有所更定參論而但屬之陰毒下耳海藏引屬厥陰大抵以陰毒者謂陰氣獨盛陽氣暴絶則為陰毒三陰皆有之但書列正陽所治有面青張口出氣心下硬身不熱只額上有汗煩渴不止舌黑多睡四肢俱冷等症是厥陰為多故列於厥陰門遂於湯液中有正陽散內用皂角引入厥陰之說也正陽散附子乾薑麝香皂角甘草
