body:
  text: 卷一四明心法上診法治病之要在臨症時先察內外臟腑經絡新久虛實食痰氣血才以脈合之脈經一書拳拳以診法示人而開卷便云觀色察形彼此參伍以決死生可見望聞問切診家不可忽一難經以切位四診之末則知望聞問之間其於病情之大段已得不過再診其脈看病應與不應耳乃近來迎醫服藥者不惟不先言其所苦甚至再三詢叩終於默默而隱疾以困醫者詎知醫而果可為人所困者則其病亦未有不為醫所困者也不亦愚昧之甚耶如症與脈合或正治或從治可也有症與脈不合者則當審其輕重辨其真假舍症從脈或舍脈從症以治之輕者從症十惟一二重者從脈十當八九景嶽從舍辨言之最詳復有症與時不合者舍症從時或舍時從症以治之此則從症者多於從時脈症時三者須時時互相參考診家大要謙按內經難經皆有色診之文孫真人亦有未診先問最不誤事之訓誠哉斯言四診不可缺一何謂內言七情也喜怒憂思悲恐驚是也七情之病起於臟七情過極必生拂鬱之病此拂鬱從內起拂鬱之脈大抵多弦澀凝滯其來也必不能緩其去也必不肯遲先有一種似數非數躁動之象細體認之是無焰之火也是無韻之音也是往來不圓滑也此為郁脈法當疏之發之鬱火脈極難看緣火不透發則經脈俱為所遏故多沉伏不出耳如火在下而以濕草蓋之則悶而不舒必至燒乾而自盡故疏之發之使火氣透則及此可以自存所以忌用寒涼必先升散之故得此一喻倍見省豁何也郁是氣抑抑則氣不透不透則熱熱則為火也古方疏發以越鞠丸為主嚴用和以逍遙散代之如單得郁脈上二方是也東莊云越鞠之芎藭即逍遙之歸芍也越鞠之蒼朮即逍遙之白朮也越鞠之神麯即逍遙之陳皮也越鞠之香附即逍遙之柴胡也越鞠之梔子即逍遙之加味也然越鞠峻而逍遙則和矣越鞠燥而逍遙則潤矣如鬱而血為火迫變成燥症如熱甚而痛及手足頭面似覺腫起或兩頜擁腫臂膊磊塊煩躁作渴四肢痙搐兩目直視角弓反張小便短赤大便祕結之類皆屬燥症其脈必浮數無序疏肝益腎湯從水生木可也熟地可加至一二兩左歸飲重加歸芍再加柴胡則與疏肝意更合或不清及加丹皮芩梔以清肝膽二經滋腎生肝飲有神效所謂肝腎並治也何謂外言六淫也風寒暑濕燥火是也雖是六淫並舉然下文只就風寒而言於暑濕燥火未概也須類推之六淫之邪或從皮毛而傳絡從絡傳經從經傳腑從腑傳臟是也感邪由表入里一層深一層其間次第此處分晰最清亦有竟感於絡竟感於經者六淫所感必生拂鬱之病此拂鬱從外入故必皮毛先閉外束其所感之邪而蒸蒸發熱也法當疏之發之是也大抵脈或浮或洪或大或緊而必數者也是燎原之火也是擊撞之聲也是往來不肯沉靜而出於皮膚之外也亦謂之郁脈是外郁也疏之發之不愈則霜雪以壓之古方麻黃桂枝白虎承氣等劑是也些真外感也易之以羌活沖和者亦真外感也近日醫家一見發熱無論內傷外感一味羌活沖和混行表散每致津枯液涸而成敗症者蓋羌防辛芷之屬原與麻桂並烈也用者審之有內傷似外感者此火不可發散也發散則亡陰不可霜雪以壓之壓之是滅火也以發散寒涼為長技者亟當以此等論藥之初起小柴胡湯加減調之可也逍遙散加生地合生脈加黃芩之類以滋腎生肝生金滋水可也重則六味飲加歸芍合生脈以滋水清火可也蓋非水無以救火也非有根之水無以救離根之火也補北方即所以瀉南方一定之理卻是不易之法何謂臟腑有從腑遷臟者有從臟遷腑者如陽明傷食則氣阻而脾不能化則其病遷於脾初起法當先消食食消則氣通而脾運矣久之則脾病亦深必先救脾何也腑尚可病臟不堪久病也腑主氣氣無形無形治之以無形易也臟主血血有形有形者亦須假無形以治之而後有形故難也傳曰無形之氣易補有形之血難償此之謂也消食者保和枳朮等類是也然不可過於消也經曰大積大聚皆可犯也衰其半而已如過於消則氣衰矣消之不得其法或不及則食積而生熱熱則脾病當用參朮如五味異功散六君子湯或加枳桔以開提健運再佐以芩連以消其積熱此條當併入後論食一條同看此臟腑相救緩急之法也各臟腑可以類推之何謂經絡經者如江河之經芒其筋脈生於肉中絡者如藤之絡石其筋脈生於皮里肉外經筋屬五臟絡筋屬六腑屬五臟者以血藥補之以行經藥通之補之者歸芍熟地是也通之者川芎秦艽沒藥乳香是也屬六腑者以氣藥補之以走絡藥通之補之者人參白朮黃耆是也通之者柴胡羌活葛根是也然又要看其病之淺深而彼此相通不可執一也何謂新久有內傷之新有外感之新有內傷之久有外感之久內傷之新補之當蚤外感之新散之戒重如補之遲遷延成弱矣散之重變成他症矣內傷之久補之當峻當速外感之久散之不可峻不可久不可猛不可速何也人之元氣有限病久必傷元氣若再攻之元氣竭矣真陰亡矣經云邪之所湊其氣必虛又曰粗工洶洶以為可攻此之謂也何謂虛實有陰虛有陽虛有先天之陰陽虛何謂陰虛血虛也何謂陽虛氣虛也血虛者補其血四物湯之類是也氣虛者補其氣補中益氣湯之類是也先天之陰虛六味左歸之類是也先天之陽虛八味右歸之類是也有攻伐太過之陽虛如用寒涼而致陽遏不升當以參朮黃耆溫之甚者薑桂以助之又甚者八味右歸從其原以救之有攻伐太過之陰虛如用發散而致津液乾枯當以歸芍熟地滋之枸杞龜鹿兩膠黏膩之物以填之是也邯鄲趙氏云讀仲景書而不讀東垣書則內傷不明而殺人多矣讀東垣書而不讀丹溪書則陰虛不明而殺人又多矣讀丹溪書而不讀薛氏書則真陰真陽不明而殺人又多矣四明合張李朱薛四大家以立言而於真陰真陽之外又發攻伐太過之陰虛陽虛兩種以補前賢之所未發而救敗之法乃備然則讀四家書而不讀高氏書則攻伐太過之陰虛陽虛不明而殺人又多矣何謂食膏粱爆炙酒酪湩乳能生火而傷胃之陰傷陰者救之四物以養血欲養胃陰須去川芎加甘草佐之芩連梔柏以清火左歸飲去茯苓加花粉尤為穩當浮瓜沉李冷水寒冰能滅火而傷胃之陽傷陽者救之理中以養氣佐之桂附豆蔻以生火虛而不寒則一理中足矣至於飢飽失時則中氣受傷當補而兼運六君子湯加枳實桔梗之類運而提之何謂痰有食積之痰有中虛之痰有水泛水沸所為之痰食積之痰消其食則痰自除保和大安枳朮之類虛者六君子之類中虛之痰或脾虛不運或胃虛不容脾虛不運則積六君子加白豆蔻神麯是也胃虛不容則聚六君子加砂仁神麯是也水泛為痰土虛不能攝水也其痰濃而白補中益氣加半夏木香白豆蔻是也亦有命門火衰不能配水而水泛為痰者仲景云氣虛痰泛當以八味丸補而逐之吳茭山亦云八味丸治痰之本也水沸為痰其痰白如沫吐出如蟹沫少頃變為稠黏之水此腎水不足不能制火火緊而沸也六味丸主之此症間有火不歸原格陽上焰者其痰亦白如沫其脈必浮洪數大而重按則空或右尺沉細無力治當引火歸原八味飲主之王節齊痰之本水也原於腎痰之動濕也主於脾二語深透痰症之根四明諸法皆治痰之本不治痰之標獨扼其要稍似水泛水沸兩條中遺卻火不配水格陽上焰兩症耳今僭補入庶無剩義何謂血凡六淫七情之病皆有因死血薄積於臟腑而成者其症見於外或似外感或似內傷醫家以見症治之鮮不謬矣大凡死血在內其脈必澀滯其出於皮膚也必不滿其入於筋骨也必不完其形大抵如線塗生漆不能充潤之狀線塗生漆形容澀滯之脈猶文章之化境也非天資穎悟精於脈理者不能道此凡醫者遇病多於痰食求之死血多不之察故備言之四明於症之最難審者審得獨精脈之最難認者認得倍細而於鬱火鬱血兩症其形容脈象處尤為精盡診家主此則無難審之症難認之脈而病亦無可遁之情矣何謂症與脈合與脈不合有外感之症脈有內傷之症脈外感者蒸蒸發熱其脈必洪大浮數是症與脈合也如發熱而脈不洪大浮數是症與脈不合也傳曰陽症得陰脈者死此句是論傷寒若別症不可便斷為死此必是火遏也或胃陰不能充拓也或腎水不能化其榮血也則舍症從脈可也火遏者逍遙散加生地薄荷以發之或加丹皮山梔屈曲下行以通之可也胃陰不能充拓者四物湯亦須去川芎加甘草方合陽明重加熟地枸杞人參麥冬五味以滋之可也左歸飲去茯苓加歸芍合生脈甚驗腎水不能化其榮血者六味左歸以補之可也如內傷而外不發熱其脈當靜而反浮躁洪大而數是症與脈不合也傳曰陰症得陽脈者生此句亦論傷寒若別症又不可便許為生此必是陰亡也或陽明有食與火也或腎虛不能納氣也或過服烏附而下焦津液枯竭也又有一種重按有力卻不弦從肌肉滲開脈與肉無界限此近於浮洪豁大也總是陰之象也陰亡也此陰字當作精字血字津液字看治宜溫養濡潤填補一用苦寒沉降之陰藥敗陽滅火禍不旋踵矣如陰亡分先後天以救其陰先天者腎中之陰也後天者胃中之陰也緣救陰之法則上文已詳茲故不另立耳有食與火者健運兼清涼也宜從養陰治使陰氣外溢則得汗而火自清陰血下潤則便通而食自下不可妄用芩連以清火枳朴以消食也腎虛不能納氣者六味都氣都氣尤捷過服烏附者六味兼黃柏知母是也知柏兩味性味苦寒大戕脾胃非有中焦實火下焦濕火不宜妄用今因烏附過劑以致下焦津液枯竭則黃柏之燥尤非所宜且六味純陰潤下但壯水之主自足以制陽光矣何必更加知柏哉脈與肉無界限者六味加歸身枸杞子棗仁白芍合生脈也凡症皆有合不合舉此可以引伸觸類矣何謂症與時不合譬如夏月惡熱而燥不當用辛熱矣然卻是無根之火狂越於外須知此火不可水滅不可濕伏折以寒涼無不立斃故當舍時從症耳非人參桂附八味無以返飛越之孤陽須浸冷服乃合伏其所主先其所因其始則同其終則異之義否則恐其拒格耳傳曰桂附清蒸熱是也此舍時從症之謂也又如冬月畏寒怕冷必當辛熱矣然卻是火鬱於中火熱生風衝突元氣氣從火散故凜凜畏寒即瘧疾之戰亦非真寒也此等若認作真寒而以熱藥治之則誤矣或辛甘以發之逍遙散加生地薄荷或加山梔丹皮或芩連承氣以通之則火透而寒除矣傳曰硝黃解寒戰是也此亦舍時從症之謂也夏月用涼藥冬月用熱藥互看脈義凡脈必隨其部以察其症則部位不可不明也然部位須從內經分配始無差謬故録脈要精微論一條景嶽部位解一則列於四明脈義之首以補其所未備云脈要精微論曰尺內兩傍則季脅也尺外以候腎尺裡以候腹中附上左外以候肝內以候鬲右外以候胃內以候脾上附上右外以候肺內以候胸中左外以候心內以候亶中前以候前後以候後上竟上者胸喉中事也下竟下者少腹腰股膝脛中事也嘗考內經及東洋醫學叢書素問識注解寸關尺內外非指兩傍也乃以寸關尺前為外後為內也未知孰是姑揭出以俟精於脈理者景嶽部位解曰按本經曰上竟上者胸喉中事下竟下者少腹腰股膝脛中事所以脈之形見上者侯上下者候下此自然之理也自王叔和云心與小腸合於左寸肺與大腸合於右寸以致後人遂有左心小腸右肺大腸之說其謬甚矣夫小腸大腸皆下部之腑自當應於兩尺然脈之兩尺左為水位乃真陰之舍也右為火位乃元陽之本也小腸屬火而火居火位故當配於下之右大腸屬金而金水相從故當配於下之左此亦其當然也但二腸連胃氣本一貫故在內經亦不言其定處而但曰大腸小腸皆屬於胃是又於胃氣中總可察二腸之氣也然凡在下焦臟腑無不各具陰陽若欲察下部之陽者當總在右尺察下部之陰者當總在左尺則盡其要矣按叔和心與小腸合等論言其配也景嶽以大小腸皆下部之腑言其位也各具至理各有見地以豫觀之氣口之脈皆屬太陰肺經也借胃氣遞傳合經鼓動之應耳故內經有穀氣入胃脈道乃行脈經有胃氣則生之文不如以浮主心與肺沉主肝與腎中候脾胃再斷以數屬腑遲屬臟無論何部見之參以色診亦直截了當也何必拘拘於上下之部位哉舉輕循之法名為舉浮脈中間仔細推有力為風兼表實無神無力的知虛浮多不足陽分虛也按重取法時名曰按按之不足是元虛有力為疼多氣滯宜溫宜下細詳推沉多有餘陰分實也下手脈沉是氣脈來附骨為積尋不輕不重曲求尋個里機關理最深虛實死生從此得粗工豈辨石和珍中以候胃胃氣虛實生死所關尤宜仔細候四時當旺何為主要識弦洪石與毛一字情同分兩義診家候氣最為高以己之息候彼之息知其接續間斷乃見生死虛實至春弦夏洪秋毛冬石雖為診家定規然亦不必拘泥也但取神胃二氣耳逆陽病見陰名為逆非羸脈大亦如然有餘不足如相反決死無疑命入泉一切有餘之症脈宜有力有神如或微澀而不應手者死也産後脈大失血脈洪腹脹脈澀痢後脈弦皆謂逆也形瘦脈大胸中多氣者死形盛脈細少氣不足以息者死順脈大形標兩得平症餘脈大病還輕形羸脈細無妨害脈症相應是順情逆順二字乃脈症之樞要也得神本先天位在離要知動靜是根基神存氣守無危殆望切工夫妙在斯經曰得守者昌謂神氣在也失三元虧損土無基遇著庸醫促命期祕合相離形已脫診知失守死如歸經曰失守者死謂神氣脫也得失之旨軒岐之祕也新暴病玄機在右關右關神在豈傷殘更將脈症來參看休把斯言作等閒各部雖脫中宮獨存尚可生也久久病根源在絳宮絳宮流利勢從容若還肉脫難同例九候雖調命亦凶久暴之病存乎寸關不可不知緩陽生識趣善形容但在中和四季中虛實若兼無損害正存邪散色晴空大抵脈來和緩病雖重可治以其有胃氣也大凡病能飲食虛能受補即有胃氣如無胃氣見食即畏服補即脹食下即脹不治急火盛元虛脈急有餘不足交加醫能分別脈無差正復緩來邪罷急脈之急非急數之急也診其勢來勇去柔已知邪勝於正必得汗解而正復若脈來急中無緩有餘之症正宜疏泄若急去緩來邪去正復方妙清清脈非邪氣自傷藥宜溫補是良方病從內出無他故訣有言傳不可忘脈來輕清滑軟而無力正氣虛也清中有神病雖重必安平人脈法清輕則主富貴濁脈濁邪干氣有餘藥宜疏瀉莫躊躇病因外入無他故得訣回來好看書脈濁無神亂也必死如脈來緊澀按之鼓擊知其邪氣實也如無外邪即乏胃氣與內有伏火宜辨明之滑往來流利名為滑緩大相兼氣必傷莫作痰看依古訣當來陽分漫推詳如身熱而脈滑大無力乃真氣虛也法當驗症施治或兼嘔惡腹痛或兼食積痰火俱宜調理脾胃為先攻補兼行不宜涼藥如滑而且數痰火也宜吐下不可汗澀沾沙刮竹一般看滑澀當分滯利間氣鬱作疼痰血積元虛久病命須艱乍病身熱脈來洪大獨有氣口脈帶澀此真氣虛也理宜溫補不可寒涼大脈大當思病進臣欺君弱胡行欲知厚薄細推情實瀉虛溫隨症要略云病人脈大為勞以元氣虛也蓋氣為君火為臣君弱臣欺氣虛火盛故脈反見洪大脈本不實寒藥宜忌餘症脈大寸尺舉按皆然法當下之細細如一縷是元虛若是滯弦積有餘能辨久新求責治依經據理莫差遲久病脈細無力防危凡脈來微細真氣虛也症雖有餘亦從脈治細而兼數真陰虛也形盛脈細少氣不足以息者死也促身熱脈來頻歇止至數之中促不祥若還病退漸無妨愈進料應身喪亡此陽極之故多致不救結脈來帶結七情傷歇止中間要忖量痰血滯經多此候當分新久實虛方此陰極之故久病見之難治暴病見之當溫補受補必復如補之不復終至危也又有痰凝經絡而歇止者藥之必復也浮表輕按之滿指重按之則無此陰虛也傷寒得此須用大劑參地輕按之則無重按之滿指此陽虛也輕按之滿指重按之亦然此傷風脈也浮而不斂散脈也此大虛之候不治浮而遲三至此寒脈也宜溫之浮而數此假熱也宜溫之浮而滑痰脈也六君子湯女人主有娠浮而弦真臟脈見也必死假熱浮數必重按全無方可溫補若屬火燥生風者大非所宜沉里輕按之則無重按之則有有而有力則脈實也有而無力則虛甚也沉而遲此寒也沉而數伏火也沉而滑有伏痰也婦人或主有娠沉而澀有瘀血也或失血沉而弦陽絶也不治沉而細必四至此氣血虛也太過不及不治遲寒四至以下俱為遲脈視其至數之微甚為溫補之輕重如脈遲而汗出不止者死數熱數而有力陰敗也數而無力陽虛也數而滑辨其有力無力分治雖危不死數而澀血內熱也數而弦真臟脈也不治數而細大虛也急補之長脈有形體之長如無病而出魚際寸與尺等露而不陷也有往來之長謂來有餘韻也此脈最善短脈與長脈相反雖無病不佳滑脈往來流利此胃氣也滑而浮主痰滑而有力有食也滑而無力胃虛也滑而有力兼數痰火盛也滑而細必四至平人脈也太過血虛不及氣虛澀脈最沉吸在皮膚之間其來不舒血大虧也或有瘀血弦脈弦如弓弦之弦按之勒指胃氣將絶五臟無土木氣太甚即真臟脈也凡病脈見之即凶與滑相反細脈按之如發細脈必沉但得見滑即是正脈平人多有之若見弦數即是枯脈六腑內絶不治但浮而不數陽虛也補中益氣湯主之浮而數陰虛也黑逍遙散主之不應用疏肝益腎湯少間六味飲主之黑逍遙逍遙加熟地即是沉而不數陰中之陽虛也八味丸主之沉而數陰中之陰虛也左歸飲都氣飲主之浮而遲陽中之陽虛也黃耆建中湯主之沉而遲陽中之陰虛也右歸飲主之乍沉乍浮乍大乍小乍遲乍數或三或五陰陽俱虛也十全大補湯主之此一段陰陽氣血分配尤極精細的當醫家得此直是枕中之祕二十五方總圖二十五方分圖足厥陰肝足少陽膽木主病變見五症用藥之法肝與膽自病為正邪用逍遙散瀉木中之木之心病為實邪用七味飲瀉木中之火之脾病為微邪用小柴胡湯瀉木中之土之肺病為賊邪用左金丸瀉木中之金之腎病為虛邪用滋腎生肝飲瀉木中之水手少陰心手太陽小腸火主病變見五症用藥之法心小腸自病為正邪用歸脾湯瀉火中之火之脾病為實邪用遠志飲子瀉火中之土之肺病為微邪用龍骨丸瀉火中之金之腎病為賊邪用導赤散瀉火中之水之肝病為虛邪用養榮湯瀉火中之木包絡三焦附足太陰脾足陽明胃土主病變見五症用藥之法脾與胃自病為正邪用六君子湯瀉土中之土之肺病為實邪用四君子湯瀉土中之金之腎病為微邪用理中湯瀉土中之水之肝病為賊邪用建中湯瀉土中之木之心病為虛邪用香連丸瀉土中之火手太陰肺手陽明大腸金主病變見五症用藥之法肺大腸自病為正邪用瀉白散瀉金中之金之腎病為實邪用生脈散瀉金中之水之肝病為微邪用生金滋水飲瀉金中之木之心病為賊邪用黃耆湯瀉金中之火之脾病為虛邪用補中益氣湯瀉金中之土足少陰腎足太陽膀胱水主病變見五症用藥之法腎膀胱自病為正邪用六味飲瀉水中之水之肝病為實邪用疏肝益腎湯瀉水中之木之心病為微邪用八味丸瀉水中之火之脾病為賊邪用右歸飲瀉水中之土之肺病為虛邪用左歸飲瀉水中之金命門附二十五方圖解是解從姚於九本抄附第不知解自何人今特低一字以別之五行有相生相剋相生者謂金生水水生木木生火火生土土生金是也相剋者謂金剋木木剋土土剋水水剋火火剋金是也凡脈遇相生者吉相剋者凶如心見沉細肝見短澀腎見遲緩肺見洪大脾見弦長皆遇克也為鬼賊相侵危症也又如心見緩肝見洪肺見沉脾見澀腎見弦是子來扶母遇我之所生也雖病易瘥至如腎病傳肝肝病傳心之類此母來抑子病雖不死亦綿延日久矣又我克者為妻假如春木脈見脾土是夫得妻脈也妻來乘夫雖非正克然春中獨見脾脈土乘木衰土乘之則生金來剋木耳若脈見弦緩則本體尚存土雖乘之不足慮也如本脈全無而獨見脾緩之脈為害必矣脈賦云春得脾而莫療冬見心而莫治夏得肺而難瘥秋得肝亦何疑此即四時休旺以例生克之義也然人脈之息數出氣為呼入氣為吸一呼一吸謂之一息息間脈來四至或五至為平和不大不小和緩舒暢此無病之脈也至於三遲二敗冷而危也六數七極熱甚也八脫九死極於十一二至與夫奄奄兩息一至則又散而為變也六數七極熱也脈中有力為有神也當泄其熱三遲二敗寒也脈中有力為有神也當去其寒若數極遲敗中不復有力為無神也將何所恃耶可與之決死期矣說本東垣然脈盡有有力而無神者亦有無力而有神者蓋有神無神非即以有力無力論也如以有力即為有神無力即為無神則凡脈之弦徑而勒指者可為有神而許以生乎脈之和緩而軟弱者可為無神而斷以死乎恐未必應其口也則何如有餘之症脈須有力而有力之中又貴有神不足之症脈宜無力而無力之中全在有神數語為扼診家之要也哉按五圖合為一圖則五圖一五行也所謂合之則一五行也一圖分作五圖則五圖各具一五行也所謂分之則五行各有五五五二十五也謂之主病者乃各臟腑所主之病如諸風眩掉悉屬於木諸逆衝上悉屬於火之類是也變見五症者乃各臟腑自具之五邪如木之火病則為木中無火木之水病則為木中無水之類是也自病自字與主病主字不同主病是統正實微賊虛五邪而言自病則單是正邪與實微賊虛四邪平列為五而統於主病之中者也之心病之脾病等之字非由此及彼之謂蓋曰木中的火病木中的土病也上之字與下木中之木等之字同作的字解不作往字解若錯解之字則都無理會一齊差卻矣試於上邊之字上加肝膽中心小腸等三字下邊木火土金水等五字換作正邪實邪等十字讀之云肝膽中之心病為實邪用七味飲瀉木中之實邪心小腸之脾病為實邪用遠志飲子瀉火中之實邪則圖中之義自明原解於四明二十五方圖中五症變見之義未諦豈因誤解上下兩之字抹卻中間一中字耶理則無二言詎一端按圖索解必求其當用隨所見附解於茲無而先克循環同原太極則合五圖為一圖可也即分一圖為五圖可也闔得攏亦未始分不開分得開又未始闔不攏也而開闔從方便者誰乎其惟會太極動靜之理於一原者乎二十五方主症逍遙散治肝膽兩經鬱火以致脅痛頭眩或胃脘當心而痛或肩胛絆痛或時眼赤痛連及太陽無論六經傷寒但見陽症悉用此方婦人鬱怒傷肝致血妄行赤白淫閉沙淋崩濁等症俱宜此方加減治之易曰風以散之此方是也柴胡白芍歸身白朮茯苓甘草薑棗引上方加熟地名黑逍遙散加丹皮山梔名加味逍遙散加人參名柴芍參苓散加大力子川芎丹皮山梔名梔子清肝散加蔓荊子川芎丹皮山梔名當歸川芎散加熟地川芎丹皮鉤藤秦艽名秦艽地黃湯加木瓜米仁熟地川芎山梔膽草名清肝養榮湯七味飲治肝經氣虛筋無所養變為寒症以致筋骨疼痛腳軟懶行及傷寒服涼藥過多木中無火手足牽引肝經血虛以致火燥筋攣變為結核瘰癧等症經曰辛以潤之此方是也熟地山藥萸肉丹皮茯苓澤瀉肉桂上方加五味名加減八味飲小柴胡湯治少陽經傷寒症凡耳聾脅痛口苦眼赤及夏秋六經瘧疾隨症加減柴胡黃芩人參半夏甘草薑棗引上方加丹皮山梔名加味小柴胡湯去半夏加山梔連翹川芎桔梗名柴胡清肝散左金丸治肝膽鬱火胸脅痛不可忍酒濕發黃每食吞酸吐酸如醋浸心酸水噯出口中齒不可合者黃連茱萸上方一名四金丸為末粥丸白朮陳皮湯下滋腎生肝飲治肝火鬱於胃中以致倦怠嗜臥飲食不思口渴咽燥及婦人小便自遺頻數無度凡傷寒後熱已退而見口渴者用之熟地山藥萸肉丹皮茯苓澤瀉柴胡當歸五味白朮甘草上方去柴胡白朮甘草加生地名益陰地黃湯去柴胡澤瀉加人參黃耆麥冬廣皮名人參補肺湯上五方治木之五症歸脾湯治心火衰甚不能生土以致土困金敗外兼咳嗽吐痰寒熱往來盜汗急以此方去木香加白芍以治之凡見脾胃衰弱飲食不思大便泄瀉總屬君火不旺所致此補本法也凡各種虛症補中益氣湯所不效者投以此方若加酒炒白芍北五味子以斂其心氣奏效更神也歸身遠志棗仁炒研茯神木香人參黃耆蜜炙白朮土炒甘草圓眼去核薑棗引上方加丹皮山梔名加味歸脾湯遠志飲子治風入大腸傳為風痢膿血並見但裡急後重而腹不痛者此方主之或加桔梗遠志當歸防風黃耆白朮甘草龍骨丸治腎氣不足不能上交心火龍骨煅骨脂炒研蠶蛾五味蓯蓉酒洗去鱗膜蜜丸導赤散治心火亢甚小腸鬱結不能通利此方治之白濁沙淋等症合逍遙散生地木通黃芩或用黃連或用甘草養榮湯凡屬大虛症勿論其脈與病但服此方諸症悉退此十全大補湯對子也十全大補但分氣血此則五臟皆補無乎不到虛寒甚者當加附子以治之三陰瘧更妙一作陰虛更妙白芍當歸遠志熟地五味肉桂人參黃耆茯苓白朮陳皮甘草薑棗為引上方去遠志五味陳皮加川芎名十全大補湯上五方治火之五症六君子湯治脾胃氣虛飲食不進致成痰癖不時咳唾或胃氣虛寒動成嘔惡凡虛瘧及諸病後痢後俱當以此方調之人參白朮廣皮半夏茯苓甘草上方去人參白朮名二陳湯去半夏茯苓加白芍名益黃散去茯苓白朮加山藥熟地名金水六君煎四君子湯治脾胃不和飲食不進泄痢虛飽人參白朮茯苓甘草上方加川芎當歸名加味四君子湯加川芎當歸黃耆柴胡丹皮名益脾清肝散理中湯治虛寒胃痛嘔吐不絶泄瀉完穀不化此太陰陽明兩經藥也人參白朮炒乾薑甘草上方加附子名附子理中湯建中湯治肝虛不能生火以致火不能生土用白芍之酸甘草之甘此甲己化土也再加肉桂補肝之子益土之母以培其生化之原凡脾胃不和飲食不進其外見症兩脅寒痛泄痢小腹痛用此治之白芍肉桂甘草謙按此方當加飴糖庶合仲聖之旨上方加黃耆名黃耆建中湯香連丸治脾胃兩經中濕火傳變大腸泄痢無度裡急後重黃連木香不宜見火水丸晚村批醫貫云近日香連丸絶非舊法雜用消克瀉下之藥人自為政亦名香連殺人如麻真可痛恨上五方治土之五症瀉白散凡屬肺熱咳嗽皆當加減用之咳加桔梗百合痰加貝母渴加知母有食加枳實桑皮蜜炙骨皮甘草上方加人參茯苓青皮陳皮五味知母天冬名人參平肺散生脈散治暑傷元氣汗出過度倦怠嗜臥如有虛熱口渴不思飲食輕者合四君子湯重者合補中益氣湯人參麥冬五味上方如無人參以枸杞代之生金滋水飲凡傷寒熱退後有易補之陰有難動之陽皆當以此養之其見症或汗後煩躁未除口渴微熱大便艱澀小便短赤即是又有一種少陽陽明症手足腫痛皆火燥生風風淫末疾不必俟其汗後當即以此方加柴芩與之無不效也生地丹皮當歸白芍人參麥冬白朮生用甘草棗姜引上方去丹皮麥冬加川芎茯苓名八珍湯黃耆湯治肺氣大虛腠理不固寒症至矣或小腹隱痛大便不實小便頻數無度經夜不寐盜汗不止命門火衰精滑夢遺此方通治之其盜汗自汗尤為緊要黃耆蜜炙白朮當歸遠志蜜炙棗仁炒研骨脂薑棗引上方去黃耆骨脂加人參熟地甘草名七福飲補中益氣湯凡六經內傷外感及暑月勞倦發熱或汗出不止但用本方加白芍一錢痢疾腹痛已除瀉猶未止是脾氣下陷也加酒炒白芍三錢瘧疾發久形體尪羸無論六經皆當加半夏一錢合六君意也即有外感不過加黃芩一錢則又合小柴胡矣凡婦女胎前氣虛以致胎動不安小産崩漏或産後血虛發熱但加酒炒白芍二錢此方凡屬中宮虛損病後失調無不相宜倪氏曰七情內傷脾胃先病治先補土此方是也人參黃耆蜜炙白朮土炒當歸陳皮柴胡升麻甘草薑棗引謙按此方當以參耆為君歸術為臣陳草為佐升柴為使而分兩君臣但以錢計佐使以分計庶與東垣立方之旨合蓋上中之宣劑也上方加白芍五味名調中益氣湯去當歸白朮陳皮加白芍五味名人參益氣湯去柴胡加茯苓五味名參耆補脾湯上五方治金之五症六味飲治腎水不足虛火上升消爍真陰變為潮熱咳嗽消渴虛勞等症易曰雨以潤之此方是也熟地山藥萸肉丹皮茯苓澤瀉上方加五味名都氣飲加五味生地柴胡名抑陰地黃丸加五味生地柴胡歸尾去萸肉名滋陰腎氣丸去茯苓澤瀉加川芎當歸川楝子使君子赤茯苓名九味地黃丸疏肝益腎湯凡胃脘痛大便燥結者肝血虛也此方主之逍遙散所不能愈者此方妙柴胡白芍熟地山藥萸肉丹皮茯苓澤瀉上方加歸身棗仁山梔名滋腎清肝飲八味丸治命門三焦火衰元陽虛憊變為泄瀉腹脹陽痿精寒不育兩膝痠痛腰軟無力兩目昏花悉以此方治之易曰日以烜之此方是也附子肉桂熟地山藥萸肉丹皮茯苓澤瀉謙按方中加牛膝車前名濟生腎氣丸腎寒肝熱者最宜上方加五味鹿茸名十補丸去山藥萸肉丹皮茯苓加牛膝甘草名鎮陰煎右歸飲凡命門虛寒等症八味丸治之不愈者宜服此方見症已詳八味丸下附子肉桂熟地枸杞山藥萸肉杜仲甘草上方去甘草加當歸鹿膠菟絲即右歸丸左歸飲治腎水乾枯虛火上蒸脾胃陰土受虧以致飲食不進大使燥結甚至三陽癃閉變成噎鬲治之於早無不愈也嘗以此方加歸芍治傷寒舌黑唇焦大渴引飲此必服攻伐寒涼之藥過多也此方救之治瘧疾而兼燥症熱重寒輕者此方更妙熟地枸杞山藥萸肉茯苓甘草上方去茯苓甘草加龜膠鹿膠菟絲牛膝即左歸丸上五方治水之五症
