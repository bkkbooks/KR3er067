body:
  text: 卷五東莊醫案業師徐先生號五宜壬寅秋患滯下膿血晝夜百餘次裡急後重醫診之曰脈已歇至矣急用厚朴青皮檳榔枳殼木香等或可挽回業師與鼓峰最契習聞理解頗疑之不肯服時鼓峰歸四明豫往候曰爾試為我診之脈洪弦而數或一二至或三四至或五六至輒一止豫曰毒及少陰矣當急顧其陽明方用生熟地黃各一兩歸芍丹皮黃連各三錢甘草五分群醫議豫方云痢疾一症雖古名醫所用藥不過數味耳今盡反常法恐無當於病服之必飽悶增劇矣次日往候次數尚頻而急重已除診其脈洪數亦減至數相續是日復用前方病去大半又次日去生地黃連加人參白朮山藥茯苓等藥飲食大進午後師自按脈曰爾前謂吾脈尚弦此刻漸減矣診之果然而至數復有止狀或駭曰病退而脈復變得無恙乎豫曰無妨也歇至者即古代結促之俗名也若沖氣中絶臟脈自見者危今吾師歇至本以毒盛擁遏墜道陰精不承故一二至或三四至或五六至而止也經曰數動一代者病在陽之脈也泄及便膿血今豫去陰藥過甚進陽藥太驟中髒得和則木土和而胃氣安故飲食進而毒尚未盡者亦隨壯氣而旺故復有止狀也於方中仍加生地黃連即平矣如言而安痢疾一症惟王損庵論獨得其奧而法亦極其詳故善治痢者未有不以準繩為準繩者也是案議論症治與辨晰脈義處尤足補準繩之所未及學者其併入準繩痢疾條下參看可也姚江姻友陳紫綺內人半産胎衣不下連服行血催衣之藥四劑點血不行胸痛瞀亂豫往視曰此脾失職也先與黃耆一兩當歸一兩下咽而瞀亂頓減時有以準繩女科中惡阻血不下及胞衣不下方書一本進者上注某方經驗某方試效紫綺以示豫曰中有可用否曰一無可取遂用大劑人參白朮芍藥黃耆當歸茯苓甘草等藥一服而惡露漸至皆驚歎曰古方數十一無可用而獨以是奏功準繩一書真可廢也豫曰惡是何言王損庵醫之海岱也顧讀書者自不察耳若唯以惡阻及胞衣不下條中求合吾方宜其謬也試以血崩及血下不止條中求之吾方可見矣蓋此病本氣血大虧而至半産脾失統血之職水湮士崩沖決將至故生瞀亂不為之修築而反加穿鑿是虛虛也吾正憂血下之不止而彼且憂血之不下其不合也又何怪焉曰今從子法可遂得免乎曰不能也穿鑿過當所決之水已離故道狂爛壅積勢無所歸故必崩急服吾藥第可固其堤岸使不致蕩沒耳至第三日診尺內動甚豫曰今夜子以前必崩矣去豫家尚遠因留方戒之曰血至即服至黃昏果發如豫言得無恙方即補中益氣湯加參耆各二兩也次用調補脾腎之藥而愈凡半産總屬氣血兩虧所致可知半産後之胎衣不下亦是氣虛不能推送血虛不能潤利之故行血催衣等劑亟當禁忌乃每見女科庸技臨此等症非查肉桃仁即紅花香附祖授師傳只此數味而不知其入人腸胃利如鋸斧也特示此案以救之姪倩鍾靜遠暑傷元氣便血胸膈滿悶數至圊而不能便醫用半夏厚朴蒼朮枳實山楂青皮檳榔延胡索杏仁花粉諸破氣祛痰藥便益難胸益悶遷延半月許豫往視舌起黑胎發熱胸膈痛甚脈浮數曰此藥傷真陰火無所畏故焦燥也且問醫治法云何日三次下之矣邪甚不能解今當再下之耳豫曰脈數奈何則唯唯無所應豫乃重用生熟地黃以丹皮歸芍佐之飲藥未半甌即寒栗發戰通體振掉自胸以上汗如雨舉家驚疑迎醫視之則不知其為戰也妄駭謂吾固知補藥不可服今果然急濃煎陳皮湯及生萊蔔搗汁飲之云唯此可解地黃毒也繼進涼膈散倍硝與大黃下清穢數升復禁絶飲食粒米不許入口舌轉黑胸轉悶群醫又雜進滾痰丸大小陷胸湯等劑劇甚垂危復邀豫診之脈數極而無倫痰擁脅痛氣血不屬症已敗矣非重劑參朮不能救也先以新谷煮濃粥與之胸膈得寬乃稍稍信豫試進參朮等味得汗下黑矢神氣頓安而痰嗽不止所咯皆鮮血向有痔疾亦大發痛不可忍脾下泄其家復疑參朮助火豫曰此參朮之力不及不能助火生士耳遂投人參二兩附子六錢炮薑吳茱萸肉桂補骨脂耆朮歸芍藥稱足一服而咯血即止痔痛若失但恐悸不能寐吸氣自鼻入口覺冷如冰雪雖熱飲百沸下咽即寒痛欲利乃制一當茶飲子用人參二兩熟地黃二兩炮薑三錢製附子六錢濃煎頻飲入口便得臥每日兼用參附養榮湯元氣漸復時鼓峰至邑同邀過看鼓峰問靜遠曰曾舉几子矣靜遠駭曰吾病豈終不起耶何遽問此鼓峰曰非也臟腑多用硝黃攻過盡變虛寒生生之源為藥所傷今病雖愈不服溫補恐艱於生育耳故豫每與用晦言醫當醫人不當醫病也靜遠乃震悟曰非二公幾殺我任醫如任將皆安危之所繫也然非知之深者不能信之篤非信之篤者不能任之專故惟熟察於平時而有以識其蘊蓄乃能傾信於臨事而得以盡其所長使必待渴而穿井鬥而鑄兵則倉卒之間何所趨賴一旦有急不得已而付之庸劣之手最非計之得者觀病家與東莊誼關至戚乃信任不專而幾為庸醫所殺可鑑也倘有閲是案而留意於未然者又孰非不治已病治未病不治已亂治未亂之明哲乎此症已濱於死而東莊復置之生非如此破格挽回豈能出奇奏效耶觀其所制當茶飲子具見良工心苦矣醫當醫人不當醫病一語深合內經治病求本之旨從長洲醫案中細體之自見姚江錢嶢都子五歲病疹泄瀉兒醫謂瘄毒最宜於瀉不復顧忌以清火為急寒涼縱進病勢殊劇來邀豫視面色兩顴嫩紅時咬牙喘急口渴甚飲水不絶脈洪緩如平壯人豫曰脾急矣速投人參白朮當歸黃耆陳皮甘草茯苓木香以救之一劑覺安次日有鄰族人來候驚阻之曰誤矣小兒有專門豈可令腐儒治之吾所聞瘄病以發散清涼解毒為主今半身瘄潮未退而用溫補必不救矣其家懼遂不敢再服間二日嶢都復來見豫曰諸症復如故如何豫曰豈有是理哉君戲我耳曰日來實不服尊劑乃述其故豫曰君試急歸令郎天柱倒矣別去頃之馳至曰果如公言奈何急服前方何如豫曰前方救虛也今加寒矣非桂附不能挽也曰顴紅喘急口渴飲水俱是熱症而公獨言虛寒何也曰陰竭於內陽散於外而寒涼復逼之陽無所歸內真寒而外假熱此立齋先生所發內經微旨非深究精蘊者不能信也嶢都歸違衆服之一劑而天柱直二劑而喘渴止三劑起行嬉戲戶外觀此案則知小兒瘄症亦尚有陽虧者誰謂稚幼純陽必無補陽之法耶吳華崖先生館僮夏月隨彼湖上歸感熱症下利膿血身如燔炙豫過視之曰此陽明病也不當作痢治視其舌必黑而燥夜必多譫語其父母曰誠如所言請診之則脈已散亂忽有忽無狀類蝦遊不可治也華崖強豫治之云固知無生理亦冀其萬一不得已用熟地黃一兩生地麥冬當歸白芍藥甘草枸杞子佐之戒其家曰汗至乃活次日復往曰昨夜熱不減而譫語益狂悖但血痢不下耳服藥後見微汗少頃即止殆不可治豫曰無驚且診之則脈已接續分明洪數鼓指豫喜曰今生矣仍用前方去生地黃加棗仁山藥山茱萸牡丹皮連服六帖其家以譫妄昏熱不減每日求更定方豫執不可姑再忍定以活人還汝是日診其脈始斂而圓乃曰今當為汝去之用四順清涼飲子加熟地黃一兩大黃五錢下黑矢數十塊諸症頓愈越二日薄暮忽復狂譫發熱喘急口渴舉家惶惑謂今必死矣豫笑曰除是服庸醫藥不然雖挺刃擊之不死也豈忌吾言乎得汗即活矣遂投白朮一兩黃耆一兩乾薑三錢甘草一錢當歸芍藥各三錢盡劑汗如注酣臥至曉病霍然已或曰陽明熱甚當速解其毒在古人亦必急下之以存真陰之氣今子先補而後下其義何居豫曰毒火燔熾涼膈承氣症也而其源起於勞倦陽邪內灼脈已無陰若驟下之則毒留而陰絶死不治矣不聞許學士治傷寒乎發熱頭痛煩渴脈浮數曰此麻黃證也然榮氣不足未可發汗先以黃耆建中湯飲之其家煎迫發汗語至不遜許但忍之至五日尺部脈應方投麻黃而愈因謂醫者須顧表裡虛實待其時日若不得次第暫時雖安損虧五臟以促壽限何足貴哉南史載範云病傷寒恐不預武帝九錫之賀責良醫徐文伯以速效文伯曰此誠不難但二年後不復起耳云強之文伯燒地布桃葉以法汗之翌日果愈云甚喜文伯曰不足喜也後二年果卒夫取汗先期尚促壽限況可不顧臟腑脈症而妄下乎或曰此則聞教矣間日復病而子又以他藥愈之何也曰病從陽入必從陽解今陰氣已至而無以鼓動之則榮衛不洽汗無從生不汗則虛邪不得外達故內沸而復也先補後下與先補後汗皆虛回後清邪意也至於病從陽入必從陽解之義則更發前人所未發非精察內經深蘊者未許窺其妙義亡友孫子度侄女適張氏病半産咳嗽吐血脈數而澀色白胃滿脾泄醫用理氣降火止血藥益甚豫投理中湯加木香當歸倍用參朮而血止繼用歸脾湯及加減八味飲子諸症漸愈時鼓峰從湖上來邀視之鼓峰曰大虛症得平至此非參朮之力不能今尚有微嗽夜熱時作急宜溫補以防將來因定朝進加減八味丸晡進加減歸脾湯未幾過粗工語之詫曰血病從火發豈可用熱藥遂更進清肺涼血之劑病者覺胃脘愈煩惋飲食不進而迫於外論強服之逾月病大發血至如湧或紫或黑或鮮紅病者怨恨復來招豫往視之曰敗矣臟腑為寒涼所逼榮衛既傷水火俱竭脈有出而無入病有進而無退事不可為也未幾果歿仁齋直指云榮氣虛散血乃錯行所謂陽虛陰必走也曹氏必用方云若服生地黃藕汁竹茹等藥去生便遠故古人誤解滋陰二字便能殺人況粗工並不識此隨手撮藥漫以清火為辭不知此何火也而可清乎所用藥味視之若甚平穩詎知其入人腸胃利如斧鋸如此可畏哉夫血脫益氣猶是粗淺之理此尚不知而欲明夫氣從何生血從何化不亦難乎操刀必割百無一生有仁人之心者願於此姑少留意也歟病家之要全在擇醫然而擇醫非難也而難於任醫任醫非難也而難於臨事不惑確有主持而不致朱紫混淆者之為更難也倘不知此而偏聽浮議廣集群醫則騏驥不多得何非冀北駑群帷幄有神籌幾見圯橋傑豎危急之際奚堪庸妄之誤投疑似之秋豈可紛紜之錯亂一著之謬此生付之矣以故議多者無成醫多者必敗從來如是也如此症若信任專而庸技不得以間之亦何至舉將收之功而棄之哉每一經目殊深扼腕徐鸞和內病咳嗽醫以傷風治之益甚邀豫診則中虛脈也曰鼻塞垂涕痰急皆傷風實症何得云虛豫曰此處真假所辨在脈庸醫昧此枉殺者如麻矣彼不知脈請即以症辨之其人必晡時潮熱嗽甚至夜半漸清至晨稍安然乎曰然然則中虛何疑乎所可喜者正此鼻塞垂涕耳乃投人參白朮當歸黃耆白芍藥各三錢軟柴胡升麻各一錢陳皮甘草五味子各六分三劑而咳嗽立愈再往診謂之曰上症已去唯帶下殊甚近崩中耳鸞應曰然即前方重用人參加補骨脂阿膠各二錢數劑兼服六味丸而愈南湖沈松如舉此案問豫云於鼻塞垂涕中診得中虛人或能之於咳嗽既愈後看出帶下東莊果何所見耶豫曰東莊亦只是於中虛脈症中討出消息耳蓋中氣者金賴以生而水藉以攝者也中氣一虛則上不能生金而病咳嗽下不能攝水而患帶下蓋此症之咳嗽與帶下論其標則上下分見求其本則金水同原總屬中虛所致也得其致病之源則自可據其現在之本病以測其將來之流病矣況其為已見之病端哉又問東莊以鼻塞垂涕反為可喜其義何居曰皮毛者肺之合也肺失所養則腠理不密外邪易入其鼻塞垂涕者乃太陽經傷風表症也邪之所湊必先皮毛一入皮毛即犯太陽故凡感症以見咳嗽為輕凡咳嗽以見表症為輕者以其邪未深入耳又問咳嗽與帶下既皆中虛所致宜其病則俱病治則俱治何為咳嗽既見而帶下未見耶且咳嗽既愈而帶下反甚耶豈其既能生我所生而猶未能制我所制耶曰此則病之見也有先有後醫之治也有次有序緣土困則金即衰故咳嗽先見其不僅用補中而加白芍五味者以非補土無以生金而補土又不可以不生金也清升而濁始降故帶下後見其不僅用調中而加阿膠故紙者以非崇土無以攝水而崇土又不可以不攝水也尤妙在重用人參與兼服六味蓋非重用人參則不能峻補其下非兼服六味則不能使水歸其壑所謂因其勢而利導之使利機關而脾土健實也揣東莊之意大率如此子以為何如吳尹明子十歲患夜熱二年餘頜下忽腫硬如石面黃時時鼻衄如注孟舉致豫看之疑久病必虛預擬豫用參朮等方豫脈之沉鬱之氣獨見陽關曰病敦阜也用石膏藿香葉梔子仁防風黃連甘草等頜腫漸軟面黃復正繼用黃芩枇杷葉玄參枳殼山梔茵陳石斛天麥門冬生熟地黃等重加黃連而衄血夜熱悉除孟舉笑出所擬方以為非所料云如遇此等脈症即東莊亦未始不用寒涼看黃葉村莊與東莊最契其所用方尚難預料可知寒熱攻補須憑所遇脈症隨宜而用原未始先存成見也乃有謂東莊派只一味好用溫補者此不知東莊之言耳知東莊者其敢為此言乎從子在公婦半産惡露稀少胸腹脹甚脈之濡數當重用參耆不然必崩因力艱未服已而果崩潰不止下血磈如拳如碗大者無數神氣昏憒兩足厥冷至少腹兩手厥冷至肩額鼻俱如冰頭上汗如油旋拭旋出按其脈至骨不得見豫投大劑補中益氣湯加人參一兩未效急用人參一兩附子一兩炮薑二錢濃煎灌之至暮漸減豫戒曰俟其手足溫即停藥至三鼓手足盡溫崩亦止家人忘豫言又煎前方進之比曉豫往視脈已出而無倫痰忽上湧點水不能飲入口即嘔吐並獨參湯不能下豫曰此過劑所致也即投生地黃五錢熟地黃一兩當歸芍藥枸杞子各三錢甘草一錢濃煎與飲病者意參飲尚吐況藥乎不肯服豫強之曰試少飲必不吐進半甌殊安遂全與之盡藥而痰無半點神氣頓清矣午後體發熱豫曰此血虛熱恆理也復用十全大補調而痊既因力艱不能救虛於未崩之前崩後見症俱屬虛上加寒則非薑附不能挽矣猶用前方止以救虛此均是失之不及處逮至三鼓手足盡溫則一陽之復於半子者已遍達於四表矣乃又誤進前劑以致脈出無倫痰湧嘔吐點水不入不又失之過劑乎舉此可見臨症制方凡前後次第及輕重緩急皆當合宜而用若過與不及無論方不對症也即使對症亦堪殺人其可畏如此吳維師內患胃脘痛叫號幾絶體中忽熱忽止覺有氣逆左脅上嘔吐酸水飲食俱出或疑停滯或疑感邪或疑寒凝或疑痰積豫脈之弦數重按則濡蓋火鬱肝血燥耳與以當歸芍藥地黃柴胡棗仁山藥山萸肉丹皮山梔茯苓澤瀉頓安唯胃口猶覺劣劣用加味歸脾湯及滋肝補腎丸而愈列症中既云覺有氣逆左脅上嘔吐酸水則即不知脈而第以症驗之已明明是肝血燥痛矣何諸醫議論紛紜茫無確見乎想緣此症在四明東莊以前無人闡明其義耳然試問四明東莊兩家從誰氏醫案中參究得來耶家仲兄次女年十四新夏患感症項強頭痛身熱仲兄治之旋愈惟熱尚未解至第七日豫適候兄命診之豫曰汗至解矣不必藥也惟身涼當服補中益氣湯加黃芩數帖不則慮其復耳果得汗愈遂不肯服藥越數日果復又二日兄召豫視則體燥熱甚舌胎干黃口渴遍身疼痛舉手足俱呼痛不可忍胸腹尤甚臍上有塊高起如鵝子大按之堅如石痛欲死兄曰補之乎下之乎豫對曰下之則死補之則甚第可潤之耳兄曰得之矣用人參地黃當歸芍藥甘草麥門冬枸杞子丹皮煨薑飲之即熟睡醒覺寒栗發戰汗沾被席遂失臍腹硬塊所在痛止熱解翌日下黑矢而愈會得陰氣外溢則得汗陰血下潤則便通之義方知東莊此案中第可潤之一語之妙其下之則死補之則甚二語雖是端就此症而論然足與景嶽實而誤補不過增病病增者可解虛而誤攻必先脫元元脫者無救矣數語合璧也一長姓者好學深思士也年十八歲杪得齒衄及手足心熱恍惚不寧合目愈甚盜汗胸前出如油間或夢遺或不夢而遺伊叔録脈症求方豫曰脈不敢憑據所示症乃三焦包絡火遊行也試用後方治之方用連翹黃芩麥冬生地丹皮丹參茯苓石斛滑石粉辰砂甘草白豆蔻仁等服七劑而愈及明年用功急迫至夏其症復發就便醫治皆云不足症用溫補腎經及澀精等劑服之日劇又進溫補腎經丸料斤許愈劇至不能立立則足腕下刺痛見者洶洶謂為弱症矣始疑俗醫之謬乃駕舟就診豫曰尊體雖尪羸而面色憔悴之中精神猶在已診問曰迫服何等湯劑出示方豫曰生藥補矣何得不凶且少年朴實人何必用溫補曰手足心熱奈何曰勞心人大抵如是曰夢泄則奈何曰夢泄人人各殊子乃心腎下交所致與夫盜汗恍惚等皆三焦包絡之火遊行而然藥宜清涼遂用連翹生地黃芩丹皮茯苓丹參甘草升麻石斛麥冬北五味燈草服十餘劑又用麥冬熟地生地滑石石斛茯苓芍藥丹參神麯辰砂作丸守服而愈血從齒縫中或牙齦中出名曰齒衄系陽明少陰之症蓋腎主骨齒者骨之標其齦則屬胃土又上齒止而不動屬土下齒動而不止屬水凡陽明病者口臭不可近根肉腐爛痛不可忍血出或如湧而齒不動搖其人必好飲或多啖炙爆肥甘豢養所致內服清胃湯外敷石膏散甚者服調胃承氣湯下黑糞而愈或有胸虛熱者以補中益氣加丹皮黃連亦得少陰病者口不臭但浮動或脫落出血或縫中痛而出血或不痛此火乘水虛而出服安腎丸而愈余嘗以水虛有火者用六味加骨碎補無火者八味丸加骨碎補隨手而應外以雄鼠骨散敷之齒動復固又小兒疳症出血口臭肉爛者蘆薈丸主之東莊此案可為凡症屬三焦包絡之火遊行者立一準繩並可使慣用溫補者推而廣之不致誤以此火認為無根之火故從西塘治法備忘稿中録存之古人立一方必有一旨若近來醫方見某病即用某藥一方中必下數十味直是一紙藥帳矣案中生藥補一語快極新安許開雍病齒上齦從耳根痛起便苦楚不可耐醫用平胃降火藥日增劇豫診之關滯而尺衰授方以熟地黃為君杜仲枸杞子女貞子甘草黃柏山藥山茱萸為臣佐其尊人青臣舉以問醫曰此方何如醫云大謬不可服問其謬狀曰齒病為陽明之火與腎何干而俱用補腎藥耶青臣曰果爾則吾知此方之妙矣乃更邀豫往視之余曰病見於上而治當從下起此有步驟不可責速效也青臣曰唯命乃仍用前藥數劑繼用人參白朮茯神甘草白芍藥棗仁遠志肉當歸黃耆牡丹皮數劑痛已減而未去也豫診其兩尺已應右關以上皆平和惟左關尚鬱塞曰今當為君立除之遂用補中益氣湯加龍膽草即愈後小發復加減前方愈之因囑之曰此雖小疾而其根在下當謹調攝無使頻復也青臣以為奇亦令豫診脈得風木之氣太過法當即見痰症矣微言之未數日夜間痰忽上湧如中風狀遂復召豫診脈洪弦而堅豫曰此類中風根也今發幸輕且精力尚強實培脾土則風木自能退聽可無害也但杜徵南所謂平吳之後正煩聖慮耳乃用六君子湯合玉屏風散與之數帖而愈豫謂宜連服百餘帖及都氣丸二三料以絶其株荄俗儒阻之曰服參過多補住痰涎禍不旋踵不可從也因猶豫停止然頗慎調攝今幸無恙症見齒上齦從耳根痛起診得關滯尺衰在吾輩處此必當投以大甘露飲去茵陳枳殼而加柴梔丹皮矣乃始則不用甘露而用左歸繼又不用逍遙而用歸脾後復不用歸脾而用補中何令人莫測也然細按之則見其主方之當加味之精矣孟舉僕錢姓者患夢泄不止夜熱羸弱豫用甘溫治之夢泄頓愈惟夜熱未除他醫進清涼之藥身大熱下利膿腹痛不可忍更醫治痢雜薑桂芩連益狼狽下鮮血或如屋漏或如豬肝或如魚腦汁復迎豫視脈數大而堅此挾虛感熱醫不得次第致血虛而毒盛也與當歸丹皮芍藥澤瀉茯苓地黃加黃連數劑而痢止時適與友人集公所其家人馳至曰頃忽增一病患小便內痛點滴不能便便後痛愈甚正號呼床席求急解之豫思良久問痛連少腹乎曰否豫曰吾知之矣急歸取丸子兩許令急吞之下咽少許時痛若失而便通矣孟舉驚問何藥其神如是則金匱腎氣丸也孟舉曰芩連桂附兩者冰炭他人用之兩敗而今則兩以奏功何也豫曰此所謂次第也毒傳脾腎不先解之而驟用薑桂則其焰益張不得已用寒涼救之熱毒既去虛症乃見命門無氣腎將敗矣故急以桂附用之也孟舉曰焉知便痛非毒甚乎豫曰毒甚則必下利仍頻體反加熱矣未有痢止身涼食進而毒甚者故知其非也且毒甚而痛乃火逼膀胱而致則必痛連少腹今少腹反不痛故知其為腎氣寒也孟舉驚案稱善越數日其人正飯與人爭誶復大發熱此木抑土虛而食復也與補中益氣湯熱漸退但不寐左橫骨下堅硬飯食過之俱有礙適有醫者過其門令診之曰傷寒心下痞不當用參朮孟舉問豫豫笑曰渠輩慣誤下人故熟此症豫未嘗妄下故不識也孟舉曰吾固知其非姑舉為一噱耳請問此何病也曰是為肝脹曰得毋抑積停滯乎曰如所言當連右骨下曰飲食不經於肝過之而礙何也曰肝怒則葉張右侵於胃胃虛受侵賁門側寒故礙也經不云乎肝大則逼胃迫咽迫咽則苦膈中且脅下痛肝高則支賁切脅悗為息賁此之謂也乃以加味歸脾湯吞八味丸加補骨脂吳茱萸杜仲等飲之而平其反覆辨症處溯流窮源既極精透其次第用藥處得心應手又甚神奇此等案一出真可拓後學之心胸擴群醫之見解識者諒不以豫言為阿其所好也每驗怒氣易動者最多肝脹一症其左脅骨下痛而有塊扁大如痞實非痞也乃肝葉血燥不肯下垂故也吾友董兩舟夏月搗膏勞力致感頭痛發熱服解表之藥不效其長君方白來問豫豫曰子不觀東垣脾胃論乎服補中益氣加北五味麥冬自愈矣如豫言服之頓安復起作勞仍發熱頭痛別用清解藥增甚豫同葉御生往候之四肢微冷胸腹熱甚煩悶腰墜下少腹脹痛不能小便時旁觀者謂重感風邪所致力主發散豫曰虛邪內郁正以勞倦傷中真氣不足不能托之使盡出又遇清涼其火下逼膀胱責及本藏故然安可攻也請以滋腎飲子合生脈散與之何如御生論與豫合竟投之得睡醒熱解小便通矣留方補之而別翌日方白至云內熱時作煩悶頭痛亦間發不盡去豫曰餘火未散移熱於上也用軟柴胡人參白朮黃連丹皮甘草茯神等而愈不能小便一症除合補中合生脈症外其餘非寒結膀胱即熱逼膀胱所致其辨驗全在少腹如不能便而痛連少腹者為熱少腹不痛則為寒故同見是症而前案以益火取效此案以滋水得功炎上潤下判若天淵互相研究愈見前輩因症制方一線不走之妙未幾其內人亦病感症久不瘳豫用清肝醒脾之藥病解復患瘧用六君子治之不應用補中益氣加半夏治之又不止豫請再診之曰得矣此鬱火為瘧也用龍腦葉貝母黃連丹皮生白朮茯神生芍藥當歸甘草陳皮柴胡即安復用補中益氣湯加黃連數帖遂健如常經云木鬱則達之火鬱則發之加味逍遙散正所以透發鬱火之的劑也然此案不用山梔而用黃連者以山梔屈曲下行不若黃連運用在上尤能達心胃之郁也其復用補中者升木以培土也其又加黃連者左金以平木也前輩臨一症必尋其源處一方必求其當類如此學者須逐案細心參究之吾友徐方虎以妹病召豫病已浹旬矣切其脈弦而數唇焦黑生皮如蝙蝠翅剪去復生齒枯舌黑如炭中起刺狀如焦荔枝殼體熱痰急豫曰此小柴胡症也何遽至此豈服苦寒攻伐之藥耶方虎述病狀曰初病寒熱起月事適至醫用發散未效繼用大柴胡下之利行而病不解舌始燥始痰起填膈又用陷胸加化痰藥又不效熱益甚乃用三黃合犀角地黃湯服之舌始黑唇始生皮煩惋不得臥今當如何豫曰少陽之邪不得上達熱抑在下病及衝任以苦寒逼之火急水爍逆乘於上腎肝竭矣乃投熟地生地各一兩當歸芍藥丹皮茯苓山藥麥冬山萸肉甘草佐之頓安而唇舌症未退豫曰無慮得汗而便即解矣曰前已下而益甚今何言便解也豫笑曰正唯此處須讀書耳遂大進參耆歸術而汗至下黑矢甚夥諸症悉退唯痰尚多舌胎尚有未盡每至夜則煩惋不了了豫曰此衝任病未解也仍用初方加芍藥及桃仁泥各三錢一劑而起據所述病狀云初病寒熱起則知邪在少陽顯屬小柴胡症矣斯時若以小柴胡湯養汗以開玄府使少陽之邪得以上達何至熱抑在下而病及衝任哉即病及衝任經水適來矣不以苦寒逼之而仍以小柴胡湯加歸尾等調之又何至唇焦舌黑變出爾許肝腎陰虧之危候哉然此等處吾不咎若輩之悍於誅伐也咎若輩之昧於審症耳並不咎若輩之昧於審症也咎若輩之誤於讀書耳東莊醫道得力於四明四明於左歸飲條下云傷寒舌黑唇焦大渴引飲此必服攻伐寒涼之藥過多也此方主之今即就此一案一一按其論病處方足見高呂兩家固自心心相印也時方虎病三陰瘧已四年矣幸所治皆武林名醫服藥得法不至潰敗用人參幾十余斤然年久病深至此遂不能支形肉盡脫飲食不進每覺有氣從左脅上衝即煩亂欲脫奄奄幾殆乃重用桂附芍藥地黃加以養榮逐翳之藥冬至日正發期是日遂不至四明治久瘧不愈諸藥不效者以養榮湯送八味丸仍於湯中加熟附子一錢謂十劑必除東莊亦云久瘧用補中益氣不效者八味丸有神應豫每得其力按八味丸乃益火之原以消陰翳者然則案中所謂養榮逐翳者固即祖四明以養榮湯送八味丸之家法也而其愈於冬至日者蓋陽生於子陽回則陰自退舍耳未幾又有適蔡氏妹病感症遣力迎豫時以事滯武林不得往來促數次及豫至則病亟矣方虎道病狀謂此病甚怪攻之不可補之不可調和之又不可真反覆無計豫曰攻法吾可臆度得之請問其補法調法方虎曰始用疏表及降火清痰之劑半月愈甚胸則脹痛用溫膽湯及花粉栝蔞等此調劑也服之嘔逆痰氣反急昨用理中加肉桂延胡索陳皮枳殼香附半夏等此補劑也服之痛結不可忍至今號呼不絶醫謂調補不應治法窮矣豫笑曰所謂補與調和者是耶無論理中湯外加入破氣傷胃之藥反益其痛即理中湯中甘草一味若蛔發作痛即非所宜不記仲景安蛔散去甘草加椒梅乎方虎曰向多蛔結症今補不止無疑矣然則如何余曰吾仍用理中湯去甘草加白芍藥三錢木香五分進之痛減半按其脈細數甚口渴欲飲水不能咽進湯啜吐手足時冷時熱面顴嬌紅不定體如燔炙余曰此邪火內沸怒木乘上五陽火隨之上燔下爍真陰龍雷飛越以藥驅之陽格於外伏陰沍結而致遂將大八味丸作飲與之曰得汗病已黃昏初服藥少頃方虎出曰服藥訖即少睡看面上嬌紅立退為白頃乃索被蓋豫曰俟之至矣及三鼓有老嫗叩門曰此刻熱急氣促煩亂不可言請再進視之豫曰無庸吾欲臥無擾我至黎明起診之脈緊數至八九至豫曰汗已泊矣而虛不能發也急煎人參一兩黃耆白朮當歸白芍五味子甘草為佐飲之汗大至沾席余曰未也次日再服汗又大至通身如雨諸症頓愈方虎曰前之甘草不宜服今兩劑俱重用甘草何也曰初胃中氣血攻竭空虛寒凝故蛔發而痛得甘則蛔愈昂上故不可今得濡潤之藥胃氣衝和蛔頭下伏雖濃煎甘草汁數杯飲之何害哉法不可執類如是也方虎嘆以為精言同此一症耳且同此一方耳他人用之而痛益甚者名手用之而痛即減可見凡方加減俱有精義不可不細講也沈凝芝內人時當就臥忽作寒熱至夜半即不能言喘急醫視之或以為感傷或以為往來寒熱氣逆痰結用烏藥順氣散不效邀豫視之則聲如曳鋸手撒遺溺口開不能言自汗如雨余曰此類中風也已傷臟不可治矣凝芝曰即無救理應用何藥余曰初發即當用易簡烏附子散今無及矣凝芝自進之喘聲忽止且稍發語疑尚可救豫曰五臟俱絶今得參附氣少蘇耳終無濟也果三日而歿甲午館安邑九月間仲弟以痢病誤殺於庸手悲憤交集始究心醫理至冬底十有二日館尚未解而家君復以先母中風遣人走召逮歸時則五臟俱絶與是案所列諸症具見無異矣急煎參附等劑挖而灌之不能挽也翌日酉刻遂歿因思病未見之先與暴發之際豫若在家或有挽回乃以十數金薄資遠館外邑致抱無涯之戚仰天錐心恨何如之每閲此案不禁潸然淚下未幾其側室復病傷寒繼壯熱不止醫疏散之愈甚神情昏憒不寐凝芝恐蹈前轍憂甚豫往診之曰此則感症無妨也然起於勞倦不當重虛其虛即投以參朮等藥得汗神情頓清次用地黃飲子下黑矢熟寐唯熱尚未盡退余曰此甚易事於昨方中加炙甘草一錢如言即安觀者皆以為奇繼以滋腎養榮等藥調理復初汗以參朮下以地黃除熱以炙甘草此等治感症法在病家未有不以用補為嫌旁觀未有不以用補為異即令庸醫見之亦未有不駭然吐舌者然其中有妙義焉蓋感症而起於勞倦則非助正無以托邪也非滋陰無以潤便也非甘溫難以除熱也彼惟不知此義故妄駭以為奇耳姊丈勞仲虎初夏勞倦致感體作寒熱口苦醫用重藥發散之復用山楂厚朴枳實花粉栝蔞半夏之屬攻其中熱益甚痰嗽喘急語言無序豫往診之曰誤矣急止其餘藥重用滋水清金之藥一服而痰嗽漸退神情覺清次日往診脈浮洪而數語急遽而收輕手指時作微脹豫曰此皆虛症也邪未嘗入陽明而先攻之傷其元氣邪反隨而入陽明矣重虛其虛愈不能鼓邪外出今雖稍定夜必發詁妄當急以人參救之適篋中所帶不多止用人參二錢黃耆一兩至次日家人來言夜來甚悖亂不安其勢甚迫似不可救豫曰無妨參力不足故耳時鼓峰在邑豫拉之同往曰汗已至矣何慮為乃用參兩許仍入前藥進之其親友猶議參之與痰喘詀妄相背也豫與鼓峰曰無庸疑吾輩在此坐一刻許待其汗至而別何如衆在猶豫間因出酒食過午舉杯未盡內出報曰汗大發矣是夜熱退痰喘悉平繼用補中調土之劑而起此症與前案俱系勞倦致感則得病之源彼此固無或異也乃其治法則兩不相同何哉蓋前案未經庸手發表攻中則陰液尚未受傷故宜先以參朮補中之劑鼓邪外出此症則發表既多攻中又峻其熱益甚有火得風而愈熾也其痰嗽喘急者陰被劫而益虧也若遽投以參朮補土之劑而不先以滋水清金之藥則陰液必亡而氣自何生汗從何化乎夫藥之後先即關病之生死甚矣用藥者不可不講次第也從子有園丁忽咯血求診視其血鮮紅中間有紫小塊脈之濡澀色白問胸中作惡否曰然時頗作痛直映至背豫曰知之矣用桃仁泥三錢紅花三錢合理中湯加肉桂一錢戒之曰頻服之必有黑血大至待黑盡而鮮者來乃再來告園丁如言吐瘀積數升胸痛即平復再求診則脈圓實矣與以理胃養榮之劑復用填補命門丸子一料全愈治吐血一症大法有三然其要只在胸中辨驗如胸中作惡者乃七情飢飽勞力等因也胸中作痛者乃瘀血抑蓄折上而奔注也若不見噁心不見胸痛而驟湧出者乃傷寒變熱迫竅而出也今案中血見紫塊脈見濡澀則症屬蓄血東莊固已了了而問及胸中又云時頗作痛則其為蓄血也愈明白無疑而去蓄利瘀之劑自宜投之立應矣明村王義方醫學甚明其室人患血症因氣稟怯薄自進歸脾養榮等劑咯血如故痰嗽殊甚邀豫診之脈俱澀滯豫曰據脈論之其血色當見紫黑胸中必有微痛義方曰誠如所言豫曰此蓄血症也遂用此案法治之一劑而血見鮮紅脈見充潤矣仍用歸脾養榮都氣等三十餘劑諸症悉愈附識以見前輩成案俱是後學楷模第變通則在善學耳孫子用久患下血夏末忽滯下口渴不飲食繼而體熱脈洪數余曰若論滯下則諸症皆死候也今在下血之後則不可盡責之滯下當變法治之先用白朮茯苓山藥神麯薏苡仁陳皮甘草等藥強其中以統血次用黃連澤瀉黃芩丹皮等藥以解鬱積之熱後用熟地黃當歸芍藥等藥以復其陰次第進之乃痊開手便用白朮等以助脾則其久患下血者脾虛不能統血也然其人必素多鬱結者郁久則積而生熱故又患滯下耳其實原只一串也彼頭痛救頭腳痛救腳者試從此參之吳辨玉偶患寒熱旋至熱不退胸中作惡豫診之曰此肝鬱而致感也遂用加減小柴胡湯一劑減半次進柴胡地黃飲子豫適欲往旁邑遂留數方與之次日仍用地黃飲子後日用六君子湯加黃芩再後日用補中益氣湯加黃芩調之且戒之曰明日若尚有微熱在內則後日須再用地黃飲子一帖而後用六君子此後皆有次第不可亂也辨玉因服地黃飲子覺熱已退盡遂意用補中益氣湯一帖是夜即煩熱不安辨玉曰用晦言有次第果不可紊仍用地黃飲子即安然後依次服至第三日再用補中益氣湯泰然得力矣時豫尚未歸辨玉覺病後煩怒易動體時虛劣與友人商之言今可改用歸脾湯矣如言服之豫歸診之曰今脈已無病但夜寐不著耳辨玉驚曰正苦此奈何豫曰當用加味歸脾湯辨王曰今已服此方而未效何也豫曰君試服我歸脾湯白愈矣一劑而鼾睡達旦閲此案愈見處方必有次第其序不可稍亂然方以立法法以制宜則方中之分兩須有圓機焉必當相所主以為輕重也方中之加減皆有妙義焉必當參兼症以為出入也豫於是編但列某方某藥及加減法而不填注分兩者非敢略也意正為此耳杭人沈禹玉妻夏月發寒熱迎邑醫治之則以為瘧也時月事適下遂淋漓不斷醫又以為熱入血室用藥數帖寒熱益厲月事益下色紫黑或如敗醬醫且云服此藥勢當更甚乃得微愈耳其家疑其説請豫診之委頓不能起坐脈細數甚按之欲絶問其寒熱則必起未申而終於子亥豫曰此鬱火虛症耳因出彼藥示則小柴胡湯也彼意以治往來寒熱兼治熱入血室也又加香薷一大握則又疑暑毒作瘧也豫不覺大笑曰所謂熱入血室者乃經水方至遇熱適斷不行故用清涼以解之今下且不止少腹㽱痛與此症何與而進黃芩等藥乎即灼知熱入血室矣當加逐瘀通經之味香薷一握又何為者豫用肉桂二錢白朮四錢炮薑二錢當歸芍藥各三錢人參三錢陳皮甘草各四分一服而痛止經斷寒熱不至五服而能起惟足心時作痛此去血過多肝腎傷也投都氣飲子加肉桂牛膝各一錢而全愈使卒進前藥重陰下逼天僵地坼生氣不內水泉冰潰不七日死矣乃云更甚方愈夫誰欺哉庸妄之巧於脫卸而悍於誅伐如此夫以小柴胡湯治往來寒熱兼治熱入血室彼且以為見病治病藥甚對症矣乃寒熱益厲月事益下直非對症者蓋其所為治病者本非其治其所為見病者實未嘗見耳案中辨駁爽快分明每讀一過心胸為之一拓桐鄉朱綺崖文戰苦久得補餼臨闈適丁內艱哀毀憤郁幾不自勝旋又以內病憂勞百感致疾初發寒熱漸進不解時方隆夏醫進九味羌活湯不效又易醫大進發表消中之藥凡狠悍之味悉備雜亂不成方三劑勢劇又進大黃利下等物下黑水數升遂大熱發狂昏憒暈絶湯水入口即吐其家無措試以參湯與之遂受垂絶更蘇次日豫至尚潰亂不省人事承靈正營及長強俱發腫毒時時躁亂診其脈數而大豫曰幸不內陷可生也遂重用參耆歸術加熟地一兩許時村醫在坐欲進連翹角刺等敗毒藥且力言熟地不可用其家從豫言進藥是夜得臥次早神情頓清謂豫曰吾前競不解何故臥此今乃知病也心中如夢始覺矣又次日脈數漸退煩躁亦平但胃口未開腫毒礙事旬日未便豫曰守服此諸症悉治因留方及加減法且囑之曰毋用破氣藥以開胃苦寒藥以降火通利藥以起後敗毒藥以消腫有一於此不可為也出邑晤陸大勝云兄功效及用藥已聞之矣但邑醫議用黃耆熟地將來必發癍果否豫曰學術膚淺初不知二藥能發癍於是恨張劉李朱諸名家之論猶未備且恨東璧綱目一書如許大疏漏也大勝為之鼓掌因問綺崖病狀豫曰七情內傷而外感乘之傷厥陰而感少陽從其類也醫不問經絡而混表之三陽俱敝矣然邪猶未入府也轉用枳實厚朴山楂栝蔞之屬而邪入二陽矣然陰猶未受病也用大黃玄明粉而傷及三陰矣究竟原感分野之邪不得外泄展轉內逼中寒拒逆勢將大壞幸得參扶胃氣鼓邪外發其發於承靈正營者仍本經未達郁怫之火也其發於腰俞長強者乃下傷至陰凝沍而成也大勝曰諸醫方攻前參湯之為害而歸功於清解今方將用清火消毒之藥耳豫曰若輩烏能知此毒之得發者參之功也今毒之麻木未塌將來正費調理者乃若輩清解之害也急服參朮庶得起發收功若再清火消毒毒仍內陷不可救矣乃如言守方服之而愈其囑咐周匝處可為瘍科藥石其辨駁透快處可為粗技針砭至其敘論病情處因流以溯源其間陰陽內外經絡穴道分晰曲盡與四明治發背一案洵稱合璧細玩此案則此症一線生機全在參湯一試得以鼓邪外出發為腫毒而不內陷耳庸技反為害事而歸功於清解煞是可笑時綺崖弟患左眼痛連腦醫以頭風治之不解初時發寒熱後遂壯熱不止豫診之曰火伏於內風燥泉涸木乃折矣非得汗不解也或曰汗須用發表藥獨非風燥乎且發汗藥須擁被悶臥乃得身熱甚苦此奈何豫曰庸醫汗藥皆屬強逼故須擁被悶臥然而汗不可得也豫藥非此類雖薄衾舒體時雨自至豈能消遏哉乃用龍腦白朮飲子夜分大汗淋漓次日頭目爽然矣龍腦白朮飲子無從考核有謂即趙氏加減逍遙散亦未知是否然按其案中所列症議則其治法必不出木鬱達之火鬱發之二義而其方意亦可意會矣四明東莊兩家其活人之奇驗傳聞於人口者不可殫述是編所集計共五十八案則尤擇其名言創論闡發軒岐理奧奇功異績開拓後學心胸無一不足以為天下後世法者也識者逐案研究則其間診法之神驗症之精處方之當應自得之而吾大兄所以公世之心亦不無小補云爾同懷弟鹿鳴謹識
