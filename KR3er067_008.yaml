body:
  text: 卷八西塘感症下感症兼病本是感症而兼有他病丹溪先生所謂雜合病也其治之即當稍變感症成法矣用載之篇末以成一家之言挾食如挾飲食噯氣酸臭飽脹者初起平胃散二陳湯主之見風症者配發散藥一二味如升柴薄荷葉太陽症見者加羌防恐太燥去蒼朮見熱症者配酒芩連口乾者合白虎作嘔者加厚朴如經發表多而壅熱通紅氣粗脈牢實神思昏沉胸前按之微痛者視其微甚用逍遙散加熟地四五錢至一二兩或本方合小柴胡平胃散蒼朮米泔浸炒厚朴薑汁炒陳皮甘草各等分二陳湯半夏制茯苓陳皮甘草各等分加生薑大棗挾痰如見鼻塞頭痛發熱或中脘痞滿嘔逆噁心或痰飲凝積者參蘇飲主之參蘇飲前胡佐葛根臣半夏制臣茯苓臣陳皮臣甘草佐枳殼麩皮炒佐桔梗佐蘇葉君人參君木香使生薑引大棗引人參木香二味進退用之見陽明症者合白虎內傷有一種內傷元氣不足之病其人必元氣素弱或作勞辛苦或因飢餒受虧或因色欲過度外症身熱自汗體倦手足心熱忽時作寒口不知味出言懶怯脈虛大無力者補中益氣湯主之有一種大虛致感先以歸脾飲補之待虛回後清邪補中益氣湯人參黃耆當歸白朮廣皮甘草升麻柴胡加生薑大棗此方俱用輕劑分量極少總看病之微甚為藥之多寡可也六要黃耆一錢人參病甚者一錢炙草五分或七分歸術各七分陳皮五分升柴二味酒炒各三分多汗蜜拌炒此方如氣血大虛者參耆朮歸草可加至數錢之多不可拘泥見頭痛項強太陽症者配羌防挾飲食者配朴半往來寒熱者配黃芩熱甚者合白虎病久虛而邪不得汗解者配益母草紅花酒芩連舌胎乾燥黃焦熱甚挾虛而津液不得上行者本方合白虎歸脾飲人參君黃耆臣蜜炙茯神臣白朮臣甘草臣棗仁炒研臣當歸君遠志佐龍眼肉使煨姜引大棗引挾火者配黑山梔牡丹皮甚者配酒黃連名加味歸脾飲中暑有一種中暑症自汗背寒面赤面部必通紅紫脹眼白必黃或兼頭痛氣粗發躁狂亂審知陽明的確用白虎湯倘脈不洪大無消渴恐白虎湯難投如脈洪消渴悉見當有背寒目黃亦宜桂枝白虎或加蒼朮可也否則不如東垣清暑益氣為穩濕溫有一種頭痛妄言兩脛逆冷胸腹滿多汗其人常傷於濕因而中暑名曰濕溫其脈陽濡而弱陰小而急治在太陰不可發汗白虎加蒼朮湯主之保命云立夏之後至立秋處暑之間傷寒者身多微涼自汗四肢沉重謂之濕溫蒼朮石膏湯主之即白虎加蒼朮湯或先用人參白虎數劑濕溫一症極不易治清之則邪益陷燥之則津即槁補之助桀為虐必糾纏生變耳近代溫病條辨之三仁湯法極精妙蓋專究三焦立法較白虎蒼朮六經法更勝一籌矣蒼朮石膏湯蒼朮佐石膏君知母臣甘草使中寒如夏月坐涼亭水閣高堂大廈中縱食瓜果生冷亦能中寒不可泥於盛夏禁用熱藥也附子理中湯大順散冷香飲子並皆佳妙有夏月因勞役飲食失節又傷冷飲得疾右三部沉細而微太陰症也左三部微浮而弦虛陽在表也身體沉重四肢逆冷自利清穀引衣自覆氣難布息懶於言語此脾受寒濕中氣不足也法當用四逆湯但內經有用熱遠熱之戒是宜從中治中治者溫之也錢氏白朮散加升麻主之一再服後利止身溫神出可用異功散治中湯辛溫之品二三劑附子理中湯附子臣人參君白朮臣乾薑炮佐甘草炙佐生薑使大棗使錢氏白朮散人參君白朮君茯苓臣甘草炙臣藿香葉佐木香使葛根佐治中湯陳皮佐青皮佐人參君白朮臣乾姜炮使甘草臣直中三陰有一種色欲過度腠理疏豁寒邪乘虛而直入於三陰之經名曰陰症乃初起不見熱症暴病也所謂直入陰經者乃心肝脾肺腎之經受肅殺嚴寒之氣由肌肉間之經絡直逼臟中或心或肝或脾或肺或腎生氣被傷不得通達便成陰症也此時急以熱藥依經通之漸漸溫熱使臟中熱氣得通於肌肉間之經絡也須以理中湯四逆湯真武湯等類辨症治之有一種陰症直入腎少陰之經欲事後感寒或多欲陽虛寒乘虛入臍腹絞痛手足青紫厥逆脈微欲絶急煎附子理中與之外用蔥一束如茶盞大扎緊切一指厚一段置臍上以尉斗火尉之熱氣透入腹逼邪外出為佳真武湯附子臣茯苓臣白芍酒炒佐白朮君生薑使四逆湯甘草炙臣乾薑佐附子君病甚者用重劑戴陽有一種戴陽症兩顴淺紅紅必遊移無定或煩躁發狂欲坐臥泥水中渴欲飲水復不能飲大便自利或祕結小便清白或淡黃咽喉或痛或不痛脈沉遲而微細肌表雖熱重按之則不熱甚者其冷透手此陰盛格陽也又有面紅煩躁遍舌生瘡生刺舌斂縮如荔枝狀或痰涎湧盛喘急小便頻數口乾引飲兩唇焦裂喉間如煙火上攻兩足心如烙脈洪大而數無倫按之有力亦有按之微弱者捫其身烙手此腎虛火不歸經素問所謂脈從病反者也俱用十全大補湯吞八味丸或大劑八味飲合生脈散人參熟地可用至二三兩附子可用至三五錢如認作白虎立死十全大補湯黃耆蜜炙肉桂四君四物八味丸即六味飲加附子肉桂感症似瘧有一種瘧疾秋後晚發不論間日一日熱多寒少或獨熱無寒或寒熱相半勢沉重者總當以治感症之法治之大抵不外陽明少陽二經感症似瘧痢有瘧痢交併勢來暴甚者亦當從感症治急清陽明毒自解矣內傷感熱似痢有勞倦內傷人夏月感熱身如燔炭下利膿血譫語舌燥而黑脈洪數無倫甚者脈散亂忽有忽無此陽明危病也急用熟地一兩生地麥冬當歸白芍甘草枸杞佐之服後須微微見汗乃可治脈亦須接續分明洪數鼓指又必即前方去生地加棗仁山藥山萸肉丹皮連服七八帖俟其脈斂而圓乃可用四順清涼飲子加大黃五錢熟地一兩歸芍各三錢甘草一錢下其黑矢而愈若一二日後復發熱狂詀喘急口渴此欲作汗解也投耆朮各一兩歸芍乾薑各三錢甘草一錢其汗如注而霍然矣或曰陽明熱甚當速解其毒今先補後下何也曰毒火燔熾涼膈承氣症也而其原起於勞倦陽邪內灼脈已無陰若驟下之則毒留而陰絶死不治矣曰復病又以他藥治何也曰病從陽入必從陽解今陰氣已至而無以鼓動之則榮沖不洽汗無從生不汗則虛邪不得外達故內沸而復也瘟疫初起宜辛涼解散次則和解解毒必里症全具而脈實舌燥口乾心下堅滿方可攻下若飲食在胃脘中未曾腐熟糟粕未成雖芩連栝蔞等俱不可用況硝黃乎恐變結胸故也荒歲多疫皆因飢飽不時所致右氣口脈多大用人參敗毒散先發其表次用人參柴胡湯以和解右脈大於左自汗心下不脹無表裡症見者補中益氣湯若用正傷寒法大汗大下多致殺人疫病當分天時寒暄燥濕病者虛實勞逸因時制宜不可拘泥如久旱天時多燥熱疫流行忌用燥劑宜解毒潤燥天久淫雨濕令大行脾土受傷民多寒疫多兼瀉利忌用潤劑宜滲濕理脾又有一種全家長幼相傳染頭痛發熱乃天行時氣重即疫癘也亦系陽明熱病治法當與感症參時毒時毒者感四時不正之氣初發狀似傷寒五七日間乃能殺人十日外不治自愈診其脈滑數浮洪沉緊弦澀皆其候也浮數者邪氣在表宜發之沉實者邪氣在裡當下之此症有陰有陽有可汗有可下常見粗工但云熱毒驟用寒涼不知病有輕重治有逆從豈容輕忽也寒涼不可輕用頭面耳項腫赤痛甚惡寒口渴大便閉澀脈數實者表裡俱實也防風通聖散主之無表裡症或已汗下腫不消者小柴胡加酒連連翹玄參薄荷桔梗鼠黏子天花粉和解之腫甚焮痛汗下不消宜砭去惡血內服解毒藥勢不可散欲膿脈弱不潰宜托裡饑年傳染先因胃虛飲食不節邪乘虛入宜從輕治發散解毒必加人參以固元氣病頤頷腫者即俗名蝦幕瘟是也又名曰痄腮先用敗毒散微汗之次以酒芩連黃連非熱甚且緩之梔芩足矣玄參薄荷連翹甘草桔梗升麻鼠黏子頻頻緩服大便實者加熟大黃此法即非流行凡遇見此症用之自效大抵熱不止不可便與穀食恐助邪熱也脈虛無停滯者不禁荊防敗毒散羌活臣獨活佐前胡佐軟柴胡臣川芎佐枳殼佐茯苓佐荊芥臣防風君上加人參甘桔去荊防名人參敗毒散立齊加玄參牛蒡子防風通聖散白芍臣防風君當歸酒洗臣川芎佐滑石臣石膏君芒硝使桔梗佐荊芥佐麻黃佐薄荷使甘草臣梔子焙臣大黃煨使白朮君連翹臣黃芩佐生薑使普濟消毒飲泰和間民病疫癘初覺憎寒體重次傳頭面腫盛目不能開上喘咽喉不利舌乾口燥俗云大頭天行諸藥罔效明之云身半以上天之氣邪熱客心肺之間上攻頭面而腫須用下藥大頭天行濕熱為腫木盛為痛濕熱從陽明木盛從少陽陽明為邪首大腫少陽邪出於耳前後黃連佐黃芩佐人參臣桔梗佐生甘草佐陳皮佐元參君連翹臣板藍根使馬勃使鼠黏子焙研殭蠶炒二味臣升麻使柴胡臣上為末半用湯調時時呷之半用蜜丸噙化服盡良愈或加薄荷川芎當歸㕮咀每服五錢水煎時時稍熱服之如大便硬加酒煨大黃一錢或二錢以利之腫勢盛者宜砭刺之消毒托裡散治時毒已經汗下解毒不消勢欲成膿未成即消已成即潰黃耆鹽水拌炒人參二味君白朮臣茯苓臣當歸臣芍藥佐川芎佐甘草臣金銀花佐白芷佐水煎分瘡上下食前後服之妊娠傷寒按準繩六經治例與平人同但初起即須合四物或加白朮黃芩使熱邪不能深入血分以觸犯胎氣為異耳又滑潤如半夏滑石之類行血如肉桂附子之類破血如桃仁牛膝丹皮之類攻下如大黃芒硝之類俱宜慎之愚按治感症大法總以始終照管胃中津液為第一奧旨蓋邪之所感皮毛閉塞氣不外達鬱而成熱熱積皮毛不解漸而肌肉熱矣漸而各經絡無不熱矣漸而熱氣皆壅塞陽明腑中熱矣此必然之勢也又況後代血氣未衰早御酒肉厚味胃中素有濕熱者多一旦客熱交併區區陰津幾何能當此烈焰燎原乎凡感症之死皆由胃汁乾枯是以古人立法及其邪之在表血氣未傷之時當汗汗之所謂開鬼門也欲熱從汗解則清寧安固而血氣全保不傷矣當其邪之在裡血氣漸虧之際可下下之所謂潔淨府也欲熱隨便通則焦灼頓除而氣血可徐俟其來復矣其有血氣素虧之人三四五日之後不論表症解與未解里症急與不急一見口乾唇裂舌胎焦黑燥硬全用滋養清涼虛甚者並涼藥弗用純陰重劑加人參數錢升發運用但救得胃中津液不竭其人必不即死及其津液漸充汗自能來宿物自下至所謂胃中之津液非他即周身血氣所化積疊胃底此後天之本也凡人平日之強弱及遇外感賊邪之難治易治可治不可治強半憑此粗工不知無論新久虛實表裡苟見身熱風藥混表一覺悶滿攻中破氣雜投不效大黃枳朴繼進必求一便以畢其技能豈慮熱得風而益熾陰被劫而速亡二語是感症致死根苗何其與先賢之意適相反哉茲所集說先後緩急不爽輕重攻補適宜而大旨所在總始終照顧陰津以為勝邪回生之本二語是感症治法主腦學者由此更遍參先賢之書以盡其精微極其變化則感症之道備而於他症亦思過半矣東莊批醫貫云當看傷寒論原本及樓全善綱目近日喻嘉言尚論篇亦有發明此篇與張景嶽皆本薛新甫並宜參究不可求簡捷守一說以誤世西塘感症者即廢翁董氏所輯入門淺見也是書原本樓氏綱目折衷損庵準繩而又參以四明東莊兩家每祖此以救傷寒危症無不立應家藏此書經歷既久積驗甚多家大兄因與四明心法東莊醫案匯為一編細加評點不敢私之篋中謹必諸同好同懷弟蜚鳴謹識
