body:
  text: 卷六西塘感症上感症總論感症即所謂傷寒症也古人以霜降以後春分以前直感寒邪者名之為傷寒觀此愈見春變為溫夏變為熱之說之謬矣今統四時通行之症言之謂之感症大抵邪之所感必先皮毛而後經絡由經絡而入臟腑由絡傳經由經入腑須分看然按內經所指為臟及諸方書所稱為腑都言胃耳全書大旨所重惟此蓋六經經也在肌肉之中東莊云肌肉不能傳變肌肉之中皆經絡也經絡皆謂之中里則腑臟表則皮毛腑臟之氣血惟經絡傳達外邪之壅熱亦惟經絡傳變故陽明少陽皆從中治中者經病非胃與膽病也經病用和解和解亦必由汗散然非開發皮毛之法矣蓋邪初客表經中陰津未傷但啓其竅而汗自通及熱傳中經血液燔爍竅雖啓而汗為熱隔不能達外庸工不知尚用風熱之藥以發其表益助熱而耗陰津原乾涸究竟不得汗而斃者多矣仲景和解只清解熱邪而津液自存陰汁既充湧出肌表而外邪自然渙散此養汗以開玄府與開玄府以出汗之迥乎不同也膀胱胃膽脾腎肝腑也臟也在軀殼之裡玄府閉塞本身之熱壅遏經絡以漸入里而諸經之井榮俞經原合各有交接之處由是自太陽而陽明由陽明而少陽而太陰少陰厥陰矣此傳經之次第也東莊云太陽經在最外一層故邪入皮毛即先傷之皮毛不能傳變由太陽之絡傳經而後內入諸經也邪客於皮毛即玄府閉人身臟腑之氣無刻不與外氣通故和暢玄府閉則內氣不能泄而生熱非風寒能變熱也此時但發其皮毛玄府開而邪隨汗散矣麻黃桂枝汗皮毛之方非解中之方也表不解則熱積而日甚從本經反而之內及各經井榮俞經原合交會之處則熱交於他經而各經病見矣注中邪客於皮毛即元府閉九字當移接和暢下使人讀之一氣貫通尤覺醒亮顧當其傳經也井榮俞經原合之中邪氣鬱勃既不得從玄府透達則必向里而走空隙而十二臟腑之中惟胃為水穀之海其上有口其下有口最虛而善受故六經之邪皆能入之邪入則胃實矣胃實則津液干矣津液干則死矣數語道盡感症致死根由彼肆用劫風燥液之劑天人生命者只坐不知此義耳然閲此自應悔從前之誤而急思變計矣胃為五穀之海六腑之大源又主肌肉而陽明行氣於三陽主乎津液旨哉斯言經所云陽明中土無所復傳是也故傷寒書所稱臟腑皆專指胃而言非兼指膀胱膽脾腎肝而言或曰傷寒有膀胱膽脾腎肝氣絶而死者何與曰此乃熱邪從本經絡逼入如少陰經邪盛直逼腎臟因致水竭是也非傳經之謂也然如此者亦絶少總之傷寒無膀胱傳胃胃傳膽膽傳脾脾傳腎腎傳肝之法也此處學者宜深考又傷寒之症有陰陽表裡之不同人之感者有虛實新久之各異而病之見也有本症變症兼症之殊致今將傷寒本症列於前變症次之兼症又次之而一症之中又分攻補之兩途以便業是科者之觀覽焉感症本病太陽以下正治法也養陰以下從治法也太陽症初起一二日內凡遇頭痛惡寒項強脊痛四肢拘急身大熱脈浮而緊者是太陽表症也九味羌活湯主之不解即當用清解藥兼陽明以治一二日屬太陽症乃仲景示以規矩準繩耳不可板定日數若照此脈症見端即過旬日仍太陽症也不必拘泥猶疑九味羌活湯羌活君防風臣細辛使白芷君蒼朮臣川芎佐生地君黃芩佐甘草臣薑蔥水煎通身得汗愈上方去細辛蒼朮加黃耆白朮名加減沖和湯治傷風自汗惡風脈緩者太陽兼陽明症火盛者大白朮湯主之或涼膈去硝黃合白虎加升麻柴胡主之涉虛者更合當歸黃耆天熱症熱者桂枝石膏湯主之天熱症熱則人之一身血液燔爍陰汁易干不得以風燥劫之石膏湯主之梔子升麻湯主之升麻湯下當加亦字傷寒心法云見今世甚少太陽症蓋胃為萬物所歸熱邪最容易逼入故有不傳少陽及三陰之傷寒必無不犯陽明之傷寒所以治法在二三日內無論汗出不徹如汗出只在頭面或半身以上或發汗不得或未經發汗但見口乾煩悶縱有太陽表症亦是邪漸入府此時急屏風藥惟宜清解以存津液陰汁既充則汗自湧出肌表而解所謂金令一行酷熱頓散也勢甚者白虎湯加芩連柴葛嘔者加薑製厚朴大白朮湯和解四時傷寒混解六經不犯禁忌四時六經傷寒豈有一方混解之理似此等說一出則混行發散之禍又從此起而肆用寒涼之弊更自此開矣不無可議白朮君石膏君羌活臣防風臣川芎佐枳實佐黃芩佐知母臣白芷臣細辛使甘草使上為末每服半兩水煎大溫服未解再作春倍羌活夏倍芩知季夏雨霪倍芷術秋加桂枝五錢冬加桂枝八錢或一兩桂枝石膏湯桂枝君黃芩佐梔子佐升麻使葛根君白芍臣生薑引石膏君甘草臣此方夏至後代桂枝症用若加麻黃半兩可代麻黃大青龍症用也上每服五錢得汗停後服石膏湯石膏君柴胡臣白芍臣黃芩佐升麻使甘草佐上㕮咀每服五錢水一盞半豉一合煎八分熱服如三五服後當加未解二字加知母一兩又未解加大黃一兩梔子升麻湯生地君梔子臣升麻使柴胡臣石膏佐上每服五錢水煎頓服不解更作白虎湯石膏君知母臣生薑使粳米佐甘草佐陽明表症一二日後或初起症見目痛眉骨痛鼻乾不眠者此陽明表症也邪在經升麻葛根湯主之升麻葛根湯升麻臣葛根君赤芍佐甘草使上加生薑三片大棗二枚如見口渴煩躁脈洪實者去赤芍合白虎湯加柴胡一錢酒炒黃芩去瓤連翹各錢許胸膈脹悶者配薑製厚朴酒炒黃連各一錢小便不利或短澀或便時覺熱與痛脈洪弦者合益元散或導赤散益無散滑石六倍甘草一倍上甚者每服三錢輕者每服二錢導赤散生地君黃芩佐木通佐甘草臣上一方用黃連使一方無黃連有淡竹葉少陽症一二日後或三四日內耳聾脅痛嘔吐或寒熱往來脈弦長者少陽症也小柴胡湯和解之小柴胡湯柴胡君黃芩佐人參君半夏臣甘草臣生薑引大棗引脈不虛者去人參此方之妙全在參甘兩味養汗以開玄府猶之參蘇飲之人參助肺氣以托邪桂枝湯之甘芍和營血以發衛補中益氣之參耆助升提以散表均與補虛之義無涉若謂脈不虛者去人參則此方之人參似為補虛而用矣每見粗工遇病不辨內傷外感陰陽表裡輒曰小柴胡湯及至處方盡乘成法不過用得方中柴胡黃芩半夏幾味耳其於仲景和解之本旨不幾隔靴搔癢乎西塘此法蓋為火盛不宜火浮不宜者而立殊屬精細然彼離法任意妄自加減而失制方本意者反得執是以繩矣故核論之少陽主三陽之樞邪入其經汗吐下三法皆在禁例然則邪何以祛之必轉其樞機俾此經之邪從陰來還之於陰從陽來還之於陽以分潰也然轉樞機必賴中氣健運中氣健運其資於人參甘草乎見口乾或舌燥者去半夏加花粉半夏燥而花粉則潤矣此兩味卻加減得甚妙膈脹者配朴連煩渴者合白虎心胸滿悶者合小陷胸湯俗醫一見心胸滿悶便呼為結胸便與桔梗湯有頻頻與之反成真結胸者殊不知結胸乃因下早而成未經下者非結胸也乃表邪傳至胸中未入於腑症雖滿悶尚為在表正屬少陽部分半表半裡之間宜用小柴胡湯對枳殼桔梗如未效則以本方對小陷胸湯一服豁然其效如神桔梗湯固謬猶有開提之義吾見世之治此症者動用重降里藥不一而足意謂滿悶必破之墜之則寬殊不知胸膈主天之分清氣所居散邪必宣之升之乃因勢利導之旨今之醫者昧此多矣陽明裡症四五日後痞悶煩熱口渴或譫語狂妄錯亂或連日夜不得假寐者此正陽明病也邪已入腑涼膈散主之涼膈散梔子君黃芩臣連翹臣薄荷使大黃佐玄明粉佐甘草使邪熱甚者配黃連解毒湯小便祕或傷暑者合益元散恐傷血分配生地當歸丹皮血藥一二味黃連解毒湯黃連君黃柏臣黃芩佐梔子使太陰症凡從陽經傳陰經者不作陰症仍從陽經中治見腹脹滿咽乾自利脈不浮而沉數者太陰症也柴苓湯備參如腹滿有燥屎者加減大柴胡湯調胃承氣湯柴苓湯柴胡君黃芩佐半夏臣人參君豬苓佐茯苓臣澤瀉佐肉桂此味宜刪甘草使加減大柴胡湯柴胡君黃芩佐枳實佐玄明粉使生地臣麥冬臣丹皮佐栝蔞霜臣花粉臣首烏君甘草使生薑引大棗引調胃承氣湯大黃君芒硝臣甘草佐病在中焦則有燥實堅三症故不用枳朴以傷上焦虛無氤氳輕清之元氣也少陰症見舌乾口燥脈沉數有力而洪者少陰症也黃連解毒湯白虎湯小陷胸湯大柴胡湯選用小陷胸湯邪傳心下未全入胃用此以瀉心下之邪半夏君黃連佐栝蔞臣生薑引大棗引大柴胡湯表邪未淨里症又急不得不下只得以此方通表裡而緩治之酌量輕重下藥柴胡君黃芩臣半夏臣赤芍使枳實使大黃君生薑引大棗引厥陰症脈愈沉數舌卷陰囊縮煩躁脹滿腹堅痛者厥陰症也三承氣湯量輕重用大承氣湯大黃君芒硝臣枳實佐厚朴佐甘草使生薑引大棗引大熱結實用之乃三焦俱受病痞滿燥實堅全見枳實去滿厚朴治痞此二味治無形氣藥也大黃瀉實去熱芒硝潤燥軟堅此二味治有形血藥也仲景原方只此四味按仲景大承氣湯原無甘草至宣明三乙承氣湯用枳朴硝黃甘草生薑而甘草分量倍於上四味六要方又加大棗經云轉藥孰緊有芒硝者緊也故三承氣湯惟大承氣為最緊若倍加甘草又加大棗甘以緩之則與急下之以承真陰之氣之意相馳矣小承氣湯大黃君厚朴臣枳實佐病在上焦則為痞實前方去芒硝者恐傷血分之真陰謂不伐其根也東莊云熱既入里離表已遠驅出為難故就大便通泄其熱從其近也得汗而經熱從汗解非汗為害而欲劫之也便矢而腑熱從矢出非矢為難而欲攻之也醫不察此專與糟粕為敵自始至終但知消克瀉下之法禁絶飲食惟求一便矢以畢其能事夭人生命如是者曰矢醫養陰法按承氣三方俱仲景成法所謂急下之以存真陰知此意則知宣明之倍甘草六要之加大棗均失仲景本旨矣不使胃中血液為實熱之邪燔灼枯槁而死此先賢至精至妙之旨也但人世腸胃脆薄者多血氣充實者少倘審之未的或至誤投一下之後變症蜂起卒致不救粗工殺人往往因此所以後賢師古人之意變古人之法凡審其人病系實邪而質非強壯脈不牢固者概用滋陰補水之劑不離仲景存津液三字範圍而法之穩當過之如甘露飲四物湯六味飲貞元飲或左歸飲去茯苓加花粉俱速效濃煎頻進令胃中津液充足實邪自解陰氣外溢則得汗陰血下潤則便通開鬼門潔淨府兩法只一養陰法兼之其無窮之利當與東垣法並垂萬世奏效雖遲實稱穩當此乃仲景功臣不可不知也凡發熱覺脅痛耳聾口乾此屬實邪不清也逍遙散去白朮廣皮加生地丹皮酒炒芩連與之二三劑不應即屬火燥改用養陰藥疏肝益腎湯虛者加人參或歸脾飲加柴胡白芍有熱甚而痛及手足頭面似覺腫起此火燥生風風淫末疾屬少陽陽明不必俟其汗後當即以生金滋水飲加柴胡黃芩與之或滋水清肝飲加熟地一倍為主禁用寒涼藥甘露飲生地君熟地君天冬臣麥冬臣枳殼使茵陳佐黃芩佐石斛臣甘草臣上加枇杷葉刷去毛蜜炙虛甚者去茵陳枳殼並黃芩石斛重加人參豫每遵此法以救胃陰枯竭者神應四物湯地黃君當歸臣白芍佐川芎使上邪熱甚者去白芍燥熱者去川芎六味飲熟地君山藥臣萸肉臣丹皮佐茯苓佐澤瀉使若邪熱勢甚脈不大虛舌胎乾燥口渴甚者以此三方為主加酒炒芩連欲邪達經絡者合小柴胡或白虎湯虛者加人參虛而邪甚者合人參白虎邪冒心胃見譫語狂亂者合益元散加牡丹皮輕者合導赤散疏肝益腎湯凡胃脘痛大便燥結者肝血虛也此方主之柴胡君白芍臣熟地君丹皮佐山藥臣萸肉臣茯苓佐澤瀉佐生金滋水飲凡傷寒熱退後有易補之陰有難動之陽皆當以此養之其見症或汗後煩躁未除口渴微熱大便艱澀小便短赤人參君麥冬臣當歸臣白朮臣生地君丹皮佐白芍佐甘草使滋水清肝飲熟地君山藥臣萸肉佐丹皮佐茯苓佐澤瀉使柴胡臣白芍臣山梔使棗仁佐歸身臣先生批醫貫云鼓峰造滋水清肝飲取地黃丸之探原而不隔於中取生地黃湯之降火而不犯於下真從來之所未及然則方意亦可類推也先生醫案治一婦人詳方意與所論頗合疑所謂滋水清肝飲大略如此故附録之以備參考即治吳維師內一案生地黃湯生地君白芍臣川芎佐當歸臣梔子使黃芩佐黃連佐防風使上方一名生地黃黃連湯先生批云此方與地黃丸有未合者豫用陽明陰藥治之甚效考邯鄲遺稿中有清肝滋腎湯與東莊治吳維師內一案所用之藥不差一味然則四明所謂滋水清肝飲即養葵所謂清肝滋腎湯也東莊乃以此方為鼓峰所造而云從來未及豈兩家制方不謀而合與抑以邯鄲遺稿未經付梓故雖以博極群書之東莊亦未之見而云然耶驗舌存津液法凡風寒所感邪鬱於內非汗不足以解原汗乃胃中津液也故傷寒書中最要緊關頭在存津液三字至熱鬱於內則津液亡矣何以能助其汗乎今立五法以治內傷而熱病一症無遺義矣五法不單是治內傷其專舉內傷者以凡屬外感皆本內傷也然不若云今立五法以存津液而熱病一症無遺義矣語意尤圓而該一驗其舌胎白如刺此肺病也生脈散加生地白芍當歸黃耆甘草柴胡黃芩以生金滋水治法匯云脾熱則滑而胎脾閉則白胎如雪東莊批云二句不論內傷外感皆以脾滑閉論皆以脾滑閉論句恐未能該內傷外感閲者宜審一舌胎黑滑此腎氣凌心用八味飲黑燥用六味飲以救腎陰無論黑白紅黃皆當辨其燥滑若何分治一舌黃胎補中益氣湯加黃芩或黃連以補土生金如有食去黃耆加厚朴白朮不可去且發其汗縱有食不顧也中氣虛者必黃而濕有食者必滿舌黃胎若舌胎下半節黃膩濕潤者乃陽明熱邪將盡未盡並非積滯而有黃膩胎也宜甘露飲加丹皮歸芍等萬不可消導滲利以竭陰液慎之又有一種最薄黃胎如漆在舌上者雖宜清火必用參朮補正為主若一味清火必至氣脫而斃不可不明一舌覺轉動不活防其卷也逍遙散加黃芩丹皮生地以滋水生肝一舌鮮紅此心經病也六味飲合生脈散以滋水清火凡舌上無胎如去膜油豬腰子者名鏡面舌不治以其陰津虧竭故也又舌胎雖有而乾燥者可慮恐陰液竭也不可視為泛常須切記之凡內傷外感寒熱之分皆從舌胎顏色為準如黑而滑者乃腎氣凌心用八味飲如枯黑不潤澤者用六味飲其人必兩顴遊紅一劑戰而汗愈東莊之治徐蘋村先生是也如白而加黃黃而加黑此腎凌脾須治中宮如補中益氣之類腎乃北方玄武之色故屬黑且火位之下水氣承之水來救母若此時泄火火無從泄助子以救母則仇未有不復者也亢則害承乃制其理昭然火亢則刑金水氣承之則火乃制此亢則害承乃制之說也各臟腑反覆相循可類推之如是灰色指甲刮下無渣汁者方是火症乃芩連之對症也若腎氣凌心而用芩連則舌上現出人字紋必死黑而不滑則腎水枯乾當急救其陰也凡烈焰近炙則燔手漸高則愈冷緣冷氣乃火逼所致熱病之舌黑即此理也取喻甚的太陽行身之表是身之背也三陰行身之裡是身之前也少陽則半表半裡譬如該補中宮而邪熱未除補中益氣湯合小柴胡以治其少陽是半表半裡也少陽主半表半裡乃其經也然循行之部又在身之側也生脈散人參君麥冬臣五味佐上方如無人參以枸杞代之八味飲附子使肉桂使熟地君丹皮佐茯苓君澤瀉佐山藥臣萸肉臣逍遙散柴胡臣白芍臣歸身君白朮臣茯苓佐廣皮佐薄荷使甘草臣丹皮使山梔使上方加生薑大棗邪甚者加酒芩連虛者配人參
